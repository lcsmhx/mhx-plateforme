<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Email, mot de passe et accords</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:'IBM Plex Sans',sans-serif;color:inherit;cursor:pointer}
input::placeholder{color:rgba(255,255,255,0.35)}
h1,h2{text-wrap:balance}
p{text-wrap:pretty}
select{appearance:none;-webkit-appearance:none}
@keyframes mhx-tick{from{opacity:0.12;transform:scaleY(0.4)}to{opacity:1;transform:scaleY(1)}}
@keyframes mhx-pop{from{opacity:0;transform:scale(0.4)}to{opacity:1;transform:scale(1)}}
@keyframes mhx-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.mhx-ring{animation:mhx-spin 1.1s linear infinite;transform-origin:50% 50%}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; background: #07090d; color: #F4F5F7; font-family: 'IBM Plex Sans', sans-serif">
<div style="position: absolute; left: -90px; top: -70px; width: 340px; height: 340px; border-radius: 170px; background: rgba(160,148,128,0.40); filter: blur(70px)"></div>
<div style="position: absolute; right: -110px; top: 250px; width: 320px; height: 320px; border-radius: 160px; background: rgba(72,88,118,0.55); filter: blur(80px)"></div>
<div style="position: absolute; left: 30px; bottom: -130px; width: 320px; height: 280px; border-radius: 140px; background: rgba(212,168,68,0.16); filter: blur(80px)"></div>
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 28px 24px 32px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 16px"><div style="flex: none; width: 44px; height: 44px"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14)"><div style="width: 70%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div></div><h1 style="margin: 32px 0 0; font-size: 32px; font-weight: 700; line-height: 1.15">Ton programme est prêt 🔓</h1><p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #a3abb8">Crée ton espace pour le débloquer et le garder.</p><div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px"><label for="email" style="font-size: 15px; font-weight: 500; color: #a3abb8">Email</label><input id="email" type="email" placeholder="ton@email.com" style="box-sizing: border-box; width: 100%; height: 60px; padding: 0 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: #F4F5F7; font-family: 'IBM Plex Sans', sans-serif; font-size: 18px"></div><div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px"><label for="mdp" style="font-size: 15px; font-weight: 500; color: #a3abb8">Mot de passe (8 caractères minimum)</label><div style="position: relative"><input id="mdp" type="password" style="box-sizing: border-box; width: 100%; height: 60px; padding: 0 96px 0 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: #F4F5F7; font-family: 'IBM Plex Sans', sans-serif; font-size: 18px"><button type="button" style="position: absolute; right: 6px; top: 8px; height: 44px; padding: 0 12px; border: 0; background: transparent; font-size: 15px; color: #a3abb8">Afficher</button></div></div><div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px"><label style="box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: flex; gap: 14px; align-items: flex-start; font-size: 14.5px; line-height: 1.45"><input type="checkbox" onChange="{{toggle}}" style="flex: none; width: 24px; height: 24px; margin: 0; accent-color: {{accent}}"><span>J’ai 18 ans ou plus et j’accepte les <a href="#cgu" style="color: {{accent}}; text-decoration: underline">CGU</a> et la <a href="#confidentialite" style="color: {{accent}}; text-decoration: underline">politique de confidentialité</a>.</span></label><label style="box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: flex; gap: 14px; align-items: flex-start; font-size: 14.5px; line-height: 1.45"><input type="checkbox" style="flex: none; width: 24px; height: 24px; margin: 0; accent-color: {{accent}}"><span>Je veux recevoir les conseils et les offres de MHX Coaching par email.</span></label></div><div style="margin-top: auto; padding-top: 16px"><a href="Telephone.dc.html" style="box-sizing: border-box; width: 100%; height: 56px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaColor}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Continuer</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4A844"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4A844';
    const ok = !!(this.state && this.state.ok);
    return {
      accent,
      ctaBg: ok ? accent : 'rgba(255,255,255,0.12)',
      ctaColor: ok ? '#07090d' : 'rgba(255,255,255,0.45)',
      toggle: (e) => this.setState({ ok: !!(e && e.target && e.target.checked) })
    };
  }
}
</script>
</body>
</html>
