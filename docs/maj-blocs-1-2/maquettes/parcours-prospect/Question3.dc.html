<div style="display: flex; align-items: center; gap: 16px"><a href="Question2.dc.html" aria-label="Retour" style="flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14)"><div style="width: 30%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div></div><h1 style="margin: 24px 0 0; font-size: 28px; font-weight: 700; line-height: 1.15">Dans 3 mois, qu’est-ce qui changerait tout pour toi ?</h1><div style="margin-top: 18px; display: flex; flex-direction: column; gap: 8px"><sc-for list="{{options}}" as="o" hint-placeholder-count="5"><button type="button" onClick="{{o.pick}}" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 10px 16px; border-radius: 16px; border: 1px solid {{o.border}}; background: {{o.bg}}; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; font-size: 16px; line-height: 1.3"><span>{{o.label}}</span><span style="flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{o.ring}}; background: {{o.fill}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{o.selected}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#07090d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></sc-if></span></button></sc-for></div><sc-if value="{{hasReaction}}" hint-placeholder-val="{{ true }}"><div style="box-sizing: border-box; margin-top: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: flex; gap: 12px; align-items: flex-start"><span style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: rgba(212,168,68,0.18); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></span><span style="font-size: 15px; line-height: 1.45">{{reaction}}</span></div></sc-if><div style="margin-top: auto; padding-top: 16px"><a href="Sexe.dc.html" style="box-sizing: border-box; width: 100%; height: 56px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaColor}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Continuer</a></div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4A844"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4A844';
    const MAX = 1;
    const picked = this.state && this.state.picked ? this.state.picked : [3];
    const labels = ["Rentrer à nouveau dans mes vêtements préférés", "M’aimer sur les photos", "Avoir de l’énergie toute la journée", "Tenir une routine sans me forcer", "Retrouver confiance en moi"];
    const reactions = ["Un repère très concret, c’est bien. On avance vers ça, étape par étape.", "Se sentir bien dans son corps, ça se construit pas à pas. Ton programme est là pour ça.", "L’énergie, ça se travaille. On commence par les bases qui comptent le plus.", "C’est exactement ce que vise ton programme : des habitudes simples, qui s’installent sans bras de fer.", "La confiance se reconstruit avec des petites victoires. On va t’en donner régulièrement."];
    const toggle = (i) => {
      let next = picked.slice();
      if (MAX === 1) {
        next = [i];
      } else if (next.includes(i)) {
        next = next.filter((x) => x !== i);
      } else {
        next.push(i);
        if (next.length > MAX) next.shift();
      }
      this.setState({ picked: next });
    };
    const last = picked.length ? picked[picked.length - 1] : -1;
    const has = last >= 0;
    return {
      accent,
      hasReaction: has,
      reaction: has ? reactions[last] : '',
      ctaBg: has ? accent : 'rgba(255,255,255,0.12)',
      ctaColor: has ? '#07090d' : 'rgba(255,255,255,0.45)',
      options: labels.map((label, i) => {
        const on = picked.includes(i);
        return {
          label,
          selected: on,
          border: on ? accent : 'rgba(255,255,255,0.14)',
          bg: on ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)',
          ring: on ? accent : 'rgba(255,255,255,0.35)',
          fill: on ? accent : 'transparent',
          pick: () => toggle(i)
        };
      })
    };
  }
}
</script>
