<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4A844"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4A844';
    const MAX = 2;
    const picked = this.state && this.state.picked ? this.state.picked : [3];
    const labels = ["Le manque de temps", "Je craque sur la nourriture", "Je ne sais pas quoi faire exactement", "La motivation retombe vite", "J’ai déjà tout essayé, rien ne dure", "Personne pour me suivre et me recadrer"];
    const reactions = ["On y a pensé. Ton programme avance par petites étapes, faciles à glisser dans une journée chargée.", "Ça arrive, et ce n’est pas un manque de volonté. On commence par des bases simples pour reprendre la main.", "Justement, c’est le rôle de ton programme : tu sauras quoi faire, et dans quel ordre.", "Normal. Tu avances par petites étapes, pas besoin d’être motivé tous les jours.", "Alors on change d’approche : des petites étapes qui durent, pas un énième programme extrême.", "Tu n’avances pas seul. Ton coach est là pour faire le point avec toi et t’aider à tenir le cap."];
    const toggle = (i) => {
      let next = picked.slice();
      if (MAX === 1) {
        next = [i];
      } else if (next.includes(i)) {
        next = next.filter((x) => x !== i);
      } else {
        next.push(i);
        if (next.length > MAX) next.shift();
      }
      this.setState({ picked: next });
    };
    const last = picked.length ? picked[picked.length - 1] : -1;
    const has = last >= 0;
    return {
      accent,
      hasReaction: has,
      reaction: has ? reactions[last] : '',
      ctaBg: has ? accent : 'rgba(255,255,255,0.12)',
      ctaColor: has ? '#07090d' : 'rgba(255,255,255,0.45)',
      options: labels.map((label, i) => {
        const on = picked.includes(i);
        return {
          label,
          selected: on,
          border: on ? accent : 'rgba(255,255,255,0.14)',
          bg: on ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)',
          ring: on ? accent : 'rgba(255,255,255,0.35)',
          fill: on ? accent : 'transparent',
          pick: () => toggle(i)
        };
      })
    };
  }
}
</script>
