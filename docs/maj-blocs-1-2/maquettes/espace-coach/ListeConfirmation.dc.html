-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: flex; align-items: flex-end"><div style="box-sizing: border-box; width: 100%; padding: 22px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.18); background: rgba(20,22,28,0.92); display: flex; flex-direction: column; gap: 10px"><div style="font-size: 20px; font-weight: 700; line-height: 1.2">{{confirmTitle}}</div><div style="font-size: 14.5px; line-height: 1.5; color: #a3abb8">Cette action est définitive.</div><div style="margin-top: 8px; display: flex; gap: 10px"><button type="button" onClick="{{cancelConfirm}}" style="flex: 1; height: 54px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: #F4F5F7; font-size: 16px; font-weight: 600">Annuler</button><button type="button" onClick="{{doDelete}}" style="flex: 1; height: 54px; border-radius: 14px; border: 1px solid #F87171; background: rgba(248,113,113,0.2); color: #F87171; font-size: 16px; font-weight: 600">Supprimer</button></div></div></div></sc-if><sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 20px; right: 20px; top: 16px; box-sizing: border-box; padding: 12px 16px; border-radius: 14px; border: 1px solid {{accent}}; background: rgba(20,22,28,0.92); font-size: 14.5px; font-weight: 600; text-align: center">{{toast}}</div></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4A844"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4A844';
    const S = this.state || {};
    const DATA = {"clients": [{"id": "c1", "nom": "Camille R.", "ini": "CR", "feu": "#4ADE80", "sous": "Retour de la semaine à lire", "droite": "−2,4 kg", "tags": ["traiter"], "dcol": "#F4F5F7"}, {"id": "c2", "nom": "Thomas B.", "ini": "TB", "feu": "#F87171", "sous": "Inactif depuis 12 j", "droite": "+0,6 kg", "tags": ["traiter", "inactif"], "dcol": "#F4F5F7"}, {"id": "c3", "nom": "Sarah L.", "ini": "SL", "feu": "#FBBF24", "sous": "😞 non traité", "droite": "−1,1 kg", "tags": ["traiter"], "dcol": "#F4F5F7"}, {"id": "c4", "nom": "Mehdi K.", "ini": "MK", "feu": "#4ADE80", "sous": "Connecté il y a 1 j", "droite": "−3,8 kg", "tags": [], "dcol": "#F4F5F7"}, {"id": "c5", "nom": "Julie P.", "ini": "JP", "feu": "#FBBF24", "sous": "Note en chute", "droite": "−0,4 kg", "tags": ["traiter"], "dcol": "#F4F5F7"}, {"id": "c6", "nom": "Antoine D.", "ini": "AD", "feu": "#4ADE80", "sous": "Connecté il y a 2 j", "droite": "+1,2 kg", "tags": [], "dcol": "#F4F5F7"}, {"id": "c7", "nom": "Inès M.", "ini": "IM", "feu": "#4ADE80", "sous": "Connectée aujourd’hui", "droite": "−5,0 kg", "tags": [], "dcol": "#F4F5F7"}, {"id": "c8", "nom": "Hugo T.", "ini": "HT", "feu": "#F87171", "sous": "Inactif depuis 10 j", "droite": "—", "tags": ["traiter", "inactif"], "dcol": "#F4F5F7"}], "prospects": [{"id": "p1", "nom": "Léa G.", "ini": "LG", "feu": "#D4A844", "sous": "Inscrite il y a 2 j · à traiter", "droite": "Bilan à faire", "tags": ["traiter"], "dcol": "#F4F5F7"}, {"id": "p2", "nom": "Nicolas F.", "ini": "NF", "feu": "#D4A844", "sous": "Inscrit il y a 5 j · à traiter", "droite": "Bilan à faire", "tags": ["traiter"], "dcol": "#F4F5F7"}, {"id": "p3", "nom": "Manon C.", "ini": "MC", "feu": "#D4A844", "sous": "Inscrite il y a 1 j · à traiter", "droite": "Questionnaire fait", "tags": ["traiter"], "dcol": "#F4F5F7"}, {"id": "p4", "nom": "Yanis B.", "ini": "YB", "feu": "#4ADE80", "sous": "Bilan fait le 9 octobre", "droite": "Bilan fait", "tags": ["bilan"], "dcol": "#F4F5F7"}, {"id": "p5", "nom": "Clara V.", "ini": "CV", "feu": "#4ADE80", "sous": "Bilan fait le 6 octobre", "droite": "Bilan fait", "tags": ["bilan"], "dcol": "#F4F5F7"}, {"id": "p6", "nom": "Paul A.", "ini": "PA", "feu": "#6B7280", "sous": "Inscrit il y a 12 j", "droite": "Inactif", "tags": [], "dcol": "#F4F5F7"}]};
    const tab = S.tab ?? 'clients';
    const selectMode = S.sel ?? true;
    const picked = S.picked ?? ["c2", "c3", "c5"];
    const confirm = S.confirm ?? true;
    const deleted = S.deleted ?? [];
    const q = (S.q ?? '').trim();
    const f = S.f ?? 'tous';
    const toast = S.toast ?? '';
    const set = (o) => this.setState(o);
    const norm = (t) => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const base = DATA[tab].filter((r) => !deleted.includes(r.id));
    const list = base.filter((r) => norm(r.nom).includes(norm(q)) && (f === 'tous' || r.tags.includes(f)));
    const toggle = (id) => set({ picked: picked.includes(id) ? picked.filter((x) => x !== id) : picked.concat(id) });
    const n = picked.length;
    const isC = tab === 'clients';
    const word = isC ? (n > 1 ? 'clients' : 'client') : (n > 1 ? 'prospects' : 'prospect');
    const defs = isC ? [['tous', 'Tous'], ['traiter', 'À traiter'], ['inactif', 'Inactifs']] : [['tous', 'Tous'], ['traiter', 'À traiter'], ['bilan', 'Bilan fait']];
    const on = 'rgba(212,168,68,0.14)';
    return {
      accent,
      title: isC ? 'Clients' : 'Prospects',
      countText: list.length + (isC ? (list.length > 1 ? ' clients' : ' client') : (list.length > 1 ? ' prospects' : ' prospect')),
      placeholder: isC ? 'Rechercher un client par son nom' : 'Rechercher un prospect par son nom',
      selectMode, notSel: !selectMode, confirm, hasToast: !!toast, toast, empty: list.length === 0,
      cBg: isC ? 'rgba(255,255,255,0.14)' : 'transparent', cCol: isC ? '#F4F5F7' : '#a3abb8',
      pBg: isC ? 'transparent' : 'rgba(255,255,255,0.14)', pCol: isC ? '#a3abb8' : '#F4F5F7',
      navCc: isC ? accent : '#a3abb8', navCb: isC ? on : 'transparent', navPc: isC ? '#a3abb8' : accent, navPb: isC ? 'transparent' : on,
      goClients: () => set({ tab: 'clients', f: 'tous', picked: [], q: '' }),
      goProspects: () => set({ tab: 'prospects', f: 'tous', picked: [], q: '' }),
      onSearch: (e) => set({ q: e.target.value }),
      startSel: () => set({ sel: true, picked: [] }),
      cancelSel: () => set({ sel: false, picked: [], confirm: false }),
      selectAll: () => set({ picked: list.map((r) => r.id) }),
      askDelete: () => { if (n > 0) set({ confirm: true }); },
      cancelConfirm: () => set({ confirm: false }),
      doDelete: () => set({ deleted: deleted.concat(picked), picked: [], confirm: false, sel: false, toast: n + ' ' + word + (n > 1 ? ' supprimés' : ' supprimé') }),
      pickedLabel: n + (n > 1 ? ' sélectionnés' : ' sélectionné'),
      confirmTitle: 'Supprimer ' + n + ' ' + word + '\u00a0?',
      delBg: n > 0 ? 'rgba(248,113,113,0.16)' : 'rgba(255,255,255,0.06)',
      delBorder: n > 0 ? '#F87171' : 'rgba(255,255,255,0.14)',
      delCol: n > 0 ? '#F87171' : '#a3abb8',
      chips: defs.map((d) => ({
        label: d[1], tap: () => set({ f: d[0] }),
        bg: f === d[0] ? on : 'rgba(255,255,255,0.06)', border: f === d[0] ? accent : 'rgba(255,255,255,0.14)', col: f === d[0] ? accent : '#a3abb8'
      })),
      rows: list.map((r) => {
        const sel = picked.includes(r.id);
        return {
          nom: r.nom, initiales: r.ini, sous: r.sous, droite: r.droite, dcol: r.dcol, feu: r.feu,
          href: 'FicheSuivi.dc.html', sm: selectMode, isPicked: sel,
          border: sel ? accent : 'rgba(255,255,255,0.14)', bg: sel ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)',
          ring: sel ? accent : 'rgba(255,255,255,0.35)', fill: sel ? accent : 'transparent',
          tap: (e) => { if (selectMode) { e.preventDefault(); toggle(r.id); } }
        };
      })
    };
  }
}
</script>
