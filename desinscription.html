<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Emails de suivi — MHX Coaching</title>
<!-- v51 — Page « Ne plus recevoir ces emails » (lien des emails de suivi envoyés par la fonction emails-prospects).
     Rien ne se passe à l'ouverture : un antivirus ou un aperçu qui visite le lien ne désinscrit personne.
     Le bouton envoie la demande signée (u, t) à la fonction, qui coupe les emails de suivi (clé « emails »). -->
<style>
  :root{--fond:#f4f2ee;--carte:#fff;--encre:#1c1c1c;--doux:#666;--or:#8a6a1c;--bouton:#c9a24a;--ligne:#ddd6c8;--bon:#2f6b3a;--mauvais:#a33a2a}
  @media (prefers-color-scheme: dark){:root{--fond:#15140f;--carte:#1f1d17;--encre:#eee9dc;--doux:#aaa392;--or:#d9b865;--bouton:#c9a24a;--ligne:#3a362b;--bon:#7dc48a;--mauvais:#e58a7a}}
  body{margin:0;background:var(--fond);color:var(--encre);font-family:Helvetica,Arial,sans-serif}
  main{max-width:520px;margin:0 auto;padding:48px 16px}
  .carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:24px}
  .marque{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--or);margin:0 0 14px}
  h1{font-size:22px;line-height:1.3;margin:0 0 12px}
  p{font-size:16px;line-height:1.55;margin:0 0 14px}
  button{font:inherit;font-weight:700;background:var(--bouton);color:#111;border:0;border-radius:8px;padding:13px 22px;cursor:pointer}
  button[disabled]{opacity:.6;cursor:default}
  .msg{min-height:1.5em;margin-top:14px}
  .msg.ok{color:var(--bon)} .msg.ko{color:var(--mauvais)}
  a{color:var(--or)}
</style>
</head>
<body>
<main>
  <div class="carte">
    <p class="marque">MHX Coaching</p>
    <h1 id="titre">Ne plus recevoir les emails de suivi</h1>
    <p id="texte">Tu ne recevras plus les rappels et conseils liés à ta découverte. L'email de confirmation de ton compte et ton accès à l'app ne changent pas.</p>
    <button type="button" id="confirmer">Confirmer</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p style="margin:18px 0 0;font-size:14px;color:var(--doux)">Tu peux changer d'avis à tout moment depuis ton Profil, dans l'app. <a href="./">Ouvrir l'app</a></p>
  </div>
</main>
<script>
(function(){
  var FONCTION = "https://nzynbuczmogifuidcjed.supabase.co/functions/v1/emails-prospects";
  var q = new URLSearchParams(location.search), u = q.get("u") || "", t = q.get("t") || "";
  var bouton = document.getElementById("confirmer"), msg = document.getElementById("msg");
  var valide = /^[0-9a-f-]{36}$/i.test(u) && /^[0-9a-f]{64}$/.test(t);
  function dire(texte, classe){ msg.textContent = texte; msg.className = "msg " + (classe || ""); }
  if (!valide){
    bouton.hidden = true;
    document.getElementById("titre").textContent = "Lien non valable";
    document.getElementById("texte").textContent = "Ce lien de désinscription est incomplet. Tu peux couper les emails de suivi depuis ton Profil, dans l'app.";
    return;
  }
  bouton.addEventListener("click", function(){
    bouton.disabled = true; dire("Un instant…");
    fetch(FONCTION + "?action=desinscription&u=" + encodeURIComponent(u) + "&t=" + encodeURIComponent(t), { method: "POST" })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok && d && d.ok === true, statut: r.status }; }); })
      .then(function(r){
        if (r.ok){ bouton.hidden = true; document.getElementById("titre").textContent = "C'est noté"; document.getElementById("texte").textContent = "Tu ne recevras plus les emails de suivi de ta découverte. Ton accès à l'app ne change pas."; dire(""); return; }
        bouton.disabled = false;
        dire(r.statut === 400 ? "Ce lien n'est pas valable. Coupe les emails de suivi depuis ton Profil, dans l'app." : "Ça n'a pas marché. Réessaie dans un instant, ou coupe les emails depuis ton Profil.", "ko");
      })
      .catch(function(){ bouton.disabled = false; dire("Pas de connexion. Réessaie dans un instant, ou coupe les emails depuis ton Profil.", "ko"); });
  });
})();
</script>
</body>
</html>
