<!--
=====================================================================
  PLATEFORME MHX COACHING — la page ; [A] à [C] dans css/, [D] à [G] dans js/ (52.1)
  ---------------------------------------------------------------
  COMMENT S'Y RETROUVER (dans l'ordre de chargement) :

  [A] JETONS DE DESIGN .... couleurs, ombres, thème clair/sombre
  [B] STYLES COMMUNS ...... mise en page, boutons, champs, tableaux
  [C] STYLES DES OUTILS ... styles propres à chaque outil
  [D] CONFIG .............. textes de marque + TOUTES les constantes
                            de calcul (macros, facteurs d'activité,
                            zones de mensuration, modèle de séance)
  [E] BOÎTE À OUTILS ...... helpers, stockage, composant graphique
  [F] OUTILS .............. un objet par outil : id, nom, html, init
  [G] NAVIGATION ......... barre du haut + routage par #ancre
  ---------------------------------------------------------------
  POUR AJOUTER UN OUTIL : un fichier js/outilXxx.js (copier un outil
  de [F] : id / nom / icone / html() / init()), l'ajouter à MHX_JS
  (avant js/liste-outils.js) et au tableau OUTILS de js/liste-outils.js.
  La navigation se construit toute seule.
=====================================================================
-->
<script>
/* 52.1 : le CSS est dans css/ et le JavaScript dans js/ (un fichier par outil, les blocs communs à part,
   le démarrage en dernier). MHX_FICHIERS est le SEUL endroit où s'écrit le numéro ajouté (?v=) à chaque
   lien : un navigateur ne garde jamais un ancien fichier après une nouvelle version. Les balises sont écrites
   ici même, dans l'ordre (document.write) : chargement synchrone et ordonné, comme quand tout était dans ce
   fichier. Un fichier ajouté à css/ ou js/ doit être ajouté à sa liste (le banc le vérifie : rig.js). */
var MHX_FICHIERS = "54";
var MHX_CSS = [
    "css/jetons.css",
    "css/communs.css",
    "css/outils.css"
];
var MHX_JS = [
    "js/config.js",
    "js/boite-a-outils.js",
    "js/i18n.js",
    "js/interface.js",
    "js/auth-store.js",
    "js/graphique.js",
    "js/echauffements.js",
    "js/outilCalculateur.js",
    "js/tracking.js",
    "js/outilMensurations.js",
    "js/outilEntrainement.js",
    "js/outilProfil.js",
    "js/outilProgramme.js",
    "js/outilNutrition.js",
    "js/outilBilan.js",
    "js/outilBibliotheque.js",
    "js/outilCatalogue.js",
    "js/outilClients.js",
    "js/outilProspects.js",
    "js/outilTableau.js",
    "js/outilFormation.js",
    "js/outilComplements.js",
    "js/outilAtelier.js",
    "js/outilAccueil.js",
    "js/outilSuivi.js",
    "js/outilDecouverte.js",
    "js/outilJournal.js",
    "js/liste-outils.js",
    "js/navigation.js",
    "js/installation.js",
    "js/connexion.js",
    "js/demarrage.js"
];
document.write(MHX_CSS.map(function (f) { return '<link rel="stylesheet" href="' + f + '?v=' + MHX_FICHIERS + '">'; }).join(""));
</script>
