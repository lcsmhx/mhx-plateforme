<!--
=====================================================================
  PLATEFORME MHX COACHING — fichier unique, autonome
  ---------------------------------------------------------------
  COMMENT S'Y RETROUVER (dans l'ordre du fichier) :

  [A] JETONS DE DESIGN .... couleurs, ombres, thème clair/sombre
  [B] STYLES COMMUNS ...... mise en page, boutons, champs, tableaux
  [C] STYLES DES OUTILS ... styles propres à chaque outil
  [D] CONFIG .............. textes de marque + TOUTES les constantes
                            de calcul (macros, facteurs d'activité,
                            zones de mensuration, modèle de séance)
  [E] BOÎTE À OUTILS ...... helpers, stockage, composant graphique
  [F] OUTILS .............. un objet par outil : id, nom, html, init
  [G] NAVIGATION ......... barre du haut + routage par #ancre
  ---------------------------------------------------------------
  POUR AJOUTER UN 4e OUTIL : copier un objet de la section [F],
  changer id / nom / icone / html() / init(), et l'ajouter au
  tableau OUTILS tout en bas de cette même section. Rien d'autre
  à toucher : la navigation se construit toute seule.
=====================================================================
-->
<style>
/* ==================================================================
   [A] JETONS DE DESIGN (v33 — design system MHX)
   Change une couleur ici et tout le site suit.
   Le SOMBRE est le theme de l'application. Le clair reste disponible
   (bouton dans la barre du haut) et se range sur l'appareil, cle
   « mhx_theme ». Le dore est un ACCENT : boutons principaux, etats
   actifs, chiffres cles — jamais une couleur de fond.
   ================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --ground:#07090d; --surface:#0e1218; --sunken:#0a0d12; --raised:#141a23;
  --ink:#eef1f5; --ink-2:#a3abb8; --ink-3:#6c7482;
  --line:#1b212b; --line-strong:#2a3340;
  --accent:#d4a844; --accent-ink:#0a0d13; --accent-soft:rgba(212,168,68,.10); --accent-line:rgba(212,168,68,.38);
  --good:#3fc27b; --good-soft:rgba(63,194,123,.12);
  --warn:#e6a53c; --warn-soft:rgba(230,165,60,.12);
  --bad:#e5645e;  --bad-soft:rgba(229,100,94,.12);
  --s1:#4a8fe8; --s2:#e0673a; --s3:#22b07c; --s4:#d4a844;
  --grid:#1d232d; --axis:#313a46;
  --nav-bg:rgba(7,9,13,.86);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -18px rgba(0,0,0,.7);
  --r-sm:6px; --r:10px; --r-lg:14px;
  --vite:.16s; --doux:.32s;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#f1f2f4; --surface:#ffffff; --sunken:#f5f6f8; --raised:#ffffff;
  --ink:#0d1117; --ink-2:#4b5260; --ink-3:#737b89;
  --line:#e1e4e9; --line-strong:#c8cdd6;
  --accent:#9a7420; --accent-ink:#ffffff; --accent-soft:rgba(154,116,32,.10); --accent-line:rgba(154,116,32,.35);
  --good:#1a8a4a; --good-soft:rgba(26,138,74,.10);
  --warn:#a56a12; --warn-soft:rgba(165,106,18,.10);
  --bad:#c2403b;  --bad-soft:rgba(194,64,59,.10);
  --s1:#2a78d6; --s2:#d95926; --s3:#159a6a; --s4:#b8891a;
  --grid:#e6e9ee; --axis:#c3c7cf;
  --nav-bg:rgba(241,242,244,.9);
  --shadow:0 1px 2px rgba(10,13,19,.05),0 8px 24px -14px rgba(10,13,19,.16);
}

/* ==================================================================
   [B] STYLES COMMUNS (v33 — design system MHX)
   Une seule famille de composants pour toutes les pages : carte
   (.panel), stat card (.tile / .tuile), barre (.bar / .jauge), badge
   (.pastille), bouton (.btn), champ, onglet, alerte (.flag), etat vide
   (.empty), etat verrouille (.verrou), avatar, timeline, carte
   objectif (.objectif), interrupteur (.switch), fenetre (.modale),
   volet (.volet), toast. Les anciens noms de classes sont conserves.
   ================================================================== */
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
@media (min-width:720px){.wrap{padding:0 24px}}
::selection{background:var(--accent-soft);color:var(--ink)}

/* --- barre de navigation --- */
.topbar{position:sticky;top:0;z-index:20;background:var(--nav-bg);backdrop-filter:saturate(140%) blur(12px);-webkit-backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand .b-name{font-family:"Oswald",Impact,sans-serif;font-weight:600;font-size:18px;letter-spacing:.09em;text-transform:uppercase}
.brand .b-sub{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;min-height:38px;
  padding:8px 13px;border-radius:999px;border:1px solid transparent;color:var(--ink-2);
  font-size:14px;font-weight:500;transition:color var(--vite),border-color var(--vite),background var(--vite)}
.nav a:hover{color:var(--ink);background:var(--raised)}
.nav a[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.nav .ico{font-size:14px;line-height:1;opacity:.85;display:inline-flex}
.nav .ico svg,.barre-bas .ico svg,.menu-plus .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"] .ico{opacity:1}

/* --- barre du bas (telephone) : 4 onglets + « Plus » --- */
.barre-bas{display:none}
.menu-plus{list-style:none;margin:0;padding:0}
.menu-plus li{border-bottom:1px solid var(--line)}
.menu-plus a{display:flex;align-items:center;gap:12px;padding:13px 4px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:500}
.menu-plus a .ico{display:inline-flex;color:var(--ink-3)}
.menu-plus a .ico svg{width:20px;height:20px}
.menu-plus a[aria-current="page"]{color:var(--accent)} .menu-plus a[aria-current="page"] .ico{color:var(--accent)}
@media (max-width:720px){
  .topbar .nav{display:none}
  main{padding-bottom:96px}
  .barre-bas{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:stretch;
    background:var(--nav-bg);backdrop-filter:saturate(140%) blur(12px);-webkit-backdrop-filter:saturate(140%) blur(12px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .barre-bas[hidden]{display:none}
  .barre-bas a,.barre-bas button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;
    background:none;border:0;padding:4px 2px;border-radius:var(--r);color:var(--ink-3);text-decoration:none;font-family:inherit;cursor:pointer;
    transition:color var(--vite),background var(--vite)}
  .barre-bas .ico{display:inline-flex}
  .barre-bas .ico svg{width:22px;height:22px;stroke-width:1.7}
  .barre-bas .lbl{font-size:10.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .barre-bas a[aria-current="page"],.barre-bas button.ici{color:var(--accent)}
  .barre-bas a[aria-current="page"] .ico{background:var(--accent-soft);border-radius:999px;padding:3px 10px;margin:-3px -10px}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
}

/* --- en-tête d'outil --- */
.masthead{padding:28px 0 20px;margin-bottom:22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:clamp(24px,4.2vw,32px);line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{color:var(--ink-2);max-width:62ch;margin:0;font-size:15px}

/* --- blocs --- */
main{padding-bottom:70px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);
  animation:apparition var(--doux) ease both}
@media (min-width:720px){.panel{padding:24px}}
.panel + .panel{margin-top:16px}
@keyframes apparition{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0 0 14px}
h3{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;font-weight:500}
input,select,textarea{width:100%;background:var(--sunken);color:var(--ink);border:1px solid var(--line-strong);
  border-radius:var(--r-sm);padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:15px;font-variant-numeric:tabular-nums;
  transition:border-color var(--vite),box-shadow var(--vite)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--sunken);padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:0;color:var(--ink-2);padding:8px 10px;border-radius:4px;
  font-family:"IBM Plex Sans",sans-serif;font-size:14px;cursor:pointer;transition:background var(--vite),color var(--vite)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;text-decoration:none;
  padding:9px 18px;font-family:"IBM Plex Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;
  transition:filter var(--vite),background var(--vite),border-color var(--vite),color var(--vite),transform var(--vite)}
button.btn:hover,a.btn:hover{filter:brightness(1.06)}
button.btn:active,a.btn:active{transform:translateY(1px)}
button.btn:disabled{opacity:.55;cursor:default;filter:none;transform:none}
button.ghost,a.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
button.ghost:hover,a.btn.ghost:hover{color:var(--ink);border-color:var(--accent);filter:none;background:var(--raised)}
button.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button.btn.danger:hover{background:var(--bad);color:#fff;filter:none}
button.btn.petit,a.btn.petit{min-height:32px;padding:5px 12px;font-size:13px}
.readout{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.hero-num{font-size:clamp(44px,9vw,66px);line-height:1}
.unit{font-size:14px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  text-align:right;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;font-weight:600}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:"IBM Plex Mono",monospace}
tbody tr:hover td{background:var(--sunken)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.note{font-size:13px;color:var(--ink-3);line-height:1.6}
details{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}
summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500}
summary:hover{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.msg{font-size:13px;color:var(--good);min-height:18px}
.del{background:none;border:1px solid transparent;border-radius:var(--r-sm);color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:6px 9px;min-width:32px;min-height:32px}
.del:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:34px 16px;line-height:1.6}
.co-langue{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink-3);font-size:12px;padding:5px 11px;min-height:30px;cursor:pointer;font-family:inherit}
.co-langue:hover{color:var(--ink);border-color:var(--accent)}
.co-theme{right:auto;left:14px;width:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.co-theme svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.carte-co{position:relative}
.cta-vide{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.cta-vide .btn{text-decoration:none;display:inline-flex;align-items:center}
/* Mobile : la page ne doit jamais defiler de cote. Un bloc de grille sans
   min-width:0 s'elargit a la taille du tableau qu'il contient. */
.panel,.scroll{min-width:0;max-width:100%}
/* Barre d'onglets et onglets des jours : on devine qu'il y a une suite */
.nav,.jours-onglets{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
.nav.fin,.jours-onglets.fin{-webkit-mask-image:none;mask-image:none}
@media (max-width:560px){
  .nav{order:3;flex-basis:100%;margin:0}
  .scroll table{font-size:13px}
  .scroll th,.scroll td{padding:7px 8px}
}

/* --- stat card : UNE seule, .tile et .tuile en sont deux noms --- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile,.tuile{display:flex;flex-direction:column;gap:2px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile .t-lbl,.tuile .t-lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .t-val,.tuile .t-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;line-height:1.15;margin-top:4px;color:var(--ink);letter-spacing:-.02em}
.tile .t-sub,.tuile .t-sub,.tuile .t-u{font-size:12px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.tile .t-val small,.tuile .t-val small{font-size:.45em;color:var(--ink-3);margin-left:2px;font-weight:500}
.tile.cle .t-val{color:var(--accent)}
.pos{color:var(--good)} .neg{color:var(--bad)} .moyen{color:var(--warn)}
/* les couleurs de sens gagnent sur la couleur de base de la stat card */
.tile .t-val.pos,.tuile .t-val.pos{color:var(--good)} .tile .t-val.neg,.tuile .t-val.neg{color:var(--bad)} .tile .t-val.moyen,.tuile .t-val.moyen{color:var(--warn)}
.obj-l{list-style:none;padding:0;margin:8px 0 0}
.obj-l li{padding:8px 0;border-top:1px solid var(--line)}

/* --- barre de progression : UNE seule (.bar, .jauge, .fo-jauge) --- */
.bar,.jauge,.fo-jauge{height:8px;border-radius:999px;background:var(--line);overflow:hidden;border:0}
.bar i,.jauge i,.fo-jauge-in{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}

/* --- badges de statut --- */
.pastille{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:"IBM Plex Mono",monospace;padding:2px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-3);background:transparent;white-space:nowrap;line-height:1.6}
.pastille.ok,.pastille.bon{border-color:transparent;background:var(--good-soft);color:var(--good)}
.pastille.attention,.pastille.manque{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.pastille.mauvais{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.pastille.accent,.pastille.role-coach,.pastille.fo-ok,.pastille.compl-prot{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.point{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);vertical-align:middle}
.point.ok{background:var(--good)} .point.attention{background:var(--warn)} .point.mauvais{background:var(--bad)}

/* --- historique --- */
.hist-entree{border-top:1px solid var(--line);margin-top:0;padding:12px 0}
.hist-entree summary{cursor:pointer}
.hist-entree .hist-dates{color:var(--ink-3);font-size:13px;margin-left:6px}
.hist-bloc{margin-top:14px}
.hist-bloc h3 .hist-dates{font-weight:400}
footer{border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;padding-top:20px;padding-bottom:34px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- connexion --- */
.portail{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.carte-co{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px 28px;box-shadow:var(--shadow)}
.carte-co .logo{font-family:"Oswald",Impact,sans-serif;font-weight:600;font-size:22px;letter-spacing:.09em;text-transform:uppercase;text-align:center}
.carte-co .sous{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;text-align:center;margin-bottom:22px}
.carte-co h2{text-align:center;font-size:17px;margin:18px 0 20px}
.carte-co .champ{margin-bottom:14px}
.carte-co button.btn{width:100%;padding:12px;min-height:46px}
.bascule{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-3)}
.bascule button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;font-family:inherit;text-decoration:underline;padding:0}
.erreur{background:var(--bad-soft);border-left:3px solid var(--bad);color:var(--ink-2);font-size:13px;padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-bottom:14px}
.erreur:empty{display:none}
.erreur.ok{border-left-color:var(--good);background:var(--good-soft)}

/* --- barre du haut : compte --- */
.compte{display:flex;align-items:center;gap:8px;margin-left:auto}
.compte .qui{font-size:13px;color:var(--ink-2);white-space:nowrap}
.compte button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink-3);font-size:12px;padding:6px 12px;cursor:pointer;font-family:inherit;min-height:32px}
.compte button:hover{color:var(--ink);border-color:var(--accent)}
.compte button.icone{width:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.compte button.icone svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.etat{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.etat.erreur{color:var(--warn);background:none;border:0;padding:0}

/* --- consultation d'une fiche client --- */
.bandeau{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
.bandeau strong{font-size:15px}
.bandeau .sortir{margin-left:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;min-height:36px}
.lecture-seule .panel input,.lecture-seule .panel select,.lecture-seule .panel textarea,
.lecture-seule .panel button,.lecture-seule .panel a.btn{pointer-events:none;opacity:.7}

/* --- programmes --- */
.seance{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.seance-tete{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.seance-tete > div:first-child{flex:1;min-width:200px}
.ex-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.ex-table th{font-size:10px;padding:0 8px 4px}
.ex-ligne{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;
  display:grid;grid-template-columns:2fr 70px 90px 90px 36px;gap:10px;align-items:end}
.ex-ligne .plein{grid-column:1/-1}
.ex-ligne input{padding:8px 10px;font-size:14px}
.ex-lecture{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.ex-lecture .haut{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.ex-lecture .nom{font-weight:600;font-size:15px;flex:1;min-width:160px}
.ex-lecture .chiffre{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3);white-space:nowrap}
.ex-lecture .chiffre b{color:var(--ink)}
.ex-lecture .obs{font-size:13px;color:var(--ink-3);margin-top:6px}
.biblio-l{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.biblio-l .nom{font-weight:600}
.biblio-l .actions-b{margin-left:auto;display:flex;gap:8px}
.biblio-l button{background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--ink-2);
  padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;min-height:32px}
.biblio-l button:hover{color:var(--ink);border-color:var(--accent)}
@media (max-width:640px){ .ex-ligne{grid-template-columns:1fr 1fr; } .ex-ligne .nom-c{grid-column:1/-1} }

/* --- liste des clients --- */
.client-l{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.client-l .nom{font-weight:600;font-size:15px}
.client-l .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.client-l .voir{margin-left:auto;background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--ink-2);padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;min-height:34px}
.client-l .voir:hover{color:var(--ink);border-color:var(--accent)}

/* --- fiche client --- */
.fiche-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.fiche-grille .panel + .panel{margin-top:0}
ul.fiche-l li{font-size:13.5px}
ul.fiche-l li b{font-family:"IBM Plex Sans",sans-serif;text-align:right}
a.pastille{text-decoration:none;cursor:pointer}

/* --- tableau de bord coach --- */
.tb-tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
a.tb-tuile{text-decoration:none;color:inherit;transition:border-color var(--vite)}
a.tb-tuile:hover{border-color:var(--accent-line)}
.tb-tuile.attention .t-val{color:var(--warn)}
.attention-l{display:flex;flex-direction:column;gap:10px}
.attention-c{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.attention-tete{display:flex;align-items:center;gap:12px}
.attention-nom{flex:1;min-width:0;display:flex;flex-direction:column}
.attention-nom small{font-size:12.5px;color:var(--ink-3)}
.attention-alertes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.attention-alertes .pastille{cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;padding:4px 11px;min-height:28px}
.attention-alertes .pastille:hover{filter:brightness(1.15)}
/* Mes clients : le tableau devient des cartes sur telephone */
@media (max-width:720px){
  #tb-clients{display:block}
  #tb-clients tr{display:block;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
  #tb-clients td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:5px 0;text-align:right;font-family:"IBM Plex Sans",sans-serif;font-size:14px}
  #tb-clients td::before{content:attr(data-l);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left}
  #tb-clients td:first-child{font-size:15px;justify-content:flex-start;gap:8px}
  #tb-clients td:first-child::before{display:none}
  #tb-clients td.td-actions{justify-content:flex-start;padding-top:10px}
  #tb-clients td.td-actions::before{display:none}
  #tb-clients tbody tr:hover td{background:transparent}
  .tb-clients-table{display:block}
  .tb-clients-table thead{display:none}
}

/* --- bilan hebdomadaire --- */
.checkin-q{margin-bottom:16px}
.checkin-q.echelle{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.checkin-q.echelle label{margin:0;flex:1;min-width:120px}
.seg.echelle5{max-width:260px;flex:0 0 auto;width:100%}
@media (min-width:560px){.seg.echelle5{width:260px}}
.seg.echelle5 button{min-height:36px;font-family:"IBM Plex Mono",monospace;font-weight:600}
.checkin-echelles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.checkin-echelles .pastille b{color:var(--ink);margin-left:2px}
.checkin-rep{margin:8px 0;font-size:14px;line-height:1.55}
.checkin-rep .lbl{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}
/* v38 — feedback du coach, notes privees */
.fb-entree{padding:12px 14px;border:1px solid var(--accent-line);border-radius:var(--r);background:var(--sunken)}
.fb-tete{margin-bottom:4px}
.fb-texte{margin:6px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.fb-editeur{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.fb-editeur .fb-etat{text-transform:none;letter-spacing:0;color:var(--ink-3)}
.fb-editeur .actions{margin-top:10px}
.notes-coach textarea{min-height:120px;resize:vertical}
.msg.ko,.note.ko{color:var(--bad)}
.acces.attention .ico{background:var(--warn-soft);color:var(--warn)}
.acces.statique{cursor:default}
.acces.statique:hover{border-color:var(--line);background:var(--sunken)}

/* --- regularite : evolution sur cinq semaines, objectifs a cocher --- */
.reg-evo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px;align-items:end}
.reg-evo-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.reg-evo-barre{width:100%;height:56px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.reg-evo-barre i{position:absolute;left:0;right:0;bottom:0;background:var(--ink-3);border-radius:6px;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.reg-evo-col.ici .reg-evo-barre i{background:var(--accent)}
.reg-evo-val{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.reg-evo-lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
label.objectif{cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);margin:0}
.objectif .obj-case{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.suivi-sep{margin:28px 0 14px}

/* --- programme : carte de tete et cartes de seance --- */
.prog-tete-haut{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.prog-tete-haut > div:first-child{flex:1;min-width:200px}
.prog-compteur{min-width:150px}
.seance-c-tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.seance-c-tete h2{margin:0;flex:1}
.seance-c.faite{border-color:var(--good-soft)}
.seance-c.faite .ex-lecture{opacity:.85}

/* --- acces rapides de l'accueil --- */
.acces-l{display:flex;flex-direction:column;gap:8px}
.acces{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);text-decoration:none;transition:border-color var(--vite),background var(--vite)}
.acces:hover{border-color:var(--accent-line);background:var(--raised)}
.acces .ico{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.acces .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acces.fait .ico{background:var(--good-soft);color:var(--good)}
.acces .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.acces .txt b{font-size:15px;font-weight:600}
.acces .txt small{font-size:13px;color:var(--ink-3)}
.acces .fleche{color:var(--ink-3);font-size:20px;line-height:1}

/* --- avatar (initiales) --- */
.avatar{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;letter-spacing:.02em;flex:0 0 auto;border:1px solid var(--accent-line)}
.avatar.grand{width:52px;height:52px;font-size:17px}
.avatar.neutre{background:var(--raised);color:var(--ink-2);border-color:var(--line-strong)}

/* --- timeline (historique, feedbacks) --- */
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--line-strong)}
.timeline li{position:relative;padding:0 0 18px 14px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--ink-3);border:2px solid var(--surface)}
.timeline li.accent::before{background:var(--accent)} .timeline li.ok::before{background:var(--good)}
.timeline .quand{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.timeline .quoi{margin-top:2px;font-size:14px;color:var(--ink);line-height:1.6}

/* --- carte objectif --- */
.objectif{display:flex;align-items:flex-start;gap:12px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.objectif + .objectif{margin-top:10px}
.objectif .num{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-weight:600;padding-top:3px}
.objectif .texte{flex:1;font-size:15px;line-height:1.5}
.objectif.atteint .texte{color:var(--ink-2)}
.objectif.rate{border-color:var(--bad-soft)}

/* --- etat verrouille (fonctionnalite reservee a l'accompagnement) --- */
.verrou{text-align:center;padding:34px 20px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);background:var(--sunken)}
.verrou .cadenas{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.verrou .cadenas svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.verrou h2{margin-bottom:6px}
/* v40 — onglets verrouilles (mode gratuit) */
.nav-cadenas{display:inline-flex;margin-left:6px;opacity:.7;vertical-align:-1px}
/* le texte « (verrouillé) » des lecteurs d'ecran (.sr-only, en absolu) reste dans son lien : sinon il deborde de la barre du haut */
.nav a,.menu-plus a,.barre-bas a.verrouille{position:relative}
.barre-bas a.verrouille .nav-cadenas{position:absolute;top:7px;left:calc(50% + 9px);margin:0}
.nav-cadenas svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.barre-bas a.verrouille .ico{opacity:.55}
.verrou-plus{text-align:center;margin:14px auto 0;max-width:520px}
.liste-debloque{margin:0;padding-left:20px;line-height:1.8;font-size:14.5px}
.verrou p{margin:0 auto;max-width:44ch;color:var(--ink-2);font-size:14px;line-height:1.6}
.verrou .actions{justify-content:center}

/* --- interrupteur --- */
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:400;margin:0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .piste{width:40px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;transition:background var(--vite);flex:0 0 auto}
.switch .piste::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--vite)}
.switch input:checked + .piste{background:var(--accent)}
.switch input:checked + .piste::after{transform:translateX(18px)}
.switch input:focus-visible + .piste{outline:2px solid var(--accent);outline-offset:2px}

/* --- fenetres (modale), volet lateral, toasts --- */
.fond{position:fixed;inset:0;z-index:60;background:rgba(3,5,8,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fondu var(--vite) ease both}
@keyframes fondu{from{opacity:0}to{opacity:1}}
.modale{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:22px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.8);animation:apparition var(--doux) cubic-bezier(.2,.7,.2,1) both}
.modale h2{margin-bottom:8px;font-size:17px}
.modale .corps{font-size:14px;color:var(--ink-2);line-height:1.6;white-space:pre-line}
.modale .champ{margin-top:14px}
.modale .actions{margin-top:20px;justify-content:flex-end}
@media (max-width:560px){
  .fond{align-items:flex-end;padding:0}
  .modale{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation-name:glisse}
  .modale .actions{flex-direction:column-reverse;align-items:stretch}
  .modale .actions .btn{width:100%}
}
@keyframes glisse{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.fond.volet-fond{align-items:stretch;justify-content:flex-end;padding:0}
.volet{width:100%;max-width:460px;height:100%;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line-strong);padding:22px;
  animation:volet var(--doux) cubic-bezier(.2,.7,.2,1) both}
@keyframes volet{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.volet .fermer-volet{position:absolute;top:12px;right:12px}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;max-width:420px;width:auto;background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);border-left:3px solid var(--ink-3);
  border-radius:var(--r);padding:11px 16px;font-size:14px;box-shadow:var(--shadow);animation:glisse var(--doux) cubic-bezier(.2,.7,.2,1) both}
.toast.ok{border-left-color:var(--good)} .toast.attention{border-left-color:var(--warn)} .toast.mauvais{border-left-color:var(--bad)}
.toast.sortie{opacity:0;transform:translateY(8px);transition:opacity var(--doux),transform var(--doux)}
body.figee{overflow:hidden}

/* ==================================================================
   [C] STYLES DES OUTILS
   ================================================================== */
/* --- outil : calculateur --- */
.obj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.obj{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit;transition:border-color var(--vite),background var(--vite)}
.obj:hover{border-color:var(--line-strong)}
.obj[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-soft)}
.obj[aria-pressed="true"] .val{color:var(--accent)}
.obj .lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-weight:600}
.obj .val{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;margin-top:4px}
.macro{display:flex;flex-direction:column;gap:6px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.macro .m-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.macro .m-name{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.macro .m-g{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.m-sub{font-size:12px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.flag{margin-top:14px;padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--sunken);font-size:13px;color:var(--ink-2);border-radius:0 var(--r-sm) var(--r-sm) 0;line-height:1.6}
.flag b{color:var(--ink)}
.flag.grave{border-left-color:var(--bad);background:var(--bad-soft)}
.flag.info{border-left-color:var(--accent)}
.flag.bon{border-left-color:var(--good)}
.flag.grave b{color:var(--ink)}
.flag.grave li{margin-bottom:5px;line-height:1.6}

/* --- outil : mensurations --- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:999px;padding:6px 13px;min-height:34px;font-size:13px;color:var(--ink-2);cursor:pointer;font-family:inherit;transition:border-color var(--vite),background var(--vite),color var(--vite)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent-line);color:var(--ink);background:var(--accent-soft)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.chartbox{position:relative;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
svg.chart{display:block;width:100%;height:260px;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:8px 10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.tip b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tip .row{display:flex;align-items:center;gap:7px;margin-top:3px}
.tip .sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* --- outil : entraînement --- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tab{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 15px;min-height:38px;
  font-family:"IBM Plex Sans",sans-serif;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:border-color var(--vite),background var(--vite),color var(--vite)}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:600}
.exo{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.exo-head{display:grid;grid-template-columns:1fr 152px 42px;gap:10px;align-items:end}
.exo-head select{font-size:14px;padding:9px 6px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
.set .s-lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.set .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.set input{padding:7px 8px;font-size:14px;text-align:center}
.set .cap{font-size:10px;color:var(--ink-3);text-align:center;margin-top:3px;font-family:"IBM Plex Mono",monospace;letter-spacing:.06em}
.exo-foot{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-size:16px}
.prev{font-size:12px;font-family:"IBM Plex Mono",monospace;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong)}
.up{color:var(--good);border-color:var(--good)} .down{color:var(--bad)} .same{color:var(--ink-3)}
.extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.link-a{color:var(--accent);font-size:12px;text-decoration:none}

@media (max-width:560px){
  .panel{padding:16px}
  .topbar .wrap{min-height:56px}
  main .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .t-val,.tuile .t-val{font-size:24px}
  .exo-head{grid-template-columns:1fr 42px;grid-template-areas:"nom del" "plage plage"}
  .exo-head > div:nth-child(1){grid-area:nom}
  .exo-head > div:nth-child(2){grid-area:plage}
  .exo-head > div:nth-child(3){grid-area:del}
}

/* --- Nutrition : cases a cocher, tuiles de bilan, cartes de repas --- */
.coches{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunken)}
.coche{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;margin:0;font-weight:500;text-transform:none;letter-spacing:normal;font-family:inherit}
.coche input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
/* .tuile : meme composant que .tile (voir [B]) */
.repas-c .repas-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.repas-c .repas-tete .actions-b{display:flex;gap:8px;flex-wrap:wrap}
.repas-c .repas-tete button{font:inherit;font-size:12px;padding:6px 11px;min-height:32px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:var(--r-sm);cursor:pointer}
.repas-c .repas-tete button:hover{border-color:var(--accent);color:var(--accent)}
.repas-macros{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.repas-macros b{color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace}
.repas-c h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
ul.ingr{list-style:none;margin:0;padding:0}
ul.ingr li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.ingr li b{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink)}
ol.etapes{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
ol.etapes li{margin-bottom:6px}
input.manque,select.manque,textarea.manque{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.video-boite{margin-top:14px}
.video-vignette{display:block;position:relative;width:100%;max-width:420px;padding:0;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;cursor:pointer;background:var(--sunken)}
.video-vignette img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:var(--sunken)}
.video-vignette .jouer{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;font-size:13px;font-weight:600;
  color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78));text-align:left}
.video-vignette:hover{border-color:var(--accent)}
.video-cadre{position:relative;width:100%;max-width:420px;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.video-cadre iframe{position:absolute;inset:0;width:100%;height:100%}
.brand{display:flex;flex-direction:row;align-items:center;gap:11px;margin-right:auto}
.brand .b-texte{display:flex;flex-direction:column;line-height:1.1}
@media(max-width:520px){.brand .b-name{font-size:16px}.b-logo{max-width:96px}}
.b-texte{display:flex;flex-direction:column}
.b-logo{display:block;width:auto;max-width:150px;object-fit:contain}
/* le logo est dessine en noir : sur fond sombre (le theme par defaut) on
   l'inverse pour qu'il reste lisible, plutot que de maintenir deux fichiers */
.b-logo,.logo-img{filter:invert(1)}
:root[data-theme="light"] .b-logo,
:root[data-theme="light"] .logo-img{filter:none}
.logo-img{display:block;max-width:170px;max-height:80px;margin:0 auto 14px;object-fit:contain}
.ex-fiche{margin-top:10px;font:inherit;font-size:12px;padding:5px 11px;min-height:30px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);border-radius:var(--r-sm);cursor:pointer}
.ex-fiche:hover{border-color:var(--accent);color:var(--accent)}
.fiche-ex{margin-top:12px;padding:14px 16px;border-left:3px solid var(--accent);background:var(--sunken);border-radius:0 var(--r-sm) var(--r-sm) 0}
.fiche-ex h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.fiche-ex h3:first-of-type{margin-top:0}
.fiche-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
ul.erreurs{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
ul.erreurs li{margin-bottom:5px}
.jours-onglets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px;padding-bottom:2px}
.jours-onglets::-webkit-scrollbar{display:none}
.j-onglet{display:flex;flex-direction:column;gap:2px;min-width:104px;padding:10px 14px;border:1px solid var(--line-strong);
  border-radius:var(--r);background:var(--surface);cursor:pointer;font:inherit;text-align:left;color:var(--ink);transition:border-color var(--vite),background var(--vite)}
.j-onglet:hover{border-color:var(--accent-line)}
.j-onglet.ici{border-color:var(--accent-line);background:var(--accent-soft)}
.j-onglet.ici .j-nom{color:var(--accent)}
.j-onglet .j-nom{font-size:13px;font-weight:600;color:var(--ink)}
.j-onglet .j-kcal{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",ui-monospace,monospace}
ul.courses-l li.pris{opacity:.5}
ul.courses-l li.pris .coche{text-decoration:line-through}
.bandeau-tete{display:flex;flex-direction:column;gap:2px}
.bandeau-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.b-act{display:inline-flex;align-items:center;text-decoration:none;font-size:13px;font-weight:500;min-height:34px;
  padding:6px 13px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface);transition:border-color var(--vite),color var(--vite),background var(--vite)}
.b-act:hover{border-color:var(--accent);color:var(--accent)}
.b-act.fort{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.b-act.ici{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.bandeau-actions .sortir{margin-left:auto}
@media(max-width:560px){.bandeau-actions .sortir{margin-left:0;width:100%}}
#tb-clients td{vertical-align:middle}
#tb-clients .voir{font:inherit;font-size:12px;padding:5px 11px;min-height:30px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
#tb-clients .voir:hover{border-color:var(--accent);color:var(--accent)}
.repas-c.mange{border-color:var(--good-soft);box-shadow:inset 3px 0 0 var(--good)}
.repas-c .repas-tete .respect{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;min-height:32px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;cursor:pointer;transition:background var(--vite),color var(--vite),border-color var(--vite)}
.repas-c .repas-tete .respect:hover{border-color:var(--good);color:var(--good)}
.repas-c .repas-tete .respect.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.repas-c details.prep{border:0;margin:0;padding:0}
.repas-c details.prep summary{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 8px}
.repas-c details.prep[open] summary{color:var(--ink-2)}
/* .jauge : meme barre que .bar (voir [B]) */
.g-edit{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px}
.g-edit input{width:78px;padding:5px 7px;text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace}
.g-edit .del{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
.g-edit .del:hover{color:var(--bad)}
ul.courses-l li{align-items:center}
ul.courses-l .coche{font-size:14px;color:var(--ink-2)}
.resultats{margin-top:14px}
.resultats h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.res-l{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;background:var(--surface)}
.res-l .nom{font-weight:500;flex:1;min-width:0}
.res-l .meta{font-size:12px;color:var(--ink-3);white-space:nowrap}
.res-l.exclu{border-color:var(--bad)}
.res-l.exclu .meta b{color:var(--bad)}
.res-l button{font:inherit;font-size:12px;padding:5px 11px;min-height:30px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:var(--r-sm);cursor:pointer}
.res-l button:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:560px){.res-l{flex-wrap:wrap}.res-l .meta{white-space:normal}}
#cat-journal{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunken)}
#cat-journal:empty{display:none}
.j-ligne{padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);font-family:"IBM Plex Mono",ui-monospace,monospace}
.j-ligne:last-child{border-bottom:0}
.j-ligne b{color:var(--ink)}
.j-ligne.attention{color:var(--warn)}
.j-ligne.erreur-l{color:var(--bad)}
.j-ligne.ok-l{color:var(--good);font-weight:600}

/* --- outil : formation --- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* .fo-jauge : meme barre que .bar (voir [B]) */
.fo-step{margin-bottom:20px}
.fo-step:last-child{margin-bottom:0}
.fo-step h3,.fo-corps h3{font-family:"IBM Plex Sans",sans-serif;text-transform:none;letter-spacing:-.01em;
  font-size:14px;font-weight:600;color:var(--ink);margin:18px 0 10px}
.fo-step h3{margin-top:0}
.fo-liste{list-style:none;margin:0;padding:0}
.fo-liste li{display:flex;align-items:flex-start;gap:8px;padding:5px 0}
label.fo-case{display:flex;align-items:flex-start;gap:10px;cursor:pointer;flex:1;font-size:14px;line-height:1.5;
  text-transform:none;letter-spacing:0;color:var(--ink);margin-bottom:0;font-weight:400}
.fo-case input{margin-top:3px;flex:0 0 auto;width:16px;height:16px;accent-color:var(--accent)}
.fo-case input:checked + span{color:var(--ink-3)}
.fo-barre-txt{text-decoration:line-through}
.fo-mod{padding:0;overflow:hidden}
.fo-tete{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;
  padding:18px 22px;cursor:pointer;text-align:left;color:var(--ink)}
.fo-tete:hover{background:var(--raised)}
.fo-ico{font-size:20px;line-height:1}
.fo-num{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--accent);width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.fo-mod.fini .fo-num{background:var(--good-soft);color:var(--good)}
.fo-corps-tete{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fo-obj-court{font-size:13px;color:var(--ink-3);line-height:1.4}
.fo-jauge.fo-jauge-mod{display:block;height:4px;margin-top:6px;max-width:220px}
.fo-jauge-mod .fo-jauge-in{display:block}
.fo-mod.ouvert{border-color:var(--accent-line)}
.fo-nom{flex:1;font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:16px;letter-spacing:-.01em}
.fo-fleche{color:var(--ink-3);font-size:13px}
.fo-corps{padding:0 22px 22px;border-top:1px solid var(--line)}
.fo-obj{margin:16px 0 10px;font-size:14px}
.fo-contenu{margin:0 0 14px;padding-left:20px;font-size:14px;color:var(--ink-2);line-height:1.65}
.fo-ress{list-style:none;margin:0;padding:0}
.fo-ress li{padding:4px 0}
.fo-lecon{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);overflow:hidden}
.fo-lecon-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:transparent;border:0;padding:13px 15px;cursor:pointer;text-align:left;color:var(--ink);font-size:14px}
.fo-lecon-tete:hover{color:var(--accent)}
.fo-lecon-corps{padding:4px 18px 20px;border-top:1px solid var(--line);font-size:14px;line-height:1.7}
.fo-lecon-corps h4{font-family:"IBM Plex Sans",sans-serif;letter-spacing:-.01em;
  font-size:16px;font-weight:600;margin:26px 0 10px;color:var(--ink)}
.fo-lecon-corps h5{font-size:14px;font-weight:600;margin:20px 0 8px;color:var(--ink)}
.fo-chapo{font-size:15px;color:var(--ink-2);margin:16px 0}
.fo-cle,.fo-alerte,.fo-def{border-left:3px solid var(--line-strong);padding:10px 14px;margin:14px 0;
  background:var(--surface);border-radius:0 var(--r-sm) var(--r-sm) 0}
.fo-cle{border-left-color:var(--accent)}
.fo-alerte{border-left-color:var(--warn)}
.fo-piliers,.fo-etapes{padding-left:22px;margin:12px 0}
.fo-piliers li,.fo-etapes li{margin-bottom:8px}
.fo-calc{padding-left:22px;margin:10px 0}
.fo-duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.fo-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}
.fo-plan{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.fo-duo > div,.fo-trio > div,.fo-plan > div{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;font-size:13.5px;line-height:1.6}
.fo-plan ul{margin:8px 0 0;padding-left:20px}
.fo-plan li{margin-bottom:5px}
@media(max-width:720px){.fo-duo,.fo-trio,.fo-plan{grid-template-columns:1fr}}
.fo-flux{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  text-align:center;font-size:14px;margin:14px 0}
.fo-tab{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
.fo-tab th,.fo-tab td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.fo-tab th{background:var(--sunken);font-family:"IBM Plex Mono",monospace;text-transform:uppercase;
  letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--ink-2)}
.fo-faq{border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:9px;background:var(--surface)}
.fo-faq summary{cursor:pointer;font-weight:600;font-size:14px}
.fo-faq p{margin:10px 0 0;color:var(--ink-2)}
.fo-legal{font-size:12px;color:var(--ink-3);margin-top:22px;line-height:1.6}
.fo-outil{margin-top:20px;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--sunken)}
.fo-outil h3{margin-top:0}
.fo-outil h4{font-size:13px;font-family:"IBM Plex Sans",sans-serif;letter-spacing:-.01em;
  font-weight:600;color:var(--ink);margin:16px 0 8px}
.fo-barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.fo-barre select{width:auto;min-width:150px}
.fo-scroll{overflow-x:auto}
.fo-diete{min-width:560px;margin:0}
.fo-diete input[type=number]{width:78px;padding:6px 7px;text-align:center;font-size:13px}
.fo-kcal,.fo-total td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.fo-total td{background:var(--surface)}
.fo-colonne{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fo-colonne h4{margin-top:0}
.fo-ajout{display:flex;gap:8px;margin-top:10px}
.fo-ajout input{flex:1}
.fo-ajout button{flex:0 0 auto;padding:9px 15px}
.fo-x{background:transparent;border:0;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.fo-x:hover{color:var(--bad)}
.fo-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.fo-note-tete{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fo-note-tete input{flex:1;font-weight:600}
.fo-obj-carte{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;margin-bottom:10px}
.fo-obj-carte.fo-fait{opacity:.65}
.fo-obj-champs{flex:1;display:flex;flex-direction:column;gap:8px}
.fo-obj-bas{display:grid;grid-template-columns:1fr 170px;gap:8px}
@media(max-width:560px){.fo-obj-bas{grid-template-columns:1fr}}
.fo-chal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px;overflow:hidden}
.fo-chal-on{border-color:var(--accent-line)}
.fo-chal-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:transparent;border:0;padding:13px 15px;cursor:pointer;text-align:left;color:var(--ink);
  font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:14px}
.fo-chal-on .fo-chal-tete .pastille{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.fo-chal-corps{padding:0 15px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.fo-chal-corps{grid-template-columns:1fr}}
.fo-axe{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;font-size:13.5px}
.fo-defis li{border-bottom:1px solid var(--line);padding:9px 0}
.fo-defis li:last-child{border-bottom:0}
.co-rester{display:flex;align-items:center;gap:9px;margin:0 0 16px;cursor:pointer;
  font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:400}
.co-rester input{width:16px;height:16px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.version{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
.carte-co .co-aide{font-size:12px;color:var(--ink-3);text-align:center;margin:12px 0 0;line-height:1.5}

/* --- selecteur d'exercice --- */
.ex-etat{font-size:12px;margin:6px 0 0;line-height:1.5}
.ex-etat.ok{color:var(--good)}
.ex-etat.absent{color:var(--warn)}
.ex-etat.vide{color:var(--ink-3)}
.lien-bouton{background:none;border:0;padding:0;font:inherit;color:var(--accent);
  text-decoration:underline;cursor:pointer}
.lien-bouton:hover{color:var(--ink)}

/* --- banniere « ajouter a l'ecran d'accueil » --- */
.installe{position:relative;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:16px 46px 16px 18px;margin-bottom:22px;
  box-shadow:var(--shadow)}
.installe h3{font-family:"IBM Plex Sans",sans-serif;text-transform:none;letter-spacing:-.01em;
  font-size:15px;font-weight:600;margin:0 0 8px;color:var(--ink)}
.installe p{margin:0 0 10px;font-size:14px;color:var(--ink-2);line-height:1.6}
.installe ol{margin:0 0 12px;padding-left:20px;font-size:14px;color:var(--ink-2);line-height:1.7}
.installe .fermer{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--ink-3);
  font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.installe .fermer:hover{color:var(--ink)}
.installe .actions{margin-top:0}

/* --- outil : complements --- */
.compl{list-style:none;margin:0;padding:0}
.compl-l{border-bottom:1px solid var(--line);padding:13px 0}
.compl-l:last-child{border-bottom:0}
.compl-l > div:first-child{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.compl-champs{display:grid;grid-template-columns:1fr 110px 90px 42px;gap:10px;align-items:end}
.compl-champs .plein{grid-column:1/-1}
@media(max-width:640px){.compl-champs{grid-template-columns:1fr 90px 70px 40px}}
.chip[disabled]{opacity:.6;cursor:default;border-color:var(--accent-line);color:var(--accent)}

.ech-ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ech-ligne select{flex:1;min-width:220px}
.ech-ligne button{flex:0 0 auto}

/* --- zone de suppression : on la distingue nettement du reste --- */
.zone-danger{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.zone-danger h3{font-family:"IBM Plex Sans",sans-serif;text-transform:none;letter-spacing:-.01em;
  font-size:14px;font-weight:600;color:var(--bad);margin:0 0 8px}
.zone-danger p{font-size:14px;color:var(--ink-2);line-height:1.6;margin:0}

.client-l .voir.suppr{color:var(--bad);border-color:var(--bad)}
.client-l .voir.suppr:hover{background:var(--bad);color:#fff}
</style>

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
/* Un nombre absent ou illisible s'affiche « — », jamais « NaN ». */
/* en anglais : 3,288 et 79.4 (format americain) au lieu de 3 288 et 79,4 */
const locale = () => (window.__langue === "en" ? "en-US" : "fr-FR");
const fmt = (n) => isFinite(Number(n)) ? Math.round(Number(n)).toLocaleString(locale()) : "—";
const n1  = (n) => isFinite(Number(n)) ? (Math.round(Number(n)*10)/10).toLocaleString(locale(),{minimumFractionDigits:1,maximumFractionDigits:1}) : "—";
/* La date du jour est celle de la montre de la personne, pas celle de
   Londres. Avant, toISOString() donnait la date UTC : a Bali, avant 8 h du
   matin, on etait encore « hier » — mesures mal datees et cases « mangé »
   remises a zero a 8 h au lieu de minuit. */
const aujourdhui = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
/* Un lien saisi a la main (video d'exercice, ressource) n'est accepte que
   s'il commence par http:// ou https://. Un lien « javascript:… » colle dans
   une fiche s'executerait chez celui qui clique — le coach, qui voit tout. */
const lienSur = (u) => {
  const s = String(u == null ? "" : u).trim();
  if (/^https?:\/\//i.test(s)) return s;
  if (/^www\./i.test(s)) return "https://" + s;
  return "";
};
/* Un ecran vide doit toujours proposer quoi faire. Sans bouton, le client
   se dit que l'app ne marche pas et ne revient plus. Rien en consultation
   coach : c'est le coach lui-meme qui regarde. */
function ctaVide(profil){
  if (typeof Store !== "undefined" && Store.idConsulte) return "";
  const ig = lienSur(CONFIG.marque.instagram);
  return `<div class="cta-vide">` +
    (profil ? `<a class="btn" href="#/profil">Compléter mon profil</a>` : "") +
    (ig ? `<a class="btn ghost" href="${esc(ig)}" target="_blank" rel="noopener">Écrire à mon coach</a>` : "") +
    `</div>`;
}

/* --- LANGUE (v27) ---------------------------------------------------------
   L'app reste ecrite en francais. En anglais, une couche traduit ce qui
   s'affiche, a partir du dictionnaire I18N.en (texte francais exact ->
   anglais) et de quelques motifs pour les phrases qui contiennent un nombre.
   Une entree absente = le texte reste en francais : rien ne peut casser.
   Les ecrans du coach ne sont pas traduits (ils ne servent qu'a l'equipe).
   Ce que saisit l'utilisateur n'est jamais touche : seuls les textes qui
   correspondent EXACTEMENT a une entree du dictionnaire sont remplaces. */
const I18N = {
  cle: "mhx_langue",
  langue: "fr",
  en: {},
  motifs: [],
  charger(){
    try { this.langue = localStorage.getItem(this.cle) === "en" ? "en" : "fr"; } catch(e){ this.langue = "fr"; }
    document.documentElement.lang = this.langue;
    window.__langue = this.langue;
    return this.langue;
  },
  /* renvoie true si le choix a bien ete range sur l'appareil */
  choisir(l){
    this.langue = (l === "en") ? "en" : "fr";
    document.documentElement.lang = this.langue;
    window.__langue = this.langue;
    try { localStorage.setItem(this.cle, this.langue); return localStorage.getItem(this.cle) === this.langue; } catch(e){ return false; }
  }
};
/* Pour les textes qui ne passent pas par l'ecran (confirm, alert, prompt).
   Nom long expres : une variable locale « t » existe deja a plusieurs endroits. */
function trad(fr, vars){
  let s = (I18N.langue === "en" && I18N.en[fr]) || fr;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
  return s;
}
const Traduction = {
  norm: (s) => String(s).replace(/\s+/g, " ").trim(),
  inlines: /^(B|STRONG|EM|I|BR|SMALL|CODE|SPAN|SUP|SUB|U)$/,
  blocs: "p,li,h1,h2,h3,h4,label,button,a,summary,th,td,option,legend,dt,dd,span,div,small,strong,b,em",
  exclu(el){ return !el || !!(el.closest && el.closest("[data-notr],textarea,script,style")); },
  /* un bloc « simple » ne contient que de la mise en forme : on peut le
     remplacer d'un coup sans detruire un champ ou un bouton branche */
  blocSimple(el){
    if (!el.children.length) return false;
    for (const d of el.querySelectorAll("*")){
      if (!this.inlines.test(d.tagName) || d.id) return false;
      for (const a of d.attributes) if (a.name.indexOf("data-") === 0 || a.name.indexOf("on") === 0) return false;
    }
    return true;
  },
  texte(s){
    const n = this.norm(s);
    if (!n || !/[a-zàâçéèêëîïôûùüœ]/i.test(n)) return null;
    if (Object.prototype.hasOwnProperty.call(I18N.en, n)) return I18N.en[n];
    for (const [re, r] of I18N.motifs) if (re.test(n)) return n.replace(re, r);
    return null;
  },
  tn(nd){
    const p = nd.parentElement;
    if (!p || this.exclu(p)) return;
    const v = nd.nodeValue, tr = this.texte(v);
    if (tr != null && tr !== this.norm(v)) nd.nodeValue = v.match(/^\s*/)[0] + tr + v.match(/\s*$/)[0];
  },
  attributs(el){
    for (const a of ["placeholder", "title", "aria-label"]){
      const v = el.getAttribute && el.getAttribute(a);
      if (v){ const tr = this.texte(v); if (tr != null && tr !== v) el.setAttribute(a, tr); }
    }
  },
  noeud(racine){
    if (I18N.langue !== "en" || !racine) return;
    if (racine.nodeType === 3){ this.tn(racine); return; }
    if (racine.nodeType !== 1 || this.exclu(racine)) return;
    const els = [racine].concat(Array.from(racine.querySelectorAll(this.blocs)));
    for (const el of els){
      if (!el.isConnected || this.exclu(el) || !this.blocSimple(el)) continue;
      const k = this.norm(el.innerHTML);
      if (Object.prototype.hasOwnProperty.call(I18N.en, k) && I18N.en[k] !== k) el.innerHTML = I18N.en[k];
    }
    this.attributs(racine);
    racine.querySelectorAll("[placeholder],[title],[aria-label]").forEach(el => { if (!this.exclu(el)) this.attributs(el); });
    const w = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT);
    const liste = []; let n; while ((n = w.nextNode())) liste.push(n);
    liste.forEach(x => this.tn(x));
    if (racine === document.body){ const tt = this.texte(document.title); if (tt) document.title = tt; }
  },
  demarrer(){
    if (this.obs) return;
    this.obs = new MutationObserver(ms => {
      if (I18N.langue !== "en") return;
      for (const m of ms){
        if (m.type === "characterData") this.tn(m.target);
        else if (m.type === "attributes") { if (!this.exclu(m.target)) this.attributs(m.target); }
        else m.addedNodes.forEach(nd => this.noeud(nd));
      }
    });
    this.obs.observe(document.body, { childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:["placeholder","title","aria-label"] });
    this.noeud(document.body);
  }
};

/* --- CONTENUS TRADUITS (v28) ------------------------------------------------
   Les exercices et les programmes types portent leur traduction dans la base
   (colonne traductions = {"en": {...meme forme que le francais...}}). En
   anglais, on les charge une fois et on ajoute chaque paire francais ->
   anglais au dictionnaire : la couche de traduction s'occupe du reste,
   partout ou ces textes s'affichent (programme du client, fiches exercices).
   Les notes ecrites a la main par le coach n'ont pas de traduction : elles
   restent telles quelles. */
const Contenus = {
  fait: false,
  ajouter(fr, en){
    if (typeof fr !== "string" || typeof en !== "string" || !fr.trim() || !en.trim()) return;
    const k = Traduction.norm(fr);
    if (k && k !== en && !Object.prototype.hasOwnProperty.call(I18N.en, k)) I18N.en[k] = en;
  },
  /* parcourt le francais et l'anglais cote a cote, cle par cle, case par case */
  zip(fr, en){
    if (Array.isArray(fr) && Array.isArray(en)) fr.forEach((x, i) => this.zip(x, en[i]));
    else if (fr && en && typeof fr === "object" && typeof en === "object") Object.keys(en).forEach(k => this.zip(fr[k], en[k]));
    else this.ajouter(fr, en);
  },
  async charger(){
    if (I18N.langue !== "en" || this.fait) return;
    this.fait = true;
    try {
      const [ex, pt] = await Promise.all([
        Auth.appel("/rest/v1/exercices?select=nom,execution,erreurs,respiration,traductions&traductions=not.is.null"),
        Auth.appel("/rest/v1/programmes_types?select=nom,note,seances,traductions&traductions=not.is.null")
      ]);
      [].concat(ex || [], pt || []).forEach(r => { if (r && r.traductions && r.traductions.en) this.zip(r, r.traductions.en); });
      Traduction.noeud(document.body);
    } catch(e){ this.fait = false; }
  }
};

/* Les dates sont stockees au format ISO (2026-08-29) parce que c'est le seul
   qui se trie correctement. On les affiche a la francaise. */
const dateFr = (iso) => {
  if (!iso) return "—";
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(String(iso));   // jamais une valeur brute dans du HTML
  return window.__langue === "en" ? m[2] + "/" + m[3] + "/" + m[1] : m[3] + "/" + m[2] + "/" + m[1];   // US : mois/jour/annee
};

function flash(id, texte){
  const e = $(id); if(!e) return;
  e.textContent = texte;
  setTimeout(() => { if (e.textContent === texte) e.textContent = ""; }, 3200);
}
