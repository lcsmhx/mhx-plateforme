        <div class="tuile"><span class="t-lbl">Aliments</span><span class="t-val readout" id="cat-n-aliments">…</span><span class="t-u">fiches</span></div>
        <div class="tuile"><span class="t-lbl">Recettes</span><span class="t-val readout" id="cat-n-recettes">…</span><span class="t-u">plats</span></div>
        <div class="tuile"><span class="t-lbl">Programmes</span><span class="t-val readout" id="cat-n-programmes">…</span><span class="t-u">prêts à l'emploi</span></div>
        <div class="tuile"><span class="t-lbl">Exercices</span><span class="t-val readout" id="cat-n-vegan">…</span><span class="t-u">fiches détaillées</span></div>
      </div>
      <div id="cat-couverture" style="margin-top:18px"></div>
    </section>

    <section class="panel">
      <h2>Recharger depuis le dépôt</h2>
      <p class="note" style="margin-top:0">Les données viennent de <span class="readout">${esc(CONFIG.nutrition.source_donnees)}</span>. À chaque import, les régimes et les allergènes sont <strong>recalculés</strong> à partir du nom et de la composition de chaque aliment : les étiquettes du fichier ne sont jamais reprises telles quelles, et les recettes héritent des étiquettes de leurs ingrédients.</p>
      <div class="actions">
        <button class="btn" id="cat-go">Importer le catalogue</button>
        <span class="msg" id="cat-msg"></span>
      </div>
      <div id="cat-journal" style="margin-top:16px"></div>
    </section>`;
  },

  async compteurs(){
    const [al, re, pr, ex] = await Promise.all([Catalogue.aliments(), Catalogue.recettes(), Catalogue.programmes(), Catalogue.exercices()]);
    $("cat-n-aliments").textContent   = fmt(al.length);
    $("cat-n-recettes").textContent   = fmt(re.length);
    $("cat-n-programmes").textContent = fmt(pr.length);
    $("cat-n-vegan").textContent      = fmt(ex.length);

    /* Couverture : un client d'un regime donne a-t-il de quoi manger a chaque repas ? */
    const cles = [["vegan","Végétalien"],["vegetarien","Végétarien"],["sans_gluten","Sans gluten"],
                  ["sans_lactose","Sans lactose"],["paleo","Paléo"],["pescetarien","Pescétarien"]];
    let h = `<h3 style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px">Couverture par régime et par repas</h3>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Régime</th>` +
      CONFIG.nutrition.repas.map(r => `<th>${esc(r.nom)}</th>`).join("") + `</tr></thead><tbody>`;
    let trous = 0;
    cles.forEach(([k, nom]) => {
      h += `<tr><td>${esc(nom)}</td>`;
      CONFIG.nutrition.repas.forEach(slot => {
        const n = re.filter(r => r.moment === slot.id && (r.regimes||[]).indexOf(k) > -1).length;
        if (n === 0) trous++;
        h += `<td${n === 0 ? ' style="color:var(--bad);font-weight:600"' : (n < 3 ? ' style="color:var(--warn)"' : "")}>${n}</td>`;
      });
      h += `</tr>`;
    });
    h += `</tbody></table></div>
      <p class="note" style="margin-top:10px">${trous ? `<strong>${trous} case${trous>1?"s":""} à zéro</strong> : pour ces combinaisons, le générateur n'a rien à proposer et répartira les calories sur les autres repas. C'est là qu'il faut ajouter des recettes.` : "Chaque régime a au moins une recette pour chaque repas de la journée."}</p>`;
    $("cat-couverture").innerHTML = h;
  },

  async init(){
    const self = this;
    Catalogue._c = {}; Catalogue._idx = null; Catalogue._idxEx = null;
    await this.compteurs();

    const journal = $("cat-journal");
    const dire = (txt, classe) => {
      const d = document.createElement("div");
      d.className = "j-ligne" + (classe ? " " + classe : "");
      d.innerHTML = txt; journal.appendChild(d); journal.scrollTop = journal.scrollHeight;
    };

    $("cat-go").addEventListener("click", async () => {
      const b = $("cat-go"); b.disabled = true; b.textContent = "Import en cours…";
      journal.innerHTML = "";
      try {
        /* --- 1. aliments --- */
        dire("Téléchargement des aliments…");
        const brutA = await Import.fichier("aliments.json");
        let corriges = 0, allergAjoutes = 0;
        const aliments = brutA.map(a => {
          const n = Normaliser.aliment(a);
          const avant = (a.regimes || []).slice().sort().join(","), apres = n.regimes.slice().sort().join(",");
          if (avant !== apres) corriges++;
          const plus = n.allergenes.filter(x => (a.allergenes || []).indexOf(x) === -1).length;
          allergAjoutes += plus;
          return n;
        });
        dire(`<b>${fmt(aliments.length)} aliments</b> lus. Régimes recalculés : <b>${fmt(corriges)}</b> fiches corrigées, <b>${fmt(allergAjoutes)}</b> allergènes ajoutés.`, corriges ? "attention" : "");
        await Import.envoyer("aliments", aliments, (t, i, n) => dire(`Aliments enregistrés : ${fmt(i)} / ${fmt(n)}`));

        /* --- 2. recettes : etiquettes deduites des ingredients --- */
        dire("Téléchargement des recettes…");
        const brutR = await Import.fichier("recettes.json");
        const idx = {}; aliments.forEach(a => { idx[a.id] = a; });
        const recettes = []; let orphelines = 0, ecarts = 0;
        brutR.forEach(r => {
          const res = Normaliser.recette(r, idx);
          if (res.manquants.length){ orphelines++; dire(`Recette écartée — ingrédient inconnu dans « ${esc(r.nom)} » : ${esc(res.manquants.join(", "))}`, "erreur-l"); return; }
          const avant = (r.regimes || []).slice().sort().join(","), apres = res.fiche.regimes.slice().sort().join(",");
          if (avant !== apres) ecarts++;
          recettes.push(res.fiche);
        });
        dire(`<b>${fmt(recettes.length)} recettes</b> retenues${orphelines ? `, ${fmt(orphelines)} écartée${orphelines>1?"s":""}` : ""}. Étiquettes déduites des ingrédients : <b>${fmt(ecarts)}</b> différaient du fichier.`, ecarts ? "attention" : "");
        await Import.envoyer("recettes", recettes, (t, i, n) => dire(`Recettes enregistrées : ${fmt(i)} / ${fmt(n)}`));

        /* --- 3. programmes --- */
        dire("Téléchargement des programmes…");
        const brutP = await Import.fichier("programmes.json");
        const programmes = brutP.filter(x => x && x.id && x.seances && x.seances.length).map(x => ({
          id: x.id, nom: x.nom, niveau: x.niveau || null, seances_semaine: x.seances_semaine || null,
          lieu: x.lieu || null, objectif: x.objectif || null, duree_semaines: x.duree_semaines || null,
          note: x.note || null,
          seances: x.seances.map(sc => ({
            nom: sc.nom || "Séance", note: sc.note || "",
            /* le tempo n'est pas repris : Lucas ne s'en sert pas et il
               encombrait la fiche d'exercice du client */
            exercices: (sc.exercices || []).map(e => ({
              nom: e.nom || "", series: String(e.series || ""), reps: String(e.reps || ""),
              repos: String(e.repos || ""), note: e.note || "", lien: e.lien || ""
            }))
          }))
        }));
        await Import.envoyer("programmes_types", programmes, null);
        dire(`<b>${fmt(programmes.length)} programmes</b> enregistrés.`);

        /* --- 4. fiches d'exercices --- */
        dire("Téléchargement des fiches d'exercices…");
        let exercices = [];
        try { exercices = await Import.fichier("exercices.json"); }
        catch(e){ dire("Pas de fichier d'exercices dans le dépôt — on continue sans.", "attention"); }
        if (exercices.length){
          const fiches = exercices.filter(x => x && x.id && x.nom).map(x => ({
            id: x.id, nom: x.nom, groupe: x.groupe || null,
            muscles: x.muscles || [], materiel: x.materiel || null, niveau: x.niveau || null,
            type: x.type || null, execution: x.execution || [], erreurs: x.erreurs || [],
            respiration: x.respiration || null, alternatives: x.alternatives || [],
            lien: x.lien || "", video_id: x.video_id || ""
          }));
          /* Les vidéos vivent dans un fichier à part : les fiches viennent de
             Grok Bot, les liens de Lucas. On les recolle ici, sur l'identifiant. */
          /* le fichier peut s'appeler avec ou sans tiret : GitHub et macOS
             renomment volontiers, on essaie les deux plutot que d'echouer */
          let liens = {};
          for (const nom of ["liens-exercices.json", "liensexercices.json"]){
            try { liens = await Import.fichier(nom); if (Object.keys(liens).length) break; } catch(e){}
          }
          /* on retrouve l'identifiant de la video dans n'importe quelle
             adresse YouTube : ainsi les liens ecrits directement dans les
             fiches donnent aussi un lecteur, pas seulement un lien sortant */
          const idYoutube = (url) => {
            const m = String(url || "").match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
            return m ? m[1] : "";
          };
          let avecVideo = 0;
          fiches.forEach(f => {
            const l = liens[f.id];
            if (l && l.lien){ f.lien = l.lien; f.video_id = l.yt || idYoutube(l.lien); }
            else if (f.lien) f.video_id = idYoutube(f.lien);
            if (f.video_id) avecVideo++;
          });
          await Import.envoyer("exercices", fiches, null);
          if (Object.keys(liens).length) dire(`<b>${fmt(avecVideo)} exercices</b> ont leur vidéo de démonstration.`);
          /* on verifie tout de suite ce qui compte : un exercice de programme
             sans fiche, c'est un client qui ne sait pas quoi faire */
          const idx = {}; fiches.forEach(f => { idx[Normaliser.aplatir(f.nom)] = true; });
          const noms = {};
          programmes.forEach(pr => (pr.seances||[]).forEach(sc => (sc.exercices||[]).forEach(e => {
            if (e.nom) noms[Normaliser.aplatir(e.nom)] = e.nom; })));
          const sans = Object.keys(noms).filter(k => !idx[k]);
          dire(`<b>${fmt(fiches.length)} fiches d'exercices</b> enregistrées. ${sans.length ? `<b>${sans.length}</b> exercice(s) des programmes n'ont pas de fiche : ${esc(sans.slice(0,5).map(k => noms[k]).join(", "))}${sans.length > 5 ? "…" : ""}` : "Tous les exercices des programmes ont leur fiche."}`, sans.length ? "attention" : "");
        }

        Catalogue._c = {}; Catalogue._idx = null; Catalogue._idxEx = null;
        await self.compteurs();
        dire("Import terminé.", "ok-l");
        flash("cat-msg", "Catalogue à jour.");
      } catch(e){
        dire("Import interrompu : " + esc(e.message || String(e)), "erreur-l");
        flash("cat-msg", "L'import n'a pas abouti — rien n'a été perdu, tu peux réessayer.");
      }
      b.disabled = false; b.textContent = "Importer le catalogue";
    });
  }
};

/* ------------------------------------------------------------------
   OUTIL COACH — Mes clients (invisible pour les clients)
   ------------------------------------------------------------------ */
const outilClients = {
  id: "clients",
  cle: null,
  nom: "Mes clients",
  icone: "👥",
  role: "coach",          // n'apparait que pour le coach
  titre: "Mes clients",
  accroche: "Tous tes clients et leurs données, en direct. Le tableau te dit d'un coup d'œil qui avance, qui décroche, et à qui il manque quelque chose.",

  jours(iso){
    if (!iso) return null;
    return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  },

  /* Evolution du poids d'un client a partir de ses mensurations */
  evolution(mens){
    if (!mens || !mens.mesures || !mens.mesures.length) return null;
    const m = mens.mesures.filter(x => x.poids).slice().sort((a,b) => (a.date||"") < (b.date||"") ? -1 : 1);
    if (!m.length) return null;
    const dernier = m[m.length - 1];
    const depart = mens.pstart || m[0].poids;
    /* on cherche la mesure la plus proche de 28 jours avant la derniere */
    const cible = new Date(dernier.date || aujourdhui()).getTime() - 28 * 86400000;
    let ref = m[0], ecartMin = Infinity;
    m.forEach(x => {
      const e = Math.abs(new Date(x.date || aujourdhui()).getTime() - cible);
      if (e < ecartMin){ ecartMin = e; ref = x; }
    });
    /* On ne parle de "quatre semaines" que si la mesure de reference tombe
       vraiment dans cette fenetre : sinon on affiche rien plutot qu'un
       chiffre calcule sur une periode differente de celle annoncee. */
    const ecartJours = Math.round(Math.abs(new Date(dernier.date || aujourdhui()).getTime() - new Date(ref.date || aujourdhui()).getTime()) / 86400000);
    const fenetreValide = ref !== dernier && ecartJours >= 14 && ecartJours <= 45;
    return {
      depart: depart, actuel: dernier.poids, date: dernier.date,
      total: dernier.poids - depart,
      mois: fenetreValide ? dernier.poids - ref.poids : null,
      jours_fenetre: fenetreValide ? ecartJours : null,
      n: m.length
    };
  },

  /* Le calculateur et le questionnaire peuvent diverger : le client remplit
     son formulaire, le coach ouvre le calculateur, et personne ne remarque
     que les deux ne parlent pas de la meme personne. Un cas reel : 80 kg /
     178 cm / 25 ans dans le calculateur contre 62 / 158 / 37 dans le
     questionnaire — environ 950 kcal d'ecart par jour, invisible a l'ecran. */
  SEUILS: { poids: 2, taille: 2, age: 2 },

  ecarts(intake, calc){
    if (!intake || !calc) return [];
    const out = [];
    [["poids","kg"],["taille","cm"],["age","ans"]].forEach(([cle, unite]) => {
      const a = parseFloat(intake[cle]), b = parseFloat(calc[cle]);
      if (!isFinite(a) || !isFinite(b)) return;
      if (Math.abs(a - b) >= this.SEUILS[cle]) out.push({ cle, unite, forms: a, calc: b });
    });
    /* le sexe n'a pas de seuil : c'est juste ou c'est faux */
    const sf = intake.sexe === "Homme" ? "H" : intake.sexe === "Femme" ? "F" : null;
    if (sf && calc.sexe && sf !== calc.sexe)
      out.push({ cle:"sexe", unite:"", forms: intake.sexe, calc: calc.sexe === "H" ? "Homme" : "Femme" });
    return out;
  },

  /* Combien de calories par jour separent les deux versions. C'est le chiffre
     qui dit si l'ecart est un detail ou une erreur de plan alimentaire. */
  ecartKcal(intake, calc){
    try {
      const depuisForm = Object.assign({}, calc, {
        poids:  parseFloat(intake.poids)  || calc.poids,
        taille: parseFloat(intake.taille) || calc.taille,
        age:    parseFloat(intake.age)    || calc.age,
        sexe:   intake.sexe === "Homme" ? "H" : intake.sexe === "Femme" ? "F" : calc.sexe
      });
      const t = d => outilCalculateur.metabolismeDeBase(d) * outilCalculateur.facteurActivite(d).total;
      return Math.round(t(calc) - t(depuisForm));
    } catch(e){ return null; }
  },

  tableau(profils, parClient, contenus){
    const tb = $("tb-clients"), zoneA = $("alertes-clients");
    if (!tb) return;
    const clients = (profils || []).filter(p => p.role !== "coach");
    if (!clients.length){
      tb.innerHTML = '<tr><td colspan="9">Aucun client pour le moment.</td></tr>';
      if (zoneA) zoneA.innerHTML = "";
      return;
    }

    const lignes = clients.map(p => {
      const c = contenus[p.id] || {};
      const ev = this.evolution(c.mens);
      const j = this.jours(parClient[p.id]);
      const objectif = (c.intake && c.intake.objectif) || "";
      /* Le sens du progres depend de l'objectif : perdre, c'est descendre. */
      const sens = /perte|s[èe]che/i.test(objectif) ? -1 : /prise|masse/i.test(objectif) ? 1 : 0;
      const ec = this.ecarts(c.intake, c.calc);
      return {
        p: p, ev: ev, jours: j,
        ecarts: ec,
        ecartKcal: ec.length ? this.ecartKcal(c.intake, c.calc) : null,
        nom: ((p.prenom||"") + " " + (p.nom||"")).trim() || (p.id.slice(0,8)),
        intake: !!(c.intake && c.intake.complet),
        programme: !!(c.programme && (c.programme.seances||[]).length),
        diete: !!(c.repas && ((c.repas.jours || []).some(j => (j.repas || []).length) || (c.repas.repas || []).length)),
        sens: sens
      };
    });

    /* Ceux qui demandent une action passent devant. */
    const urgence = (l) => (l.ecarts.length ? 200 : 0) +
                           (l.jours === null ? 100 : l.jours >= 10 ? 90 : 0) +
                           (!l.intake ? 50 : 0) + (!l.programme ? 20 : 0) + (!l.diete ? 10 : 0);
    lignes.sort((a,b) => urgence(b) - urgence(a) || (b.jours||0) - (a.jours||0));

    const pastille = (ok, txtOk, txtNon) =>
      `<span class="pastille${ok ? "" : " manque"}">${ok ? txtOk : txtNon}</span>`;
    const variation = (v, sens) => {
      if (v === null || v === undefined) return '<span class="meta">—</span>';
      const t = (v > 0 ? "+" : "") + n1(v) + " kg";
      const bon = sens === 0 ? null : (sens < 0 ? v < -0.2 : v > 0.2);
      return `<b style="color:${bon === null ? "var(--ink)" : bon ? "var(--good)" : (Math.abs(v) < 0.3 ? "var(--ink-3)" : "var(--warn)")}">${t}</b>`;
    };

    tb.innerHTML = lignes.map(l => `<tr>
      <td><b>${esc(l.nom)}</b>${l.ecarts.length ? ` <span class="pastille manque" title="Le calculateur ne correspond pas au questionnaire">chiffres à vérifier</span>` : ""}</td>
      <td>${l.jours === null ? '<span class="pastille manque">jamais</span>'
            : l.jours >= 10 ? `<span class="pastille manque">${l.jours} j</span>`
            : `<span class="meta">${l.jours === 0 ? "aujourd'hui" : "il y a " + l.jours + " j"}</span>`}</td>
      <td>${l.ev ? `${n1(l.ev.actuel)} kg <span class="meta">(départ ${n1(l.ev.depart)})</span>` : '<span class="meta">aucune mesure</span>'}</td>
      <td>${l.ev ? variation(l.ev.total, l.sens) : '<span class="meta">—</span>'}</td>
      <td>${l.ev && l.ev.mois !== null ? variation(l.ev.mois, l.sens) + (l.ev.jours_fenetre !== 28 ? ` <span class="meta">sur ${l.ev.jours_fenetre} j</span>` : "") : '<span class="meta">pas assez de recul</span>'}</td>
      <td>${pastille(l.intake, "rempli", "à remplir")}</td>
      <td>${pastille(l.programme, "envoyé", "à faire")}</td>
      <td>${pastille(l.diete, "envoyée", "à faire")}</td>
      <td><button class="voir" type="button" data-ouvrir="${esc(l.p.id)}" data-nom="${esc(l.nom)}">Ouvrir</button></td>
    </tr>`).join("");

    $$("[data-ouvrir]", tb).forEach(b => b.addEventListener("click", () => {
      Store.oublier(Store.idConsulte);
      Store.idConsulte = b.dataset.ouvrir;
      Store.nomConsulte = b.dataset.nom;
      location.hash = "#/profil";
    }));

    if (zoneA){
      const muets = lignes.filter(l => l.jours === null || l.jours >= 10);
      const aFaire = lignes.filter(l => !l.programme || !l.diete || !l.intake);
      const incoherents = lignes.filter(l => l.ecarts.length);
      let h = "";
      if (incoherents.length){
        h += `<div class="flag grave"><b>Le calculateur ne correspond pas au questionnaire :</b><ul style="margin:8px 0 0;padding-left:20px">` +
          incoherents.map(l => `<li><b>${esc(l.nom)}</b> — ` +
            l.ecarts.map(e => `${e.cle} : ${esc(String(e.forms))}${e.unite ? " " + e.unite : ""} au questionnaire, ` +
                              `${esc(String(e.calc))}${e.unite ? " " + e.unite : ""} au calculateur`).join(" · ") +
            (l.ecartKcal ? ` <b>(${l.ecartKcal > 0 ? "+" : ""}${fmt(l.ecartKcal)} kcal/jour)</b>` : "") +
            `</li>`).join("") +
          `</ul><p class="note" style="margin:10px 0 0">Sa diète est calculée sur les chiffres du calculateur. Ouvre sa fiche et corrige avant d'envoyer un plan.</p></div>`;
      }
      if (muets.length) h += `<div class="flag"><b>Sans nouvelles depuis 10 jours ou plus :</b> ${muets.map(l => esc(l.nom)).join(", ")}. C'est le moment de reprendre contact.</div>`;
      if (aFaire.length) h += `<div class="flag" style="margin-top:8px"><b>Il manque quelque chose pour :</b> ${aFaire.map(l => esc(l.nom) + " (" + [!l.intake ? "questionnaire" : null, !l.programme ? "programme" : null, !l.diete ? "diète" : null].filter(Boolean).join(", ") + ")").join(" · ")}.</div>`;
      if (!h) h = `<p class="note" style="margin:0">Tous tes clients ont leur questionnaire, leur programme et leur diète, et se sont manifestés dans les dix derniers jours.</p>`;
      zoneA.innerHTML = h;
    }
  },

  html(){
    return `
    <section class="panel">
      <h2>Suivi de mes clients</h2>
      <div id="alertes-clients"></div>
      <div class="scroll" style="margin-top:14px"><table><thead><tr>
        <th>Client</th><th>Activité</th><th>Poids</th><th>Depuis le début</th><th>4 dernières sem.</th>
        <th>Questionnaire</th><th>Programme</th><th>Diète</th><th></th>
      </tr></thead><tbody id="tb-clients"><tr><td colspan="9">Chargement…</td></tr></tbody></table></div>
      <p class="note" style="margin-top:12px">« Activité » compte les jours depuis la dernière saisie du client, quelle qu'elle soit. Une variation de poids se lit sur quatre semaines : en dessous, c'est du bruit.</p>
    </section>

    <section class="panel">
      <h2>Comptes</h2>
      <p class="note" style="margin:0 0 16px">« Accès complet » donne à une personne de ton équipe exactement ta vue : toutes les fiches, tous les questionnaires de santé, tous les programmes. Donne-le à un compte créé pour elle, jamais en partageant ton mot de passe — sinon tu ne sauras plus qui a modifié quoi, et tu ne pourras pas le lui retirer.</p>
      <div id="liste-clients"><div class="empty">Chargement…</div></div>
    </section>

    <section class="panel">
      <h2>Créer un accès client</h2>
      <p class="note" style="margin-bottom:16px">Le client recevra ces identifiants. Il pourra changer son mot de passe lui-même depuis l'écran de connexion.</p>
      <div class="grid g2">
        <div><label for="n-prenom">Prénom</label><input id="n-prenom" type="text"></div>
        <div><label for="n-nom">Nom</label><input id="n-nom" type="text"></div>
        <div><label for="n-email">Email</label><input id="n-email" type="email"></div>
        <div><label for="n-mdp">Mot de passe provisoire</label><input id="n-mdp" type="text"></div>
      </div>
      <div class="actions">
        <button class="btn" id="n-creer">Créer le compte</button>
        <button class="btn ghost" id="n-gen">Générer un mot de passe</button>
        <span class="msg" id="n-msg"></span>
      </div>
    </section>`;
  },

  async init(){
    const self = this;

    const charger = async () => {
      const box = $("liste-clients");
      try {
        const profils = await Auth.appel("/rest/v1/profils?select=*&order=cree_le.desc");
        const donnees = await Auth.appel("/rest/v1/donnees?select=user_id,outil,contenu,maj_le");
        const parClient = {}, contenus = {};
        (donnees || []).forEach(d => {
          if (!parClient[d.user_id] || d.maj_le > parClient[d.user_id]) parClient[d.user_id] = d.maj_le;
          (contenus[d.user_id] = contenus[d.user_id] || {})[d.outil] = d.contenu;
        });
        self.tableau(profils, parClient, contenus);
        /* Tous les comptes, coachs compris : c'est ici qu'on donne l'acces
           complet a quelqu'un de l'equipe, et qu'on le retire. */
        const moi = Auth.utilisateur() && Auth.utilisateur().id;
        const comptes = (profils || []);
        if (!comptes.length){ box.innerHTML = '<div class="empty">Aucun compte pour le moment. Crée le premier accès ci-dessous.</div>'; return; }
        box.innerHTML = "";
        comptes.forEach(p => {
          const d = parClient[p.id];
          const quand = d ? new Date(d).toLocaleDateString("fr-FR") : "jamais";
          const estCoach = p.role === "coach", cestMoi = p.id === moi;
          const el = document.createElement("div");
          el.className = "client-l";
          el.innerHTML = `<span class="nom">${esc(((p.prenom||"") + " " + (p.nom||"")).trim() || "Sans nom")}</span>
                          ${estCoach ? `<span class="pastille role-coach">accès complet</span>` : `<span class="pastille">${d ? "actif" : "pas encore utilisé"}</span>`}
                          <span class="meta">${estCoach ? (cestMoi ? "c'est toi" : "voit tout, comme toi") : "dernière saisie : " + quand}</span>
                          ${estCoach ? "" : `<button class="voir" type="button">Ouvrir sa fiche</button>`}
                          ${cestMoi ? "" : `<button class="voir role" type="button" data-role="${estCoach ? "client" : "coach"}">${estCoach ? "Retirer l'accès complet" : "Donner l'accès complet"}</button>`}`;
          const bv = el.querySelector(".voir:not(.role)");
          if (bv) bv.addEventListener("click", () => {
            Store.oublier(Store.idConsulte);
            Store.idConsulte = p.id;
            Store.nomConsulte = ((p.prenom||"") + " " + (p.nom||"")).trim() || "ce client";
            location.hash = "#/profil";
          });
          const br = el.querySelector(".role");
          if (br) br.addEventListener("click", async () => {
            const vers = br.dataset.role;
            const nom = ((p.prenom||"") + " " + (p.nom||"")).trim() || "ce compte";
            const message = vers === "coach"
              ? "Donner l'accès complet à " + nom + " ?\n\nCette personne verra exactement ce que tu vois : les fiches de tous tes clients, leur questionnaire de santé, leurs programmes et leur diète. Elle pourra aussi les modifier."
              : "Retirer l'accès complet à " + nom + " ?\n\nElle redeviendra un client ordinaire et ne verra plus que ses propres données.";
            if (!confirm(message)) return;
            br.disabled = true; br.textContent = "…";
            try {
              await Auth.appel("/rest/v1/profils?id=eq." + p.id, {
                method: "PATCH", headers: { "Prefer": "return=minimal" }, body: { role: vers }
              });
              await charger();
            } catch(e){
              br.disabled = false;
              alert("Changement impossible : " + (e.message || "erreur inconnue"));
            }
          });
          box.appendChild(el);
        });
      } catch(e){
        box.innerHTML = '<div class="empty">Impossible de charger la liste.</div>';
        const tb = $("tb-clients"); if (tb) tb.innerHTML = '<tr><td colspan="9">Impossible de charger le suivi.</td></tr>';
      }
    };

    $("n-gen").addEventListener("click", () => {
      const a = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let m = ""; for (let i=0;i<10;i++) m += a[Math.floor(Math.random()*a.length)];
      $("n-mdp").value = m;
    });

    $("n-creer").addEventListener("click", async () => {
      const prenom = $("n-prenom").value.trim(), nom = $("n-nom").value.trim();
      const email = $("n-email").value.trim(), mdp = $("n-mdp").value;
      if (!email || !mdp){ flash("n-msg","Il faut au moins un email et un mot de passe."); return; }
      if (mdp.length < 6){ flash("n-msg","Le mot de passe doit faire au moins 6 caractères."); return; }
      const sessionCoach = Auth.session;          // on met la session du coach de côté
      try {
        await Auth.inscrire(email, mdp, prenom, nom);
        Auth.session = sessionCoach;              // on la restaure : on reste connecté en coach
        try { Auth.magasin().setItem(Auth.cleSession, JSON.stringify(sessionCoach)); } catch(e){}
        $("n-prenom").value = $("n-nom").value = $("n-email").value = $("n-mdp").value = "";
        flash("n-msg", "Compte créé. Transmets-lui ses identifiants.");
        charger();
      } catch(e){
        Auth.session = sessionCoach;
        flash("n-msg", e.message || "Création impossible.");
      }
    });

    charger();
  }
};

      <h4>Chapitre 1 — Les bases</h4>
      <p>Les macronutriments sont les nutriments qui nous donnent des calories et de l'énergie. Ils nous sont vitaux pour vivre, grandir et faire fonctionner notre métabolisme. Ils se rangent en 3 grandes catégories : les glucides, les protéines et les lipides.</p>
      <p>Sans ces 3 macronutriments, le corps peut souffrir de carences et de fatigue, et il commence lentement à s'éteindre — comme ta voiture quand elle n'a plus d'essence. C'est pourquoi il est impératif d'en consommer tous les jours. Toutes les catégories apportent des calories, mais pas dans les mêmes proportions :</p>

        <li><b>Stockage d'énergie.</b> Les lipides peuvent être mis en réserve. Si tu n'as pas mangé depuis un moment, ton corps y puise pour continuer à fonctionner.</li>
        <li><b>Protection et isolation.</b> Ils protègent tes organes et gardent ton corps au chaud. Cela prévient les blessures et maintient une température stable.</li>
        <li><b>Constitution des cellules.</b> Ils forment les membranes de toutes tes cellules — les murs protecteurs qui leur permettent de fonctionner.</li>

      <p class="fo-cle"><b>En résumé :</b> les lipides sont le carburant et les pièces de ta voiture. Ils te donnent de l'énergie, te protègent, construisent tes cellules et transportent des nutriments importants.</p>

        <li><b>Système immunitaire.</b> Les anticorps sont des protéines : ils combattent les infections, comme des soldats qui protègent un château.</li>
      </ol>
      <p class="fo-cle"><b>En résumé :</b> les protéines construisent et réparent ton corps, facilitent les réactions chimiques, envoient des messages, transportent des substances, soutiennent la structure et te protègent des maladies.</p>

      <h4>Chapitre 4 — Les glucides</h4>
      <p>Les glucides sont le carburant principal.</p>
      <ol class="fo-etapes">
        <li><b>Source d'énergie rapide.</b> Pâtes, pain, fruits, légumes : ton corps les transforme en glucose, l'essence de ta voiture.</li>
        <li><b>Stockage d'énergie.</b> L'excès est stocké sous forme de glycogène dans les muscles et le foie, un réservoir supplémentaire pour les efforts intenses ou entre les repas.</li>
        <li><b>Fonctionnement du cerveau.</b> Ton cerveau consomme beaucoup de glucose : il t'aide à penser clairement, à apprendre et à mémoriser.</li>
        <li><b>Fonctionnement des muscles.</b> Sans assez de glucides, tes muscles fatiguent plus vite et tu te sens faible.</li>
        <li><b>Stabilité de la glycémie.</b> Les glucides à libération lente — grains entiers, légumes, fruits — évitent les pics et les chutes de sucre dans le sang.</li>
        <li><b>Préservation des protéines.</b> Avec assez de glucides, ton corps n'a pas besoin de décomposer les protéines de tes muscles pour trouver de l'énergie.</li>
      </ol>
      <p class="fo-cle"><b>En résumé :</b> les glucides te donnent de l'énergie rapide, alimentent ton cerveau et tes muscles, stabilisent ta glycémie et préservent tes muscles.</p>

      <h4>Le calcul, en pratique</h4>
      <p>Si tu consommes 50 g de glucides, 30 g de protéines et 20 g de lipides :</p>
      <ul class="fo-calc">
        <li>Glucides : 50 × 4 = <b>200 calories</b></li>
        <li>Protéines : 30 × 4 = <b>120 calories</b></li>
        <li>Lipides : 20 × 9 = <b>180 calories</b></li>
      </ul>
      <p class="fo-cle">Total = 200 + 120 + 180 = <b>500 calories</b></p>
    `
  }
};

/* ------------------------------------------------------------------
   OUTIL — Formation
   La formation SpeedFormation 1.0, rapatriee dans l'application :
   les videos, les lecons, les cases a cocher et les outils de suivi.
   Tout ce que le client coche est enregistre sur son compte.
   ------------------------------------------------------------------ */
const JOURS_SEM = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const REPAS_SEM = ["Petit-déjeuner","Collation matin","Déjeuner","Collation après-midi","Dîner","Collation soir"];

const outilFormation = {
  id: "formation",
  cle: "formation",
  nom: "Ma formation",
  icone: "🎓",
  titre: FORMATION.titre,
  accroche: "Ta formation complète : les vidéos, les guides et tes outils de suivi. Ce que tu coches ici reste enregistré.",

  vide(){
    return { coches:{}, ouvert:"", lecon:"", challenge:"", defis:{},
             diete:{}, semaine:1, jour:0,
             priorites:{ semaine:[], demain:[] }, notes:[], objectifs:[] };
  },

  migrer(D){
    const v = this.vide();
    if (!D || typeof D !== "object") return v;
    Object.keys(v).forEach(k => { if (D[k] == null) D[k] = v[k]; });
    if (!D.priorites.semaine) D.priorites.semaine = [];
    if (!D.priorites.demain)  D.priorites.demain  = [];
    return D;
  },

  /* ---------- petites briques d'affichage ---------- */
  video(id, legende){
    if (!id) return "";
    return `<div class="video-boite">
      <button type="button" class="video-vignette" data-yt="${esc(id)}" aria-label="Lire la vidéo">
        <img src="https://img.youtube.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy">
        <span class="jouer">▶ ${esc(legende || "Regarder la vidéo")}</span>
      </button>
    </div>`;
  },

  caseHTML(id, texte, coche){
    return `<li><label class="fo-case"><input type="checkbox" data-coche="${esc(id)}"${coche ? " checked" : ""}><span>${esc(texte)}</span></label></li>`;
  },

  /* combien de cases cochees sur combien, tous modules confondus */
  compte(D){
    let tot = 0, faits = 0;
    FORMATION.processus.forEach(s => s.taches.forEach(t => { tot++; if (D.coches[t[0]]) faits++; }));
    FORMATION.modules.forEach(m => (m.taches || []).forEach(t => { tot++; if (D.coches[t[0]]) faits++; }));
    return { tot, faits, pct: tot ? Math.round(faits * 100 / tot) : 0 };
  },

  compteModule(D, m){
    const t = (m.taches || []);
    return { tot: t.length, faits: t.filter(x => D.coches[x[0]]).length };
  },

  /* ---------- la page ---------- */
  vue(D, visibles){
    const c = this.compte(D);
    let h = "";

    /* en-tete : progression + video de presentation */
    h += `<section class="panel">
      <h2>Ton parcours</h2>
      <p style="margin:0 0 14px">${esc(FORMATION.intro)}</p>
      <div class="fo-jauge"><div class="fo-jauge-in" style="width:${c.pct}%"></div></div>
      <p class="note" style="margin:8px 0 16px">${c.faits} étape${c.faits > 1 ? "s" : ""} validée${c.faits > 1 ? "s" : ""} sur ${c.tot} — ${c.pct} %</p>
      ${this.video(FORMATION.video, "Voir la présentation de la formation")}
    </section>`;

    /* le processus */
    h += `<section class="panel"><h2>Le processus, étape par étape</h2>`;
    FORMATION.processus.forEach(s => {
      h += `<div class="fo-step"><h3>${esc(s.titre)}</h3><ul class="fo-liste">
        ${s.taches.map(t => this.caseHTML(t[0], t[1], D.coches[t[0]])).join("")}
      </ul></div>`;
    });
    h += `</section>`;

    /* les modules */
    FORMATION.modules.forEach(m => {
      const cm = this.compteModule(D, m);
      const ouvert = D.ouvert === m.id;
      h += `<section class="panel fo-mod">
        <button type="button" class="fo-tete" data-mod="${esc(m.id)}" aria-expanded="${ouvert}">
          <span class="fo-ico" aria-hidden="true">${m.icone}</span>
          <span class="fo-nom">${esc(m.titre)}</span>
          ${cm.tot ? `<span class="pastille${cm.faits === cm.tot ? " fo-ok" : ""}">${cm.faits}/${cm.tot}</span>` : ""}
          <span class="fo-fleche">${ouvert ? "▾" : "▸"}</span>
        </button>`;
      if (ouvert){
        h += `<div class="fo-corps">
          <p class="fo-obj"><b>Objectif :</b> ${esc(m.objectif)}</p>
          ${(m.contenu || []).length ? `<ul class="fo-contenu">${m.contenu.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${this.video(m.video)}
          ${(m.taches || []).length ? `<h3>Ta to-do list</h3><ul class="fo-liste">${m.taches.map(t => this.caseHTML(t[0], t[1], D.coches[t[0]])).join("")}</ul>` : ""}`;

        /* lecons rapatriees */
        (m.lecons || []).forEach(cle => {
          const L = LECONS[cle]; if (!L) return;
          const on = D.lecon === cle;
          h += `<div class="fo-lecon">
            <button type="button" class="fo-lecon-tete" data-lecon="${esc(cle)}" aria-expanded="${on}">
              <span>📄 ${esc(L.titre)}</span><span class="meta">${esc(L.duree || "")}</span>
            </button>
            ${on ? `<div class="fo-lecon-corps">${L.html}</div>` : ""}
          </div>`;
        });

        /* outils interactifs */
        (m.widgets || []).forEach(w => { h += this.widget(w, D); });

        /* liens internes */
        const internes = (m.interne || []).filter(x => visibles.indexOf(x.id) >= 0);
        if (internes.length){
          h += `<h3>Dans ton espace</h3><ul class="fo-ress">${internes.map(x =>
            `<li><a class="link-a" href="#/${esc(x.id)}">${esc(x.t)} →</a></li>`).join("")}</ul>`;
        }
        if ((m.ressources || []).length){
          h += `<h3>Tes ressources à télécharger</h3><ul class="fo-ress">${m.ressources.map(r =>
            `<li><a class="link-a" href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)} ↗</a></li>`).join("")}</ul>`;
        }
        if (m.note) h += `<p class="note">${esc(m.note)}</p>`;
        h += `</div>`;
      }
      h += `</section>`;
    });

    h += `<section class="panel"><h2>Une question ?</h2>
      <p style="margin:0">Écris directement à ton coach : <a class="link-a" href="mailto:${esc(CONFIG.marque.email)}">${esc(CONFIG.marque.email)}</a></p></section>`;
    return h;
  },

  /* ================= les outils interactifs ================= */
  widget(nom, D){
    if (nom === "diete")      return this.wDiete(D);
    if (nom === "priorites")  return this.wPriorites(D);
    if (nom === "notes")      return this.wNotes(D);
    if (nom === "objectifs")  return this.wObjectifs(D);
    if (nom === "challenges") return this.wChallenges(D);
    return "";
  },

  /* --- Organise ta diete : 12 semaines x 7 jours x 6 repas --- */
  ligneDiete(D){
    const s = String(D.semaine), j = String(D.jour);
    const sem = D.diete[s] || (D.diete[s] = {});
    if (!sem[j]) sem[j] = REPAS_SEM.map(() => ({ f:false, p:"", g:"", l:"" }));
    return sem[j];
  },
  kcal(r){ return (+r.p || 0) * 4 + (+r.g || 0) * 4 + (+r.l || 0) * 9; },

  wDiete(D){
    const lignes = this.ligneDiete(D);
    let tp = 0, tg = 0, tl = 0;
    lignes.forEach(r => { tp += +r.p || 0; tg += +r.g || 0; tl += +r.l || 0; });
    const tot = tp * 4 + tg * 4 + tl * 9;
    let sem = "";
    for (let i = 1; i <= 12; i++) sem += `<option value="${i}"${D.semaine === i ? " selected" : ""}>Semaine ${i}</option>`;

    return `<div class="fo-outil">
      <h3>Organise ta diète</h3>
      <p class="note" style="margin:0 0 12px">Note tes grammes, les calories se calculent toutes seules. Coche les repas que tu as réellement pris.</p>
      <div class="fo-barre">
        <select id="fo-sem" aria-label="Semaine">${sem}</select>
        <div class="tabs" style="margin:0">${JOURS_SEM.map((n, i) =>
          `<button type="button" class="tab" data-fj="${i}" aria-pressed="${D.jour === i}">${n.slice(0,3)}</button>`).join("")}</div>
      </div>
      <div class="fo-scroll"><table class="fo-tab fo-diete">
        <tr><th>Repas</th><th>Fait</th><th>Prot. (g)</th><th>Gluc. (g)</th><th>Lip. (g)</th><th>Calories</th></tr>
        ${lignes.map((r, i) => `<tr>
          <td>${REPAS_SEM[i]}</td>
          <td><input type="checkbox" data-df="${i}"${r.f ? " checked" : ""} aria-label="Repas pris"></td>
          <td><input type="number" min="0" step="1" data-dm="${i}.p" value="${esc(r.p)}" aria-label="Protéines"></td>
          <td><input type="number" min="0" step="1" data-dm="${i}.g" value="${esc(r.g)}" aria-label="Glucides"></td>
          <td><input type="number" min="0" step="1" data-dm="${i}.l" value="${esc(r.l)}" aria-label="Lipides"></td>
          <td class="fo-kcal" data-kcal="${i}">${this.kcal(r) || ""}</td>
        </tr>`).join("")}
        <tr class="fo-total"><td><b>Total du jour</b></td><td></td>
          <td id="fo-tp">${tp || ""}</td><td id="fo-tg">${tg || ""}</td><td id="fo-tl">${tl || ""}</td>
          <td id="fo-tk"><b>${tot || ""}</b></td></tr>
      </table></div>
      <p class="note" style="margin:10px 0 0">Rappel : 1 g de protéines = 4 kcal, 1 g de glucides = 4 kcal, 1 g de lipides = 9 kcal.</p>
    </div>`;
  },

  /* --- Outils de gestion de priorite --- */
  wPriorites(D){
    const liste = (cle, titre) => {
      const items = D.priorites[cle];
      return `<div class="fo-colonne">
        <h4>${titre}</h4>
        <ul class="fo-liste">${items.length ? items.map(t =>
          `<li><label class="fo-case"><input type="checkbox" data-pf="${cle}.${esc(t.id)}"${t.fait ? " checked" : ""}><span${t.fait ? ' class="fo-barre-txt"' : ""}>${esc(t.texte)}</span></label>
           <button type="button" class="fo-x" data-px="${cle}.${esc(t.id)}" aria-label="Supprimer">×</button></li>`).join("")
          : `<li class="note">Rien pour l'instant.</li>`}</ul>
        <div class="fo-ajout"><input type="text" data-pa="${cle}" placeholder="Ajouter une tâche…" aria-label="Nouvelle tâche">
          <button type="button" class="btn ghost" data-pb="${cle}">+</button></div>
      </div>`;
    };
    return `<div class="fo-outil"><h3>Priorise tes tâches</h3>
      <div class="fo-duo">${liste("semaine", "Cette semaine")}${liste("demain", "Demain")}</div></div>`;
  },

  /* --- Mes notes --- */
  wNotes(D){
    return `<div class="fo-outil"><h3>Mes notes</h3>
      ${D.notes.length ? D.notes.map(n => `<div class="fo-note">
        <div class="fo-note-tete">
          <input type="text" data-nt="${esc(n.id)}" value="${esc(n.titre)}" placeholder="Titre" aria-label="Titre de la note">
          <span class="meta">${esc(dateFr(n.date) || "")}</span>
          <button type="button" class="fo-x" data-nx="${esc(n.id)}" aria-label="Supprimer">×</button>
        </div>
        <textarea rows="4" data-nc="${esc(n.id)}" placeholder="Ta note…" aria-label="Contenu">${esc(n.texte)}</textarea>
      </div>`).join("") : `<p class="note">Aucune note. Écris ce qui t'aide : un déclic, une difficulté, une idée de repas.</p>`}
      <div class="actions"><button type="button" class="btn ghost" id="fo-note-add">+ Ajouter une note</button></div></div>`;
  },

  /* --- Mes objectifs --- */
  wObjectifs(D){
    const carte = o => `<div class="fo-obj-carte${o.fait ? " fo-fait" : ""}">
      <label class="fo-case"><input type="checkbox" data-of="${esc(o.id)}"${o.fait ? " checked" : ""}><span class="sr-only">Atteint</span></label>
      <div class="fo-obj-champs">
        <input type="text" data-ot="${esc(o.id)}" value="${esc(o.titre)}" placeholder="Mon objectif (spécifique)" aria-label="Objectif">
        <div class="fo-obj-bas">
          <input type="text" data-om="${esc(o.id)}" value="${esc(o.mesure)}" placeholder="Je le mesure avec…" aria-label="Mesure">
          <input type="date" data-oe="${esc(o.id)}" value="${esc(o.echeance)}" aria-label="Échéance">
        </div>
      </div>
      <button type="button" class="fo-x" data-ox="${esc(o.id)}" aria-label="Supprimer">×</button>
    </div>`;
    const encours = D.objectifs.filter(o => !o.fait), atteints = D.objectifs.filter(o => o.fait);
    return `<div class="fo-outil"><h3>Mes objectifs</h3>
      <p class="note" style="margin:0 0 12px">Un objectif par ligne, au format S.M.A.R.T : ce que tu veux, comment tu le mesures, pour quand.</p>
      <h4>Suivi des objectifs</h4>
      ${encours.length ? encours.map(carte).join("") : `<p class="note">Aucun objectif en cours.</p>`}
      <div class="actions"><button type="button" class="btn ghost" id="fo-obj-add">+ Ajouter un objectif</button></div>
      ${atteints.length ? `<h4>Atteints</h4>${atteints.map(carte).join("")}` : ""}
    </div>`;
  },

  /* --- Les challenges --- */
  wChallenges(D){
    let h = `<div class="fo-outil"><h3>Choisis ton challenge</h3>
      <p class="note" style="margin:0 0 12px">Un challenge par semaine, sur trois axes. Choisis-en un et tiens-le sept jours.</p>`;
    FORMATION.challenges.forEach(c => {
      const on = D.challenge === c.id;
      h += `<div class="fo-chal${on ? " fo-chal-on" : ""}">
        <button type="button" class="fo-chal-tete" data-chal="${esc(c.id)}" aria-pressed="${on}">
          <span>${esc(c.titre)}</span><span class="pastille">${on ? "Choisi" : "Choisir"}</span>
        </button>
        <div class="fo-chal-corps">${c.axes.map(a => `<div class="fo-axe">
          <b>${esc(a.nom)}</b>
          <p class="note" style="margin:2px 0 0"><i>Objectif :</i> ${esc(a.objectif)}</p>
          <p style="margin:4px 0 0">${esc(a.defi)}</p>
        </div>`).join("")}</div>
      </div>`;
    });
    const faits = FORMATION.defis.filter(d => D.defis[d[0]]).length;
    h += `<h4>10 défis sur une semaine <span class="pastille">${faits}/10</span></h4>
      <ul class="fo-liste fo-defis">${FORMATION.defis.map(d =>
        `<li><label class="fo-case"><input type="checkbox" data-defi="${esc(d[0])}"${D.defis[d[0]] ? " checked" : ""}>
          <span><b>${esc(d[1])}</b><br><span class="note">${esc(d[2])}</span></span></label></li>`).join("")}</ul></div>`;
    return h;
  },

  /* ================= montage ================= */
  html(){ return `<div id="fo-vue"><section class="panel"><div class="empty">Chargement…</div></section></div>`; },

  async init(){
    const self = this;
    const D = this.migrer(await Store.lire(this.cle, this.vide()));
    Store.cache[this.cle] = D;
    const zone = $("fo-vue");
    if (!zone) return;
    const sauver = () => Store.ecrire(self.cle, D);
    const visibles = outilsVisibles().map(o => o.id);
    const nouvelId = () => "x" + Date.now().toString(36) + Math.floor(Math.random() * 1000);

    const dessiner = () => {
      zone.innerHTML = self.vue(D, visibles);
      brancher();
    };

    function brancher(){
      /* videos : on ne charge le lecteur qu'au clic */
      $$(".video-vignette", zone).forEach(v => v.addEventListener("click", () => {
        const cadre = document.createElement("div");
        cadre.className = "video-cadre";
        cadre.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?rel=0&autoplay=1" title="Vidéo de la formation" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        v.parentNode.replaceChild(cadre, v);
      }));

      /* ouverture des modules et des lecons */
      $$("[data-mod]", zone).forEach(b => b.addEventListener("click", () => {
        D.ouvert = (D.ouvert === b.dataset.mod) ? "" : b.dataset.mod;
        sauver(); dessiner();
        const t = zone.querySelector('[data-mod="' + D.ouvert + '"]');
        if (t) t.scrollIntoView({ block:"start", behavior:"smooth" });
      }));
      $$("[data-lecon]", zone).forEach(b => b.addEventListener("click", () => {
        D.lecon = (D.lecon === b.dataset.lecon) ? "" : b.dataset.lecon;
        sauver(); dessiner();
      }));

      /* cases a cocher du parcours */
      $$("[data-coche]", zone).forEach(c => c.addEventListener("change", () => {
        D.coches[c.dataset.coche] = c.checked;
        if (!c.checked) delete D.coches[c.dataset.coche];
        sauver(); dessiner();
      }));

      /* --- diete --- */
      const selSem = $("fo-sem", zone);
      if (selSem) selSem.addEventListener("change", () => { D.semaine = +selSem.value; sauver(); dessiner(); });
      $$("[data-fj]", zone).forEach(b => b.addEventListener("click", () => { D.jour = +b.dataset.fj; sauver(); dessiner(); }));
      $$("[data-df]", zone).forEach(c => c.addEventListener("change", () => {
        self.ligneDiete(D)[+c.dataset.df].f = c.checked; sauver();
      }));
      const majTotaux = () => {
        const lignes = self.ligneDiete(D);
        let tp = 0, tg = 0, tl = 0;
        lignes.forEach((r, i) => {
          tp += +r.p || 0; tg += +r.g || 0; tl += +r.l || 0;
          const c = zone.querySelector('[data-kcal="' + i + '"]');
          if (c) c.textContent = self.kcal(r) || "";
        });
        const mettre = (id, v) => { const e = $(id, zone); if (e) e.textContent = v || ""; };
        mettre("fo-tp", tp); mettre("fo-tg", tg); mettre("fo-tl", tl);
        const k = $("fo-tk", zone); if (k) k.innerHTML = "<b>" + ((tp * 4 + tg * 4 + tl * 9) || "") + "</b>";
      };
      $$("[data-dm]", zone).forEach(e => e.addEventListener("input", () => {
        const p = e.dataset.dm.split(".");
        self.ligneDiete(D)[+p[0]][p[1]] = e.value;
        majTotaux(); sauver();
      }));

      /* --- priorites --- */
      const ajouter = cle => {
        const champ = zone.querySelector('[data-pa="' + cle + '"]');
        const t = (champ && champ.value || "").trim();
        if (!t) return;
        D.priorites[cle].push({ id: nouvelId(), texte: t, fait: false });
        sauver(); dessiner();
      };
      $$("[data-pb]", zone).forEach(b => b.addEventListener("click", () => ajouter(b.dataset.pb)));
      $$("[data-pa]", zone).forEach(e => e.addEventListener("keydown", ev => {
        if (ev.key === "Enter"){ ev.preventDefault(); ajouter(e.dataset.pa); }
      }));
      $$("[data-pf]", zone).forEach(c => c.addEventListener("change", () => {
        const p = c.dataset.pf.split("."), t = D.priorites[p[0]].find(x => x.id === p[1]);
        if (t) t.fait = c.checked;
        sauver(); dessiner();
      }));
      $$("[data-px]", zone).forEach(b => b.addEventListener("click", () => {
        const p = b.dataset.px.split(".");
        D.priorites[p[0]] = D.priorites[p[0]].filter(x => x.id !== p[1]);
        sauver(); dessiner();
      }));

      /* --- notes --- */
      const add = $("fo-note-add", zone);
      if (add) add.addEventListener("click", () => {
        D.notes.unshift({ id: nouvelId(), date: aujourdhui(), titre:"", texte:"" });
        sauver(); dessiner();
      });
      $$("[data-nt]", zone).forEach(e => e.addEventListener("input", () => {
        const n = D.notes.find(x => x.id === e.dataset.nt); if (n){ n.titre = e.value; sauver(); }
      }));
      $$("[data-nc]", zone).forEach(e => e.addEventListener("input", () => {
        const n = D.notes.find(x => x.id === e.dataset.nc); if (n){ n.texte = e.value; sauver(); }
      }));
      $$("[data-nx]", zone).forEach(b => b.addEventListener("click", () => {
        D.notes = D.notes.filter(x => x.id !== b.dataset.nx); sauver(); dessiner();
      }));

      /* --- objectifs --- */
      const addO = $("fo-obj-add", zone);
      if (addO) addO.addEventListener("click", () => {
        D.objectifs.push({ id: nouvelId(), titre:"", mesure:"", echeance:"", fait:false });
        sauver(); dessiner();
      });
      const champObj = (attr, prop) => $$("[data-" + attr + "]", zone).forEach(e => e.addEventListener("input", () => {
        const o = D.objectifs.find(x => x.id === e.dataset[attr]); if (o){ o[prop] = e.value; sauver(); }
      }));
      champObj("ot", "titre"); champObj("om", "mesure"); champObj("oe", "echeance");
      $$("[data-of]", zone).forEach(c => c.addEventListener("change", () => {
        const o = D.objectifs.find(x => x.id === c.dataset.of); if (o) o.fait = c.checked;
        sauver(); dessiner();
      }));
      $$("[data-ox]", zone).forEach(b => b.addEventListener("click", () => {
        D.objectifs = D.objectifs.filter(x => x.id !== b.dataset.ox); sauver(); dessiner();
      }));

      /* --- challenges --- */
      $$("[data-chal]", zone).forEach(b => b.addEventListener("click", () => {
        D.challenge = (D.challenge === b.dataset.chal) ? "" : b.dataset.chal;
        sauver(); dessiner();
      }));
      $$("[data-defi]", zone).forEach(c => c.addEventListener("change", () => {
        D.defis[c.dataset.defi] = c.checked;
        if (!c.checked) delete D.defis[c.dataset.defi];
        sauver(); dessiner();
      }));
    }

    dessiner();
  }
};


/* ------------------------------------------------------------------
   LISTE DES OUTILS — ajouter un objet ici suffit à créer un onglet
   ------------------------------------------------------------------ */
const OUTILS = [outilProfil, outilFormation, outilProgramme, outilNutrition, outilCalculateur, outilMensurations, outilEntrainement, outilBibliotheque, outilCatalogue, outilClients];

/* ==================================================================
   [G] NAVIGATION, CONNEXION ET DEMARRAGE
   Chaque outil a sa propre adresse : #/calculateur, #/mensurations,
   #/entrainement. Le coach voit en plus #/clients.
   ================================================================== */
let courant = OUTILS[0].id;
let nettoyage = null;

function outilsVisibles(){
  /* role: "coach"      -> outil du coach, quitte la fiche client quand on l'ouvre
     masque_client: true -> outil du coach, mais qui reste dans la fiche du client */
  return OUTILS.filter(o => (!o.role || (o.role === "coach" && Auth.estCoach()))
                         && (!o.masque_client || Auth.estCoach()));
}

/* « Mon programme » devient « Son programme » quand le coach consulte
   une fiche : le meme mot pour deux personnes differentes, c'est ce qui
   fait qu'on ne sait plus chez qui on ecrit. */
function nomOnglet(o){
  /* Les outils du coach gardent leur nom : « Mes clients » ne devient
     jamais « Ses clients ». Seuls les outils qui affichent les donnees
     d'un client changent de possessif. */
  if (!Store.idConsulte || o.role === "coach") return o.nom;
  return o.nom.replace(/^Mon /, "Son ").replace(/^Mes /, "Ses ").replace(/^Ma /, "Sa ");
}

function construireNav(){
  const nav = $("nav");
  nav.innerHTML = outilsVisibles().map(o =>
    `<a href="#/${o.id}" data-id="${o.id}"><span class="ico" aria-hidden="true">${o.icone}</span>${esc(nomOnglet(o))}</a>`
  ).join("");
  $("brand-name").textContent = CONFIG.marque.nom;
  const sub = $("brand-sub");
  sub.textContent = CONFIG.marque.programme || "";
  sub.hidden = !CONFIG.marque.programme;
  const lg = $("brand-logo");
  if (CONFIG.marque.logo){
    lg.src = CONFIG.marque.logo;
    lg.alt = CONFIG.marque.nom;
    lg.style.height = (CONFIG.marque.logo_hauteur || 34) + "px";
    lg.hidden = false;
  } else lg.hidden = true;
  $("foot-left").textContent  = CONFIG.marque.programme ? `${CONFIG.marque.programme} — ${CONFIG.marque.nom}` : CONFIG.marque.nom;
  $("foot-right").innerHTML   = `Une question ? <a href="${CONFIG.marque.instagram}" target="_blank" rel="noopener">${esc(CONFIG.marque.pseudo)}</a> · ${esc(CONFIG.marque.email)}` + (CONFIG.marque.version ? ` · <span class="version">v${esc(CONFIG.marque.version)}</span>` : "");

  const p = Auth.profil, u = Auth.utilisateur();
  const nom = p && (p.prenom || p.nom) ? ((p.prenom || "") + " " + (p.nom || "")).trim() : (u ? u.email : "");
  $("qui").textContent = nom + (Auth.estCoach() ? " · coach" : "");
  $("compte").hidden = false;
  $("deco").onclick = () => Auth.deconnecter();
}

function marquerNav(id){
  $$("#nav a").forEach(a => {
    if (a.dataset.id === id) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
}

function bandeauConsultation(){
  if (!Store.idConsulte) return "";
  /* Sans ces boutons, le coach atterrit sur une page et ne devine pas que
     tout le reste de la fiche est accessible par les onglets du haut.
     Un mode implicite est un mode qu'on ne trouve pas. */
  const actions = [
    { id:"profil",       nom:"Son questionnaire" },
    { id:"programme",    nom:"Son programme",  fort:true },
    { id:"nutrition",    nom:"Ses repas",      fort:true },
    { id:"calculateur",  nom:"Ses calories", fort:true },
    { id:"mensurations", nom:"Ses courbes" },
    { id:"entrainement", nom:"Ses séances" }
  ];
  return `<div class="bandeau">
    <div class="bandeau-tete">
      <strong>Fiche de ${esc(Store.nomConsulte || "ce client")}</strong>
      <span class="note">Tu vois ses données. Les deux boutons dorés sont les seuls endroits où tu écris pour lui.</span>
    </div>
    <div class="bandeau-actions">
      ${actions.map(a => `<a href="#/${a.id}" class="b-act${a.fort ? " fort" : ""}${courant === a.id ? " ici" : ""}">${esc(a.nom)}</a>`).join("")}
      <button class="sortir" type="button" id="sortir-fiche">Revenir à mes clients</button>
    </div>
  </div>`;
}

async function afficher(id, silencieux){
  const dispo = outilsVisibles();
  const outil = dispo.find(o => o.id === id) || dispo[0];
  courant = outil.id;
  if (nettoyage){ nettoyage(); nettoyage = null; }

  if (outil.role === "coach"){ Store.oublier(Store.idConsulte); Store.idConsulte = null; Store.nomConsulte = null; }

  $("vue").innerHTML = `
    ${bandeauConsultation()}
    <header class="masthead">
      <span class="eyebrow">${Store.idConsulte ? esc(Store.nomConsulte || "client") + " — " : (CONFIG.marque.programme ? esc(CONFIG.marque.programme) + " — " : "")}${esc(nomOnglet(outil))}</span>
      <h1>${Store.idConsulte ? esc(nomOnglet(outil)) : esc(outil.titre)}</h1>
      ${Store.idConsulte ? "" : `<p class="lede">${esc(outil.accroche)}</p>`}
    </header>
    ${outil.html()}
    ${(outil.cle && !Store.idConsulte) ? blocSauvegarde() : ""}`;

  construireNav();   // les libelles dependent du mode : on les rafraichit
  const modifiable = !Store.idConsulte || (Auth.estCoach() && (outil.id === "programme" || outil.id === "nutrition" || outil.id === "calculateur"));
  $("vue").className = modifiable ? "wrap" : "wrap lecture-seule";

  nettoyage = (await outil.init()) || null;
  if (outil.cle && !Store.idConsulte){ initSauvegarde(); }
  const sortir = $("sortir-fiche");
  if (sortir) sortir.addEventListener("click", () => {
    Store.oublier(Store.idConsulte); Store.idConsulte = null; Store.nomConsulte = null; location.hash = "#/clients";
  });

  marquerNav(outil.id);
  if (!silencieux) window.scrollTo(0, 0);
}

function routeDepuisAdresse(){
  let id = (location.hash || "").replace(/^#\/?/, "");
  if (id.indexOf("=") > -1 || id.indexOf("&") > -1) id = "";
  afficher(outilsVisibles().some(o => o.id === id) ? id : outilsVisibles()[0].id);
}

/* ---------------------- ÉCRAN DE CONNEXION ---------------------- */
function portail(mode){
  mode = mode || "connexion";
  document.body.innerHTML = `
  <div class="portail">
    <div class="carte-co">
      ${CONFIG.marque.logo ? `<img class="logo-img" src="${esc(CONFIG.marque.logo)}" alt="${esc(CONFIG.marque.nom)}">` : ""}
      <div class="logo">${esc(CONFIG.marque.nom)}</div>
      ${CONFIG.marque.programme ? `<div class="sous">${esc(CONFIG.marque.programme)}</div>` : ""}
      <h2>${mode === "connexion" ? "Connexion à ton espace" : mode === "oubli" ? "Mot de passe oublié" : "Créer mon accès"}</h2>
      <div id="co-err"></div>
      ${mode === "inscription" ? `
        <div class="champ"><label for="c-prenom">Prénom</label><input id="c-prenom" type="text" autocomplete="given-name"></div>
        <div class="champ"><label for="c-nom">Nom</label><input id="c-nom" type="text" autocomplete="family-name"></div>` : ""}
      <div class="champ"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="email"></div>
      ${mode !== "oubli" ? `<div class="champ"><label for="c-mdp">Mot de passe</label><input id="c-mdp" type="password" autocomplete="${mode === "inscription" ? "new-password" : "current-password"}"></div>` : ""}
      ${mode === "inscription" ? `<div class="champ"><label for="c-mdp2">Confirme ton mot de passe</label><input id="c-mdp2" type="password" autocomplete="new-password"></div>` : ""}
      ${mode !== "oubli" ? `<label class="co-rester"><input type="checkbox" id="c-rester" checked><span>Rester connecté</span></label>` : ""}
      <button class="btn" id="c-go">${mode === "connexion" ? "Se connecter" : mode === "oubli" ? "Recevoir le lien" : "Créer mon accès"}</button>
      ${CONFIG.marque.version ? `<p class="co-aide">v${esc(CONFIG.marque.version)}</p>` : ""}
      <div class="bascule">
        ${mode === "connexion"
          ? `<button type="button" data-mode="oubli">Mot de passe oublié ?</button>`
          : `<button type="button" data-mode="connexion">Retour à la connexion</button>`}
      </div>
    </div>
  </div>`;

  const err = (msg, ok) => { const e = $("co-err"); e.className = "erreur" + (ok ? " ok" : ""); e.textContent = msg; };

  $$("[data-mode]").forEach(b => b.addEventListener("click", () => portail(b.dataset.mode)));

  const valider = async () => {
    const email = ($("c-email").value || "").trim();
    const mdp = $("c-mdp") ? $("c-mdp").value : "";
    if (!email){ err("Indique ton email."); return; }
    /* le choix doit etre pris AVANT la connexion : c'est lui qui decide
       ou la session sera rangee */
    const rester = $("c-rester");
    Auth.persistant = rester ? rester.checked : true;
    const bouton = $("c-go"); bouton.disabled = true; bouton.textContent = "Un instant…";
    try {
      if (mode === "oubli"){
        await Auth.motDePasseOublie(email);
        err("Si un compte existe pour cet email, tu vas recevoir un lien.", true);
      } else if (mode === "inscription"){
        if (mdp.length < 6) throw new Error("Le mot de passe doit faire au moins 6 caractères.");
        if (mdp !== $("c-mdp2").value) throw new Error("Les deux mots de passe ne sont pas identiques.");
        await Auth.inscrire(email, mdp, ($("c-prenom").value||"").trim(), ($("c-nom").value||"").trim());
        location.reload();
      } else {
        await Auth.connecter(email, mdp);
        location.reload();
      }
    } catch(e){
      const m = (e.message || "").toLowerCase();
      err(m.indexOf("invalid") > -1 ? "Email ou mot de passe incorrect."
        : m.indexOf("password") > -1 ? "Le mot de passe doit faire au moins 6 caractères."
        : e.message || "Une erreur est survenue.");
    }
    bouton.disabled = false;
    bouton.textContent = mode === "connexion" ? "Se connecter" : mode === "oubli" ? "Recevoir le lien" : "Créer mon accès";
  };

  $("c-go").addEventListener("click", valider);
  document.addEventListener("keydown", e => { if (e.key === "Enter") valider(); });
}

/* ---------------------- NOUVEAU MOT DE PASSE ----------------------
   Quand le client clique sur le lien recu par email, Supabase le renvoie
   ici avec un jeton dans l'adresse. On lui fait choisir son mot de passe. */
function lireAdresse(){
  const h = (location.hash || "").replace(/^#\/?/, "");
  const p = {};
  h.split("&").forEach(kv => {
    const [k, v] = kv.split("=");
    if (k) p[decodeURIComponent(k)] = decodeURIComponent((v || "").replace(/\+/g, " "));
  });
  return p;
}

function ecranNouveauMotDePasse(jeton){
  document.body.innerHTML = `
  <div class="portail">
    <div class="carte-co">
      ${CONFIG.marque.logo ? `<img class="logo-img" src="${esc(CONFIG.marque.logo)}" alt="${esc(CONFIG.marque.nom)}">` : ""}
      <div class="logo">${esc(CONFIG.marque.nom)}</div>
      ${CONFIG.marque.programme ? `<div class="sous">${esc(CONFIG.marque.programme)}</div>` : ""}
      <h2>Choisis ton nouveau mot de passe</h2>
      <div id="co-err"></div>
      <div class="champ"><label for="r-mdp">Nouveau mot de passe</label><input id="r-mdp" type="password" autocomplete="new-password"></div>
      <div class="champ"><label for="r-mdp2">Confirme-le</label><input id="r-mdp2" type="password" autocomplete="new-password"></div>
      <button class="btn" id="r-go">Enregistrer</button>
    </div>
  </div>`;
  const err = (m, ok) => { const e = $("co-err"); e.className = "erreur" + (ok ? " ok" : ""); e.textContent = m; };
  $("r-go").addEventListener("click", async () => {
    const a = $("r-mdp").value, b = $("r-mdp2").value;
    if (a.length < 6){ err("Le mot de passe doit faire au moins 6 caractères."); return; }
    if (a !== b){ err("Les deux mots de passe ne sont pas identiques."); return; }
    const bouton = $("r-go"); bouton.disabled = true; bouton.textContent = "Un instant…";
    try {
      await fetch(CONFIG.supabase.url + "/auth/v1/user", {
        method: "PUT",
        headers: { "apikey": CONFIG.supabase.cle, "Content-Type": "application/json", "Authorization": "Bearer " + jeton },
        body: JSON.stringify({ password: a })
      }).then(async r => { if (!r.ok) throw new Error((await r.json()).msg || "Lien expiré."); });
      err("Mot de passe enregistré. Tu peux te connecter.", true);
      setTimeout(() => { location.hash = ""; location.reload(); }, 1400);
    } catch(e){
      err(e.message || "Ce lien n'est plus valable. Redemande-en un depuis « Mot de passe oublié ».");
      bouton.disabled = false; bouton.textContent = "Enregistrer";
    }
  });
}

/* ---------------------- DÉMARRAGE ---------------------- */
let premiereFois = false;

(async function demarrer(){
  const p = lireAdresse();

  /* lien de reinitialisation recu par email */
  if (p.type === "recovery" && p.access_token){ ecranNouveauMotDePasse(p.access_token); return; }
  if (p.error_description){
    Auth.oublier();
    portail("connexion");
    setTimeout(() => { const e = $("co-err"); if (e){ e.className = "erreur"; e.textContent = p.error_description; } }, 60);
    return;
  }

  Auth.charger();
  const veutSinscrire = (location.hash || "").indexOf("inscription") > -1;
  if (!Auth.connecte()){ portail(veutSinscrire ? "inscription" : "connexion"); return; }
  const ok = await Auth.assurer();
  if (!ok){ portail("connexion"); return; }
  try { await Auth.chargerProfil(); } catch(e){}

  construireNav();
  window.addEventListener("hashchange", routeDepuisAdresse);

  /* Premiere connexion d'un client : on l'envoie remplir son profil */
  if (!Auth.estCoach()){
    const intake = await Store.lire("intake", {});
    if (!intake || !intake.complet){
      premiereFois = true;
      location.hash = "#/profil";
      await afficher("profil");
      const v = $("vue");
      const mot = document.createElement("div");
      mot.className = "bandeau";
      const dejaVenu = intake && Object.keys(intake).length > 3;
      mot.innerHTML = dejaVenu
        ? `<strong>Une réponse manque à ton profil.</strong><span class="note">Une question a été ajoutée depuis ton inscription. Complète-la et enregistre : ça prend dix secondes.</span>`
        : `<strong>Bienvenue !</strong><span class="note">Commence par remplir ton profil : c'est ce qui permet à ton coach de construire ton suivi.</span>`;
      v.insertBefore(mot, v.firstChild);
      return;
    }
  }

  routeDepuisAdresse();
})();
</script>
