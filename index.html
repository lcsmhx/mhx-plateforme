  titre: FORMATION.titre,
  accroche: "Ta formation complète : les vidéos, les guides et tes outils de suivi. Ce que tu coches ici reste enregistré.",

  vide(){
    return { coches:{}, ouvert:"", lecon:"", challenge:"", defis:{},
             diete:{}, semaine:1, jour:0,
             priorites:{ semaine:[], demain:[] }, notes:[], objectifs:[] };
  },

  migrer(D){
    const v = this.vide();
    if (!D || typeof D !== "object") return v;
    Object.keys(v).forEach(k => { if (D[k] == null) D[k] = v[k]; });
    if (!D.priorites.semaine) D.priorites.semaine = [];
    if (!D.priorites.demain)  D.priorites.demain  = [];
    return D;
  },

  /* ---------- petites briques d'affichage ---------- */
  video(id, legende){
    if (!id) return "";
    return `<div class="video-boite">
      <button type="button" class="video-vignette" data-yt="${esc(id)}" aria-label="Lire la vidéo">
        <img src="https://img.youtube.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy">
        <span class="jouer">▶ ${esc(legende || "Regarder la vidéo")}</span>
      </button>
    </div>`;
  },

  caseHTML(id, texte, coche){
    return `<li><label class="fo-case"><input type="checkbox" data-coche="${esc(id)}"${coche ? " checked" : ""}><span>${esc(texte)}</span></label></li>`;
  },

  /* combien de cases cochees sur combien, tous modules confondus */
  compte(D){
    let tot = 0, faits = 0;
    FORMATION.processus.forEach(s => s.taches.forEach(t => { tot++; if (D.coches[t[0]]) faits++; }));
    FORMATION.modules.forEach(m => (m.taches || []).forEach(t => { tot++; if (D.coches[t[0]]) faits++; }));
    return { tot, faits, pct: tot ? Math.round(faits * 100 / tot) : 0 };
  },

  compteModule(D, m){
    const t = (m.taches || []);
    return { tot: t.length, faits: t.filter(x => D.coches[x[0]]).length };
  },

  /* ---------- la page ---------- */
  vue(D, visibles){
    const c = this.compte(D);
    let h = "";

    /* en-tete : progression + video de presentation (v36 : bibliotheque) */
    const nbModules = FORMATION.modules.length, modulesFinis = FORMATION.modules.filter(m => { const cm = this.compteModule(D, m); return cm.tot && cm.faits === cm.tot; }).length;
    h += `<section class="panel">
      <div class="prog-tete-haut">
        <div>
          <span class="eyebrow">${esc(trad("Bibliothèque"))} · ${nbModules} ${esc(trad("modules"))}</span>
          <h2 style="margin:4px 0 8px">Ton parcours</h2>
          <p style="margin:0">${esc(FORMATION.intro)}</p>
        </div>
        <div class="tile prog-compteur"><div class="t-lbl">Progression</div><div class="t-val readout${c.pct >= 100 ? " pos" : ""}">${c.pct}<small>%</small></div><div class="t-sub">${c.faits} / ${c.tot} ${esc(trad("étapes"))}</div></div>
      </div>
      <div class="fo-jauge" style="margin-top:14px"><div class="fo-jauge-in" style="width:${c.pct}%"></div></div>
      <p class="note" style="margin:8px 0 16px">${modulesFinis} ${esc(trad(modulesFinis > 1 ? "modules terminés" : "module terminé"))} ${esc(trad("sur"))} ${nbModules}</p>
      ${this.video(FORMATION.video, "Voir la présentation de la formation")}
    </section>`;

    /* le processus */
    h += `<section class="panel"><h2>Le processus, étape par étape</h2>`;
    FORMATION.processus.forEach(s => {
      h += `<div class="fo-step"><h3>${esc(s.titre)}</h3><ul class="fo-liste">
        ${s.taches.map(t => this.caseHTML(t[0], t[1], D.coches[t[0]])).join("")}
      </ul></div>`;
    });
    h += `</section>`;

    /* les modules : une carte numerotee, sa barre, et son contenu quand on l'ouvre */
    FORMATION.modules.forEach((m, idx) => {
      const cm = this.compteModule(D, m);
      const ouvert = D.ouvert === m.id;
      const pct = cm.tot ? Math.round(cm.faits / cm.tot * 100) : 0;
      const titre = String(m.titre || "").replace(/^Module \d+\s*[—-]\s*/, "");
      h += `<section class="panel fo-mod${ouvert ? " ouvert" : ""}${cm.tot && cm.faits === cm.tot ? " fini" : ""}">
        <button type="button" class="fo-tete" data-mod="${esc(m.id)}" aria-expanded="${ouvert}">
          <span class="fo-num" aria-hidden="true">${String(idx).padStart(2, "0")}</span>
          <span class="fo-corps-tete"><span class="fo-nom">${esc(titre)}</span><span class="fo-obj-court">${esc(m.objectif || "")}</span>
            ${cm.tot ? `<span class="fo-jauge fo-jauge-mod"><span class="fo-jauge-in" style="width:${pct}%"></span></span>` : ""}</span>
          ${cm.tot ? `<span class="pastille${cm.faits === cm.tot ? " fo-ok" : ""}">${cm.faits}/${cm.tot}</span>` : ""}
          <span class="fo-fleche">${ouvert ? "▾" : "▸"}</span>
        </button>`;
      if (ouvert){
        h += `<div class="fo-corps">
          <p class="fo-obj"><b>Objectif :</b> ${esc(m.objectif)}</p>
          ${(m.contenu || []).length ? `<ul class="fo-contenu">${m.contenu.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${this.video(m.video)}
          ${(m.taches || []).length ? `<h3>Ta to-do list</h3><ul class="fo-liste">${m.taches.map(t => this.caseHTML(t[0], t[1], D.coches[t[0]])).join("")}</ul>` : ""}`;

        /* lecons rapatriees */
        (m.lecons || []).forEach(cle => {
          const L = LECONS[cle]; if (!L) return;
          const on = D.lecon === cle;
          h += `<div class="fo-lecon">
            <button type="button" class="fo-lecon-tete" data-lecon="${esc(cle)}" aria-expanded="${on}">
              <span>📄 ${esc(L.titre)}</span><span class="meta">${esc(L.duree || "")}</span>
            </button>
            ${on ? `<div class="fo-lecon-corps">${L.html}</div>` : ""}
          </div>`;
        });

        /* outils interactifs */
        (m.widgets || []).forEach(w => { h += this.widget(w, D); });

        /* liens internes */
        const internes = (m.interne || []).filter(x => visibles.indexOf(x.id) >= 0);
        if (internes.length){
          h += `<h3>Dans ton espace</h3><ul class="fo-ress">${internes.map(x =>
            `<li><a class="link-a" href="#/${esc(x.id)}">${esc(x.t)} →</a></li>`).join("")}</ul>`;
        }
        if ((m.ressources || []).length){
          h += `<h3>Tes ressources à télécharger</h3><ul class="fo-ress">${m.ressources.map(r =>
            (lienSur(r.u) ? `<li><a class="link-a" href="${esc(lienSur(r.u))}" target="_blank" rel="noopener">${esc(r.t)} ↗</a></li>` : `<li>${esc(r.t)}</li>`)).join("")}</ul>`;
        }
        if (m.note) h += `<p class="note">${esc(m.note)}</p>`;
        h += `</div>`;
      }
      h += `</section>`;
    });

    h += `<section class="panel"><h2>Une question ?</h2>
      <p style="margin:0">Écris directement à ton coach : <a class="link-a" href="mailto:${esc(CONFIG.marque.email)}">${esc(CONFIG.marque.email)}</a></p></section>`;
    return h;
  },

  /* ================= les outils interactifs ================= */
  widget(nom, D){
    if (nom === "diete")      return this.wDiete(D);
    if (nom === "priorites")  return this.wPriorites(D);
    if (nom === "notes")      return this.wNotes(D);
    if (nom === "objectifs")  return this.wObjectifs(D);
    if (nom === "challenges") return this.wChallenges(D);
    return "";
  },

  /* --- Organise ta diete : 12 semaines x 7 jours x 6 repas --- */
  ligneDiete(D){
    const s = String(D.semaine), j = String(D.jour);
    const sem = D.diete[s] || (D.diete[s] = {});
    if (!sem[j]) sem[j] = REPAS_SEM.map(() => ({ f:false, p:"", g:"", l:"" }));
    return sem[j];
  },
  kcal(r){ return (+r.p || 0) * 4 + (+r.g || 0) * 4 + (+r.l || 0) * 9; },

  wDiete(D){
    const lignes = this.ligneDiete(D);
    let tp = 0, tg = 0, tl = 0;
    lignes.forEach(r => { tp += +r.p || 0; tg += +r.g || 0; tl += +r.l || 0; });
    const tot = tp * 4 + tg * 4 + tl * 9;
    let sem = "";
    for (let i = 1; i <= 12; i++) sem += `<option value="${i}"${D.semaine === i ? " selected" : ""}>Semaine ${i}</option>`;

    return `<div class="fo-outil">
      <h3>Organise ta diète</h3>
      <p class="note" style="margin:0 0 12px">Note tes grammes, les calories se calculent toutes seules. Coche les repas que tu as réellement pris.</p>
      <div class="fo-barre">
        <select id="fo-sem" aria-label="Semaine">${sem}</select>
        <div class="tabs" style="margin:0">${JOURS_SEM.map((n, i) =>
          `<button type="button" class="tab" data-fj="${i}" aria-pressed="${D.jour === i}">${n.slice(0,3)}</button>`).join("")}</div>
      </div>
      <div class="fo-scroll"><table class="fo-tab fo-diete">
        <tr><th>Repas</th><th>Fait</th><th>Prot. (g)</th><th>Gluc. (g)</th><th>Lip. (g)</th><th>Calories</th></tr>
        ${lignes.map((r, i) => `<tr>
          <td>${REPAS_SEM[i]}</td>
          <td><input type="checkbox" data-df="${i}"${r.f ? " checked" : ""} aria-label="Repas pris"></td>
          <td><input type="number" min="0" step="1" data-dm="${i}.p" value="${esc(r.p)}" aria-label="Protéines"></td>
          <td><input type="number" min="0" step="1" data-dm="${i}.g" value="${esc(r.g)}" aria-label="Glucides"></td>
          <td><input type="number" min="0" step="1" data-dm="${i}.l" value="${esc(r.l)}" aria-label="Lipides"></td>
          <td class="fo-kcal" data-kcal="${i}">${this.kcal(r) || ""}</td>
        </tr>`).join("")}
        <tr class="fo-total"><td><b>Total du jour</b></td><td></td>
          <td id="fo-tp">${tp || ""}</td><td id="fo-tg">${tg || ""}</td><td id="fo-tl">${tl || ""}</td>
          <td id="fo-tk"><b>${tot || ""}</b></td></tr>
      </table></div>
      <p class="note" style="margin:10px 0 0">Rappel : 1 g de protéines = 4 kcal, 1 g de glucides = 4 kcal, 1 g de lipides = 9 kcal.</p>
    </div>`;
  },

  /* --- Outils de gestion de priorite --- */
  wPriorites(D){
    const liste = (cle, titre) => {
      const items = D.priorites[cle];
      return `<div class="fo-colonne">
        <h4>${titre}</h4>
        <ul class="fo-liste">${items.length ? items.map(t =>
          `<li><label class="fo-case"><input type="checkbox" data-pf="${cle}.${esc(t.id)}"${t.fait ? " checked" : ""}><span${t.fait ? ' class="fo-barre-txt"' : ""}>${esc(t.texte)}</span></label>
           <button type="button" class="fo-x" data-px="${cle}.${esc(t.id)}" aria-label="Supprimer">×</button></li>`).join("")
          : `<li class="note">Rien pour l'instant.</li>`}</ul>
        <div class="fo-ajout"><input type="text" data-pa="${cle}" placeholder="Ajouter une tâche…" aria-label="Nouvelle tâche">
          <button type="button" class="btn ghost" data-pb="${cle}">+</button></div>
      </div>`;
    };
    return `<div class="fo-outil"><h3>Priorise tes tâches</h3>
      <div class="fo-duo">${liste("semaine", "Cette semaine")}${liste("demain", "Demain")}</div></div>`;
  },

  /* --- Mes notes --- */
  wNotes(D){
    return `<div class="fo-outil"><h3>Mes notes</h3>
      ${D.notes.length ? D.notes.map(n => `<div class="fo-note">
        <div class="fo-note-tete">
          <input type="text" data-nt="${esc(n.id)}" value="${esc(n.titre)}" placeholder="Titre" aria-label="Titre de la note">
          <span class="meta">${esc(dateFr(n.date) || "")}</span>
          <button type="button" class="fo-x" data-nx="${esc(n.id)}" aria-label="Supprimer">×</button>
        </div>
        <textarea rows="4" data-nc="${esc(n.id)}" placeholder="Ta note…" aria-label="Contenu">${esc(n.texte)}</textarea>
      </div>`).join("") : `<p class="note">Aucune note. Écris ce qui t'aide : un déclic, une difficulté, une idée de repas.</p>`}
      <div class="actions"><button type="button" class="btn ghost" id="fo-note-add">+ Ajouter une note</button></div></div>`;
  },

  /* --- Mes objectifs --- */
  wObjectifs(D){
    const carte = o => `<div class="fo-obj-carte${o.fait ? " fo-fait" : ""}">
      <label class="fo-case"><input type="checkbox" data-of="${esc(o.id)}"${o.fait ? " checked" : ""}><span class="sr-only">Atteint</span></label>
      <div class="fo-obj-champs">
        <input type="text" data-ot="${esc(o.id)}" value="${esc(o.titre)}" placeholder="Mon objectif (spécifique)" aria-label="Objectif">
        <div class="fo-obj-bas">
          <input type="text" data-om="${esc(o.id)}" value="${esc(o.mesure)}" placeholder="Je le mesure avec…" aria-label="Mesure">
          <input type="date" data-oe="${esc(o.id)}" value="${esc(o.echeance)}" aria-label="Échéance">
        </div>
      </div>
      <button type="button" class="fo-x" data-ox="${esc(o.id)}" aria-label="Supprimer">×</button>
    </div>`;
    const encours = D.objectifs.filter(o => !o.fait), atteints = D.objectifs.filter(o => o.fait);
    return `<div class="fo-outil"><h3>Mes objectifs</h3>
      <p class="note" style="margin:0 0 12px">Un objectif par ligne, au format S.M.A.R.T : ce que tu veux, comment tu le mesures, pour quand.</p>
      <h4>Suivi des objectifs</h4>
      ${encours.length ? encours.map(carte).join("") : `<p class="note">Aucun objectif en cours.</p>`}
      <div class="actions"><button type="button" class="btn ghost" id="fo-obj-add">+ Ajouter un objectif</button></div>
      ${atteints.length ? `<h4>Atteints</h4>${atteints.map(carte).join("")}` : ""}
    </div>`;
  },

  /* --- Les challenges --- */
  wChallenges(D){
    let h = `<div class="fo-outil"><h3>Choisis ton challenge</h3>
      <p class="note" style="margin:0 0 12px">Un challenge par semaine, sur trois axes. Choisis-en un et tiens-le sept jours.</p>`;
    FORMATION.challenges.forEach(c => {
      const on = D.challenge === c.id;
      h += `<div class="fo-chal${on ? " fo-chal-on" : ""}">
        <button type="button" class="fo-chal-tete" data-chal="${esc(c.id)}" aria-pressed="${on}">
          <span>${esc(c.titre)}</span><span class="pastille">${on ? "Choisi" : "Choisir"}</span>
        </button>
        <div class="fo-chal-corps">${c.axes.map(a => `<div class="fo-axe">
          <b>${esc(a.nom)}</b>
          <p class="note" style="margin:2px 0 0"><i>Objectif :</i> ${esc(a.objectif)}</p>
          <p style="margin:4px 0 0">${esc(a.defi)}</p>
        </div>`).join("")}</div>
      </div>`;
    });
    const faits = FORMATION.defis.filter(d => D.defis[d[0]]).length;
    h += `<h4>10 défis sur une semaine <span class="pastille">${faits}/10</span></h4>
      <ul class="fo-liste fo-defis">${FORMATION.defis.map(d =>
        `<li><label class="fo-case"><input type="checkbox" data-defi="${esc(d[0])}"${D.defis[d[0]] ? " checked" : ""}>
          <span><b>${esc(d[1])}</b><br><span class="note">${esc(d[2])}</span></span></label></li>`).join("")}</ul></div>`;
    return h;
  },

  /* ================= montage ================= */
  html(){ return `<div id="fo-vue"><section class="panel"><div class="empty">Chargement…</div></section></div>`; },

  async init(){
    const self = this;
    const D = this.migrer(await Store.lire(this.cle, this.vide()));
    Store.cache[this.cle] = D;
    const zone = $("fo-vue");
    if (!zone) return;
    const sauver = () => Store.ecrire(self.cle, D);
    const visibles = outilsVisibles().map(o => o.id);
    const nouvelId = () => "x" + Date.now().toString(36) + Math.floor(Math.random() * 1000);

    const dessiner = () => {
      zone.innerHTML = self.vue(D, visibles);
      brancher();
    };

    function brancher(){
      /* videos : on ne charge le lecteur qu'au clic */
      $$(".video-vignette", zone).forEach(v => v.addEventListener("click", () => {
        const cadre = document.createElement("div");
        cadre.className = "video-cadre";
        cadre.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?rel=0&autoplay=1" title="Vidéo de la formation" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        v.parentNode.replaceChild(cadre, v);
      }));

      /* ouverture des modules et des lecons */
      $$("[data-mod]", zone).forEach(b => b.addEventListener("click", () => {
        D.ouvert = (D.ouvert === b.dataset.mod) ? "" : b.dataset.mod;
        sauver(); dessiner();
        const t = zone.querySelector('[data-mod="' + D.ouvert + '"]');
        if (t) t.scrollIntoView({ block:"start", behavior:"smooth" });
      }));
      $$("[data-lecon]", zone).forEach(b => b.addEventListener("click", () => {
        D.lecon = (D.lecon === b.dataset.lecon) ? "" : b.dataset.lecon;
        sauver(); dessiner();
      }));

      /* cases a cocher du parcours */
      $$("[data-coche]", zone).forEach(c => c.addEventListener("change", () => {
        D.coches[c.dataset.coche] = c.checked;
        if (!c.checked) delete D.coches[c.dataset.coche];
        sauver(); dessiner();
      }));

      /* --- diete --- */
      const selSem = $("fo-sem", zone);
      if (selSem) selSem.addEventListener("change", () => { D.semaine = +selSem.value; sauver(); dessiner(); });
      $$("[data-fj]", zone).forEach(b => b.addEventListener("click", () => { D.jour = +b.dataset.fj; sauver(); dessiner(); }));
      $$("[data-df]", zone).forEach(c => c.addEventListener("change", () => {
        self.ligneDiete(D)[+c.dataset.df].f = c.checked; sauver();
      }));
      const majTotaux = () => {
        const lignes = self.ligneDiete(D);
        let tp = 0, tg = 0, tl = 0;
        lignes.forEach((r, i) => {
          tp += +r.p || 0; tg += +r.g || 0; tl += +r.l || 0;
          const c = zone.querySelector('[data-kcal="' + i + '"]');
          if (c) c.textContent = self.kcal(r) || "";
        });
        const mettre = (id, v) => { const e = $(id, zone); if (e) e.textContent = v || ""; };
        mettre("fo-tp", tp); mettre("fo-tg", tg); mettre("fo-tl", tl);
        const k = $("fo-tk", zone); if (k) k.innerHTML = "<b>" + ((tp * 4 + tg * 4 + tl * 9) || "") + "</b>";
      };
      $$("[data-dm]", zone).forEach(e => e.addEventListener("input", () => {
        const p = e.dataset.dm.split(".");
        self.ligneDiete(D)[+p[0]][p[1]] = e.value;
        majTotaux(); sauver();
      }));

      /* --- priorites --- */
      const ajouter = cle => {
        const champ = zone.querySelector('[data-pa="' + cle + '"]');
        const t = (champ && champ.value || "").trim();
        if (!t) return;
        D.priorites[cle].push({ id: nouvelId(), texte: t, fait: false });
        sauver(); dessiner();
      };
      $$("[data-pb]", zone).forEach(b => b.addEventListener("click", () => ajouter(b.dataset.pb)));
      $$("[data-pa]", zone).forEach(e => e.addEventListener("keydown", ev => {
        if (ev.key === "Enter"){ ev.preventDefault(); ajouter(e.dataset.pa); }
      }));
      $$("[data-pf]", zone).forEach(c => c.addEventListener("change", () => {
        const p = c.dataset.pf.split("."), t = D.priorites[p[0]].find(x => x.id === p[1]);
        if (t) t.fait = c.checked;
        sauver(); dessiner();
      }));
      $$("[data-px]", zone).forEach(b => b.addEventListener("click", () => {
        const p = b.dataset.px.split(".");
        D.priorites[p[0]] = D.priorites[p[0]].filter(x => x.id !== p[1]);
        sauver(); dessiner();
      }));

      /* --- notes --- */
      const add = $("fo-note-add", zone);
      if (add) add.addEventListener("click", () => {
        D.notes.unshift({ id: nouvelId(), date: aujourdhui(), titre:"", texte:"" });
        sauver(); dessiner();
      });
      $$("[data-nt]", zone).forEach(e => e.addEventListener("input", () => {
        const n = D.notes.find(x => x.id === e.dataset.nt); if (n){ n.titre = e.value; sauver(); }
      }));
      $$("[data-nc]", zone).forEach(e => e.addEventListener("input", () => {
        const n = D.notes.find(x => x.id === e.dataset.nc); if (n){ n.texte = e.value; sauver(); }
      }));
      $$("[data-nx]", zone).forEach(b => b.addEventListener("click", () => {
        D.notes = D.notes.filter(x => x.id !== b.dataset.nx); sauver(); dessiner();
      }));

      /* --- objectifs --- */
      const addO = $("fo-obj-add", zone);
      if (addO) addO.addEventListener("click", () => {
        D.objectifs.push({ id: nouvelId(), titre:"", mesure:"", echeance:"", fait:false });
        sauver(); dessiner();
      });
      const champObj = (attr, prop) => $$("[data-" + attr + "]", zone).forEach(e => e.addEventListener("input", () => {
        const o = D.objectifs.find(x => x.id === e.dataset[attr]); if (o){ o[prop] = e.value; sauver(); }
      }));
      champObj("ot", "titre"); champObj("om", "mesure"); champObj("oe", "echeance");
      $$("[data-of]", zone).forEach(c => c.addEventListener("change", () => {
        const o = D.objectifs.find(x => x.id === c.dataset.of); if (o) o.fait = c.checked;
        sauver(); dessiner();
      }));
      $$("[data-ox]", zone).forEach(b => b.addEventListener("click", () => {
        D.objectifs = D.objectifs.filter(x => x.id !== b.dataset.ox); sauver(); dessiner();
      }));

      /* --- challenges --- */
      $$("[data-chal]", zone).forEach(b => b.addEventListener("click", () => {
        D.challenge = (D.challenge === b.dataset.chal) ? "" : b.dataset.chal;
        sauver(); dessiner();
      }));
      $$("[data-defi]", zone).forEach(c => c.addEventListener("change", () => {
        D.defis[c.dataset.defi] = c.checked;
        if (!c.checked) delete D.defis[c.dataset.defi];
        sauver(); dessiner();
      }));
    }

    dessiner();
  }
};


/* ------------------------------------------------------------------
   OUTIL — Les complements alimentaires
   Le coach coche ce que prend le client et fixe les doses ; le client
   lit sa liste. Les poudres proteinees comptent dans la journee : leur
   shaker devient une collation du plan alimentaire.
   ------------------------------------------------------------------ */
const outilComplements = {
  id: "complements",
  cle: "complements",
  nom: "Mes compléments",
  icone: "💊",
  titre: "Les compléments",
  accroche: "Ce que tu prends, à quelle dose et à quel moment. Rien d'obligatoire : un complément complète une alimentation, il ne la remplace pas.",

  vide(){ return { liste: [], note: "" }; },

  migrer(D){
    if (!D || typeof D !== "object") return this.vide();
    if (!Array.isArray(D.liste)) D.liste = [];
    if (typeof D.note !== "string") D.note = "";
    return D;
  },

  /* Le shaker d'une poudre proteinee, avec ses vraies macros a la dose
     choisie. Sert au plan alimentaire : sans ca, on ferait manger deux
     fois les memes proteines. */
  shaker(D){
    const p = (D.liste || []).find(x => x.proteine && +x.dose > 0 && x.par100);
    if (!p) return null;
    const k = (+p.dose || 0) / 100;
    return {
      nom: p.nom, dose: +p.dose, unite: p.unite || "g",
      kcal:      Math.round((p.par100.kcal || 0) * k),
      proteines: Math.round((p.par100.prot || 0) * k),
      glucides:  Math.round((p.par100.gluc || 0) * k),
      lipides:   Math.round((p.par100.lip  || 0) * k)
    };
  },

  ligne(c, i, edition){
    const macros = c.proteine && c.par100 ? (() => {
      const k = (+c.dose || 0) / 100;
      return `<span class="meta">${fmt((c.par100.kcal||0)*k)} kcal · ${fmt((c.par100.prot||0)*k)} g de protéines par dose</span>`;
    })() : "";
    if (!edition){
      return `<li class="compl-l">
        <div><b>${esc(c.nom)}</b> ${c.dose ? `<span class="pastille">${esc(String(c.dose))} ${esc(c.unite || "")}</span>` : ""}
          ${c.proteine ? `<span class="pastille compl-prot">compté dans tes repas</span>` : ""}</div>
        ${c.moment ? `<span class="meta">${esc(c.moment)}</span>` : ""}
        ${macros}
        ${c.note ? `<p class="note" style="margin:4px 0 0">${esc(c.note)}</p>` : ""}
      </li>`;
    }
    return `<li class="compl-l compl-edit">
      <div class="compl-champs">
        <div><label>Complément</label><input type="text" data-c="${i}" data-f="nom" value="${esc(c.nom)}"></div>
        <div><label>Dose</label><input type="number" min="0" step="0.5" data-c="${i}" data-f="dose" value="${esc(c.dose)}"></div>
        <div><label>Unité</label><input type="text" data-c="${i}" data-f="unite" value="${esc(c.unite)}" placeholder="g"></div>
        <div><button class="del" data-suppr-c="${i}" aria-label="Retirer">×</button></div>
        <div class="plein"><label>Quand</label><input type="text" data-c="${i}" data-f="moment" value="${esc(c.moment)}" placeholder="Le matin, pendant un repas"></div>
        <div class="plein"><label>Précision pour le client</label><input type="text" data-c="${i}" data-f="note" value="${esc(c.note)}" placeholder="Dans 250 ml d'eau, après la séance"></div>
      </div>
      ${c.proteine ? `<p class="note" style="margin:8px 0 0">${macros} — cette dose est comptée comme une collation dans son plan alimentaire.</p>` : ""}
    </li>`;
  },

  /* ---------- vue client ---------- */
  vueLecture(D){
    if (!D.liste.length){
      return `<section class="panel"><div class="empty">Ton coach ne t'a pas prescrit de complément. C'est une bonne nouvelle : rien ne remplace tes repas.</div></section>`;
    }
    return `<section class="panel">
      <h2>Ce que tu prends</h2>
      <ul class="compl">${D.liste.map((c, i) => this.ligne(c, i, false)).join("")}</ul>
      ${D.note ? `<div class="flag" style="margin-top:16px"><b>Mot de ton coach :</b> ${esc(D.note)}</div>` : ""}
      ${this.avertissement()}
    </section>`;
  },

  avertissement(){
    return `<p class="note" style="margin-top:18px">Un complément ne rattrape pas une alimentation qui ne va pas : commence toujours par tes repas.
      Si tu prends un traitement, si tu es enceinte ou si tu as une pathologie, demande à ton médecin avant d'en ajouter un —
      certains interagissent avec des médicaments. Ton coach n'est pas médecin.</p>`;
  },

  /* ---------- vue coach ---------- */
  vueEdition(D){
    const dejaPris = id => D.liste.some(c => c.ref === id);
    let h = `<section class="panel">
      <h2>Ajouter un complément</h2>
      <p class="note" style="margin:0 0 14px">Coche ce qu'il prend déjà, ou ce que tu lui conseilles. Les doses proposées sont des valeurs usuelles : ajuste-les.</p>
      <div class="chips">${CONFIG.nutrition.complements.map(c =>
        `<button type="button" class="chip" data-cat="${esc(c.id)}"${dejaPris(c.id) ? " disabled" : ""}>
          ${esc(c.nom)}${dejaPris(c.id) ? " ✓" : ""}
        </button>`).join("")}</div>
      <div class="actions"><button class="btn ghost" id="cp-libre">+ Un autre complément</button></div>
    </section>`;

    h += `<section class="panel">
      <h2>Sa liste</h2>
      ${D.liste.length
        ? `<ul class="compl">${D.liste.map((c, i) => this.ligne(c, i, true)).join("")}</ul>`
        : `<div class="empty">Rien pour l'instant. C'est très bien aussi : ne prescris que ce qui sert.</div>`}
      <div style="margin-top:18px"><label for="cp-note">Mot pour ton client</label>
        <textarea id="cp-note" rows="2" placeholder="Pourquoi ces compléments, et pendant combien de temps">${esc(D.note)}</textarea></div>
      ${this.avertissement()}
    </section>`;
    return h;
  },

  html(){ return `<div id="cp-vue"><section class="panel"><div class="empty">Chargement…</div></section></div>`; },

  async init(){
    const self = this;
    const edition = Auth.estCoach() && Store.idConsulte;
    const D = this.migrer(await Store.lire(this.cle, this.vide()));
    Store.cache[this.cle] = D;
    const zone = $("cp-vue");
    if (!zone) return;
    const sauver = () => Store.ecrire(self.cle, D);

    if (!edition){ zone.innerHTML = self.vueLecture(D); return; }

    const redessiner = () => { zone.innerHTML = self.vueEdition(D); brancher(); };

    function brancher(){
      $$("[data-cat]", zone).forEach(b => b.addEventListener("click", () => {
        const modele = CONFIG.nutrition.complements.find(c => c.id === b.dataset.cat);
        if (!modele) return;
        D.liste.push({
          ref: modele.id, nom: modele.nom, dose: modele.dose, unite: modele.unite,
          moment: modele.moment, note: "",
          proteine: !!modele.proteine, par100: modele.par100 || null
        });
        sauver(); redessiner();
      }));

      const libre = $("cp-libre");
      if (libre) libre.addEventListener("click", () => {
        D.liste.push({ ref:"", nom:"", dose:"", unite:"", moment:"", note:"", proteine:false, par100:null });
        sauver(); redessiner();
      });

      $$("[data-f]", zone).forEach(el => el.addEventListener("input", () => {
        const c = D.liste[+el.dataset.c];
        if (!c) return;
        c[el.dataset.f] = el.value;
        /* on rafraichit les macros affichees sans redessiner : redessiner
           ferait perdre le curseur a chaque chiffre tape */
        if (el.dataset.f === "dose" && c.proteine && c.par100){
          const boite = el.closest(".compl-l");
          const note = boite && boite.querySelector(".note");
          if (note){
            const k = (+c.dose || 0) / 100;
            note.textContent = fmt((c.par100.kcal||0)*k) + " kcal · " + fmt((c.par100.prot||0)*k) +
              " g de protéines par dose — cette dose est comptée comme une collation dans son plan alimentaire.";
          }
        }
        sauver();
      }));

      $$("[data-suppr-c]", zone).forEach(b => b.addEventListener("click", () => {
        D.liste.splice(+b.dataset.supprC, 1); sauver(); redessiner();
      }));

      const n = $("cp-note");
      if (n) n.addEventListener("input", () => { D.note = n.value; sauver(); });
    }

    redessiner();
  }
};

/* ------------------------------------------------------------------
   OUTIL — L'atelier de séances (coach)
   Fabriquer un programme sans etre dans la fiche de qui que ce soit,
   puis l'enregistrer dans la base pour le proposer a n'importe quel
   client. Reutilise l'editeur de outilProgramme : un seul editeur a
   maintenir, et les memes garanties sur les fiches et les videos.
   ------------------------------------------------------------------ */
const outilAtelier = {
  id: "atelier",
  cle: "atelier",
  role: "coach",
  principal_coach: true,
  nom: "Mes séances",
  icone: "🧱",
  titre: "L'atelier",
  accroche: "Construis un programme une fois, réutilise-le pour tous tes clients. Il rejoint tes « programmes prêts à l'emploi ».",

  vide(){
    return { nom:"", note:"", lieu:"", seances_semaine:3, niveau:"Debutant",
             objectif:"Prise de muscle", seances:[] };
  },

  html(){ return `<div id="at-vue"><section class="panel"><div class="empty">Chargement…</div></section></div>`; },

  async init(){
    const self = this;
    const PR = outilProgramme;

    /* l'editeur a besoin du catalogue d'exercices pour la liste deroulante */
    if (!PR.exos){
      try {
        PR.exos = (await Catalogue.exercices()).slice().sort((x, y) => x.nom.localeCompare(y.nom, "fr"));
        PR.idxExos = await Catalogue.indexExercices();
      } catch(e){ PR.exos = []; PR.idxExos = {}; }
    }
    let prets = [];
    try { prets = await Catalogue.programmes(); } catch(e){ prets = []; }

    /* Le brouillon est range sur le compte du coach : il le retrouve tel
       qu'il l'a laisse, meme apres avoir ouvert dix fiches clients. */
    const P = Object.assign(this.vide(), await Store.lire(this.cle, this.vide()));
    if (!Array.isArray(P.seances)) P.seances = [];
    Store.cache[this.cle] = P;

    const zone = $("at-vue");
    if (!zone) return;
    const sauver = () => Store.ecrire(self.cle, P);

    const redessiner = () => {
      zone.innerHTML = PR.vueEdition(P, "atelier");
      remplirCharger();
      PR.brancherEditeur(P, zone, sauver, redessiner);
      brancherAtelier();
    };

    const remplirCharger = () => {
      const sel = $("at-charger");
      if (!sel) return;
      sel.innerHTML = `<option value="">— repartir de zéro —</option>` +
        prets.map(x => `<option value="${esc(x.id)}">${esc(x.nom)}${x.lieu ? " · " + esc(x.lieu) : ""}</option>`).join("");
    };

    function lireEntete(){
      const v = id => { const e = $(id); return e ? e.value : ""; };
      P.nom = v("at-nom"); P.note = v("at-note");
      P.lieu = v("at-lieu"); P.niveau = v("at-niveau"); P.objectif = v("at-objectif");
      P.seances_semaine = +v("at-seances") || 3;
    }

    function brancherAtelier(){
      ["at-nom","at-note","at-lieu","at-niveau","at-objectif","at-seances"].forEach(id => {
        const e = $(id); if (e) e.addEventListener("input", () => { lireEntete(); sauver(); });
        if (e) e.addEventListener("change", () => { lireEntete(); sauver(); });
      });

      const ch = $("at-charger");
      if (ch) ch.addEventListener("change", async () => {
        const m = prets.find(x => x.id === ch.value);
        if (!m) return;
        if (P.seances.length && !(await UI.confirmer("Remplacer ce que tu as commencé par « " + m.nom + " » ?", { ok: "Oui, remplacer" }))) { ch.value = ""; return; }
        P.nom = m.nom; P.note = m.note || ""; P.lieu = m.lieu || "";
        P.niveau = m.niveau || "Debutant"; P.objectif = m.objectif || "Prise de muscle";
        P.seances_semaine = m.seances_semaine || 3;
        P.seances = JSON.parse(JSON.stringify(m.seances || []));
        sauver(); redessiner();
        flash("pg-msg", "« " + m.nom + " » chargé. Modifie-le, puis enregistre.");
      });

      const vider = $("at-vider");
      if (vider) vider.addEventListener("click", async () => {
        if (!(await UI.confirmer("Effacer ce brouillon et repartir de zéro ?", { ok: "Effacer", danger: true }))) return;
        Object.assign(P, self.vide());
        sauver(); redessiner();
      });

      const base = $("at-base");
      if (base) base.addEventListener("click", async () => {
        lireEntete();
        if (!P.nom.trim()){ flash("pg-msg", "Donne un nom à ce programme."); return; }
        if (!P.seances.length){ flash("pg-msg", "Il faut au moins une séance."); return; }
        const vides = P.seances.filter(sc => !(sc.exercices || []).some(e => (e.nom || "").trim()));
        if (vides.length){ flash("pg-msg", "Une séance n'a aucun exercice. Complète-la ou supprime-la."); return; }

        const id = Normaliser.aplatir(P.nom).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
        const existe = prets.some(x => x.id === id);
        if (existe && !(await UI.confirmer("Un programme du même nom existe déjà dans ta base. Le remplacer ?", { ok: "Oui, remplacer" }))) return;

        base.disabled = true; flash("pg-msg", "Enregistrement…");
        try {
          await Auth.appel("/rest/v1/programmes_types", {
            method: "POST",
            headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
            body: [{
              id: id, nom: P.nom.trim(), niveau: P.niveau, seances_semaine: P.seances_semaine,
              lieu: P.lieu || null, objectif: P.objectif, duree_semaines: null,
              note: P.note || null, seances: P.seances, maj_le: new Date().toISOString()
            }]
          });
          /* on rafraichit les caches : le programme doit apparaitre tout de
             suite dans « prets a l'emploi », sans rechargement de page */
          Catalogue._c["programmes_types"] = null;
          delete Catalogue._c["programmes_types"];
          prets = await Catalogue.programmes();
          outilProgramme.prets = prets;
          remplirCharger();
          flash("pg-msg", existe ? "Programme remplacé dans ta base." : "Programme ajouté à ta base. Tu le retrouves dans « prêts à l'emploi » sur la fiche de n'importe quel client.");
        } catch(e){
          flash("pg-msg", "Enregistrement impossible : " + (e.message || "erreur inconnue"));
        }
        base.disabled = false;
      });
    }

    redessiner();
  }
};

/* ------------------------------------------------------------------
   OUTIL — Accueil (v34). Le tableau de bord du client : en cinq secondes,
   ou il en est cette semaine, et quoi faire aujourd'hui. Il ne fait que
   LIRE (une seule requete) et reutilise Regularite, le journal, les repas
   coches, les mesures et les objectifs du mois tels qu'ils existent.
   Le coach le voit en consultant une fiche (« Vue d'ensemble »).
   ------------------------------------------------------------------ */
const outilAccueil = {
  id: "accueil",
  cle: null,
  nom: "Accueil",
  icone: "🏠",
  principal: true,
  client_seul: true,
  sans_entete: true,
  titre: "Accueil",
  accroche: "",

  html(){ return `<div id="acc-vue"><header class="masthead"><h1>Bonjour</h1></header><section class="panel"><div class="empty">Chargement…</div></section></div>`; },

  dateLongue(){
    const t = new Date().toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  },

  /* le poids : derniere mesure, et l'ecart avec la precedente (ou le depart) */
  poids(M){
    const l = (M.mesures || []).filter(m => m.poids != null && isFinite(m.poids)).slice().sort((a, b) => a.sem - b.sem);
    if (!l.length) return null;
    const der = l[l.length - 1];
    const ref = l.length > 1 ? l[l.length - 2].poids : (M.pstart != null && isFinite(M.pstart) ? M.pstart : null);
    return { actuel: der.poids, delta: ref == null ? null : der.poids - ref, sem: der.sem };
  },

  /* la prochaine seance a noter cette semaine */
  prochaineSeance(P, J, bornes){
    const seances = (P.seances || []).map((sc, si) => ({ sc, si })).filter(x => (x.sc.exercices || []).some(e => e.nom));
    if (!seances.length) return null;
    const faites = new Set((J.seances || []).filter(x => x.date >= bornes.debut && x.date <= bornes.fin).map(x => x.si));
    const reste = seances.filter(x => !faites.has(x.si));
    return { prochaine: reste.length ? reste[0] : null, faites: faites.size, total: seances.length };
  },

  /* ---------- ACCUEIL DU MODE GRATUIT (v40, phase 16) ----------
     Ce qui est ouvert (formation, profil), ce que l'accompagnement apporte, et
     l'appel decouverte. Aucun prix. */

        ${acces("formation", "Speed Formation", "Les bases, à ton rythme")}

      </div></section>

        <ul class="liste-debloque">
          <li>${esc(trad(AVANTAGES.programme))}</li><li>${esc(trad(AVANTAGES.nutrition))}</li>
          <li>${esc(trad(AVANTAGES.mensurations))}</li><li>${esc(trad(AVANTAGES.suivi))}</li>
        </ul>
        <div class="actions"><a class="btn" href="${esc(lienSur(CONFIG.marque.calendly))}" target="_blank" rel="noopener">${esc(trad("Réserver mon appel"))}</a></div>
        <p class="note" style="margin:10px 0 0">${esc(trad("Un appel de 30 minutes avec ton coach, pour faire le point sur tes objectifs."))}</p>
      </section>`;
  },

  /* ---------- FICHE CLIENT (v37, phase 18) ----------
     Ce que le coach voit en ouvrant un client : tout l'etat en une page,
     avec un lien vers l'editeur de chaque bloc. Lecture seule ici. Les
     notes privees et les feedbacks arrivent avec les phases 10 et 18. */
  async fiche(zone){
    const cles = ["intake", "programme", "journal", "repas", "repas_suivi", "mens", "objectifs_faits", "checkins", "complements", "calc", "formation", "hist_programme", "hist_repas", "prefs", "feedbacks"];

    const l = Clients.resumerUn(profil, d, dernier);
    const r = Regularite.calculer({ programme: P, journal: J, repas: R, repas_suivi: S, mens: M }, 0), prec = Regularite.calculer({ programme: P, journal: J, repas: R, repas_suivi: S, mens: M }, -1);
    const b = outilBilan.calculer({ programme: P, journal: J, repas: R, repas_suivi: S, mens: M, objectifs_faits: d.objectifs_faits || {} });
    const av = outilProgramme.avancement(P);
    const seances = (P.seances || []).filter(sc => (sc.exercices || []).some(e => e.nom));
    const derniereSeance = J.seances.length ? J.seances[J.seances.length - 1] : null;
    const e = Checkin.etat(CK);
    const dernierCk = (CK.liste || []).length ? CK.liste[CK.liste.length - 1] : null;
    const fbCk = dernierCk ? Feedback.repond(d.feedbacks, dernierCk) : null;
    const fbAvant = (dernierCk && !fbCk) ? Feedback.pour(d.feedbacks, dernierCk.semaine) : null;
    const obj = (P.objectifs && (P.objectifs.liste || []).some(Boolean)) ? P.objectifs : null;
    const cible = R.cible || null;
    const nbJours = (R.jours || []).filter(j => (j.repas || []).length).length;
    const nbCompl = ((d.complements || {}).liste || []).length;
    const histP = ((d.hist_programme || {}).liste || []).length, histR = ((d.hist_repas || {}).liste || []).length;
    const fo = d.formation ? outilFormation.compte(outilFormation.migrer(d.formation)) : null;
    const lien = (id, txt) => `<a class="link-a" href="#/${id}">${esc(txt)} →</a>`;
    const ligne = (k, v) => v == null || v === "" ? "" : `<li><span>${esc(k)}</span><b>${esc(String(v))}</b></li>`;
    const alertes = l.alertes;
    zone.innerHTML = `
      <header class="masthead">

  async init(){
    const zone = $("acc-vue"); if (!zone) return;
    const consult = !!Store.idConsulte;
    if (consult) return this.fiche(zone);
    if (Auth.estProspect()) return this.gratuit(zone);   // v40 : l'accueil du mode gratuit
    const d = await Store.lireTout(["intake", "programme", "journal", "repas", "repas_suivi", "mens", "objectifs_faits", "checkins", "feedbacks"]);
    const I = d.intake || {}, P = d.programme || {}, J = d.journal || { seances: [] }, R = d.repas || {}, S = d.repas_suivi || {}, M = d.mens || {}, OF = d.objectifs_faits || {}, CK = d.checkins || { liste: [] };
    const fbR = Feedback.recent(d.feedbacks);   // v38 : un feedback du coach de moins de 7 jours
    if (!Array.isArray(J.seances)) J.seances = [];
    const c = { programme: P, journal: J, repas: R, repas_suivi: S, mens: M };
    const r = Regularite.calculer(c, 0), prec = Regularite.calculer(c, -1);
    const p = r.parts;
    const objectif = I.objectif || "";
    const sens = /perte|s[èe]che/i.test(objectif) ? -1 : /prise|masse/i.test(objectif) ? 1 : 0;
    const pd = this.poids(M);
    const obj = (P.objectifs && (P.objectifs.liste || []).some(Boolean)) ? P.objectifs : null;
    const faits = (obj && OF.mois === obj.mois && Array.isArray(OF.faits)) ? OF.faits : [];
    const nbObj = obj ? obj.liste.filter(Boolean).length : 0, nbFaits = obj ? obj.liste.filter((t, i) => t && Regularite.statutObjectif(P, OF, i) === "atteint").length : 0;
    const aProgramme = (P.seances || []).some(sc => (sc.exercices || []).some(e => e.nom));
    const aDiete = (R.jours || []).some(j => (j.repas || []).length);
    const prenom = consult ? (Store.nomConsulte || "").split(" ")[0]
                 : ((Auth.profil && Auth.profil.prenom) || String(I.nom || "").split(" ")[0] || "");

    /* --- la phrase du haut --- */
    let resume;
    if (consult) resume = trad("Sa semaine en un coup d'œil.");
    else if (!aProgramme && !aDiete) resume = trad("Ton coach prépare ton programme et tes repas. En attendant, ta formation t'attend.");
    else {
      const bouts = [];
      if (p.seances) bouts.push(trad(p.seances.faites > 1 ? "{a} séances sur {b}" : "{a} séance sur {b}", { a: p.seances.faites, b: p.seances.cible }));
      if (p.repas) bouts.push(trad("{a} repas cochés sur {b}", { a: p.repas.coches, b: p.repas.prevus }));
      resume = bouts.length ? bouts.join(", ") + (r.score != null ? trad(" : régularité {n}/100 cette semaine.", { n: r.score }) : ".")
                            : trad("Une nouvelle semaine commence : à toi de jouer.");
    }

    /* --- les tuiles de la semaine --- */
    let tuiles = "";
    tuiles += `<div class="tile"><div class="t-lbl">Régularité</div><div class="t-val readout ${Regularite.niveau(r.score)}">${r.score == null ? "—" : r.score}<small>/100</small></div><div class="t-sub">${prec.score != null ? esc(trad("semaine dernière : {n}", { n: prec.score })) : esc(trad("remis à zéro chaque lundi"))}</div></div>`;
    if (pd){
      const bon = pd.delta == null || !sens ? "" : (pd.delta * sens > 0.05 ? "pos" : pd.delta * sens < -0.05 ? "neg" : "");
      const sub = pd.delta == null ? esc(trad("semaine {n}", { n: pd.sem })) : `<span class="${bon}">${pd.delta > 0 ? "+" : pd.delta < 0 ? "−" : ""}${n1(Math.abs(pd.delta))} kg</span> ${esc(trad("depuis la mesure d'avant"))}`;
      tuiles += `<div class="tile"><div class="t-lbl">Poids</div><div class="t-val readout">${n1(pd.actuel)}<small>kg</small></div><div class="t-sub">${sub}</div></div>`;
    } else if (aProgramme || aDiete){
      tuiles += `<div class="tile"><div class="t-lbl">Poids</div><div class="t-val readout">—</div><div class="t-sub">${esc(trad("aucune mesure"))}</div></div>`;
    }
    if (p.seances) tuiles += `<div class="tile"><div class="t-lbl">Entraînement</div><div class="t-val readout${p.seances.faites >= p.seances.cible ? " pos" : ""}">${p.seances.faites}<small>/ ${p.seances.cible}</small></div><div class="t-sub">${esc(trad("séances notées"))}</div></div>`;
    if (p.repas) tuiles += `<div class="tile"><div class="t-lbl">Nutrition</div><div class="t-val readout${p.repas.ratio >= 0.9 ? " pos" : ""}">${fmt(p.repas.coches)}<small>/ ${fmt(p.repas.prevus)}</small></div><div class="t-sub">${esc(trad("repas respectés"))}</div></div>`;
    if (obj) tuiles += `<div class="tile"><div class="t-lbl">Objectifs</div><div class="t-val readout${nbFaits === nbObj ? " pos" : ""}">${nbFaits}<small>/ ${nbObj}</small></div><div class="t-sub">${esc(trad("ce mois-ci"))}</div></div>`;

    /* --- aujourd'hui : quoi faire --- */
    const acces = [];
    const ps = this.prochaineSeance(P, J, r.bornes);
    if (ps){
      if (ps.prochaine) acces.push({ id: "programme", ico: ICONES.programme, t: trad("Noter ma séance"), s: ps.prochaine.sc.nom || trad("Séance {n}", { n: ps.prochaine.si + 1 }) });
      else acces.push({ id: "programme", ico: ICONES.programme, t: trad("Toutes tes séances de la semaine sont notées"), s: trad("Bravo. Revoir mon programme"), ok: true });
    }
    if (aDiete){
      const auj = aujourdhui(), prevus = Regularite.prevusLe(R, auj);
      const coches = Math.min(prevus, (S.hist && S.hist[auj] && S.hist[auj].c) || 0);
      acces.push({ id: "nutrition", ico: ICONES.nutrition, t: trad("Mes repas du jour"), s: trad("{a} sur {b} cochés aujourd'hui", { a: coches, b: prevus }), ok: prevus > 0 && coches >= prevus });
    }
    if (aProgramme || aDiete || (M.mesures || []).length){
      acces.push(p.mesure.faite
        ? { id: "mensurations", ico: ICONES.mensurations, t: trad("Mesure de la semaine faite"), s: trad("Voir ma progression"), ok: true }
        : { id: "mensurations", ico: ICONES.mensurations, t: trad("Ma mesure de la semaine"), s: trad("Poids et tours de taille, à jeun") });
    }
    if (!consult && !I.complet) acces.unshift({ id: "profil", ico: ICONES.profil, t: trad("Compléter mon profil"), s: trad("C'est ce qui permet à ton coach de construire ton suivi") });
    if (!consult && !aProgramme && !aDiete) acces.push({ id: "formation", ico: ICONES.formation, t: trad("Commencer la Speed Formation"), s: trad("Les bases, à ton rythme") });

    const ligne = a => `<a class="acces${a.ok ? " fait" : ""}" href="#/${a.id}"><span class="ico">${a.ico}</span><span class="txt"><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span><span class="fleche">›</span></a>`;

    zone.innerHTML = `
      <header class="masthead">
        <span class="eyebrow">${esc(this.dateLongue())}</span>
        <h1>${consult ? esc(trad("Vue d'ensemble")) + (prenom ? " — " + esc(prenom) : "") : esc(trad("Bonjour")) + (prenom ? " " + esc(prenom) : "")}</h1>
        <p class="lede">${esc(resume)}</p>
      </header>
      <section class="panel">
        <h2>${esc(trad("Cette semaine"))}</h2>
        <div class="tiles">${tuiles}</div>
        <p class="note" style="margin:12px 0 0">${esc(trad("La régularité mesure ce que tu fais — séances, repas, mesure — pas ce que dit la balance."))}</p>
      </section>
      ${(aProgramme || aDiete || fbR) ? `<section class="panel"><h2>${esc(trad("Bilan hebdomadaire"))}</h2><div class="acces-l">${fbR ? Feedback.accesHTML(fbR) : ""}${(aProgramme || aDiete) ? Checkin.statutHTML(CK, { lien: "#/suivi" }) : ""}</div></section>` : ""}
      ${acces.length ? `<section class="panel"><h2>${esc(trad("Aujourd'hui"))}</h2><div class="acces-l">${acces.map(ligne).join("")}</div></section>` : ""}
      ${obj ? `<section class="panel"><h2>${esc(trad("Tes objectifs du mois"))}</h2>
        ${obj.liste.map((t, i) => { if (!t) return ""; const st = Regularite.statutObjectif(P, OF, i); return `<div class="objectif${st === "atteint" ? " atteint" : ""}${st === "non_atteint" ? " rate" : ""}"><span class="num">0${i + 1}</span><span class="texte" data-notr>${esc(t)}</span><span class="pastille ${Regularite.classeStatut(st)}">${esc(Regularite.libelleStatut(st))}</span></div>`; }).join("")}
        <div class="actions"><a class="btn ghost petit" href="#/suivi">${esc(trad("Cocher mes objectifs"))}</a></div>
      </section>` : ""}
      <section class="panel">
        <h2>${esc(trad("Mon bilan"))}</h2>
        <p class="note" style="margin:0 0 12px">${esc(trad("Tes quatre dernières semaines : régularité, poids, ce qui a bougé et la progression de tes charges."))}</p>
        <div class="actions" style="margin-top:0"><a class="btn ghost petit" href="#/suivi">${esc(trad("Voir mon bilan du mois"))}</a></div>
      </section>`;
  }
};

/* ------------------------------------------------------------------
   BILAN HEBDOMADAIRE (v36) — le check-in du client.
   Les questions vivent dans CONFIG.bilan.questions. Les reponses sont
   rangees dans la cle « checkins » (au client), une entree par semaine,
   reperee par son lundi. Jamais bloquant : disponible, recommande, c'est
   tout. Le coach lit les bilans dans « Preparer le call » et « Son suivi » ;
   la phase 10 y accrochera son feedback.
   ------------------------------------------------------------------ */
const Checkin = {
  cle: "checkins",
  max: 60,
  vide(){ return { liste: [] }; },
  questions(){ return (CONFIG.bilan && CONFIG.bilan.questions) || []; },

  /* La semaine visee : des le jour d'ouverture (vendredi par defaut), la
     semaine en cours ; avant, la semaine passee, encore ouverte. */
  semaineVisee(){
    const jour = (new Date().getDay() + 6) % 7 + 1;
    const ouverture = (CONFIG.bilan && CONFIG.bilan.jour_ouverture) || 5;
    const b = Regularite.bornes(jour >= ouverture ? 0 : -1);
    return { debut: b.debut, fin: b.fin };
  },
  entree(C, debut){ return ((C && C.liste) || []).find(x => x.semaine === debut) || null; },
  etat(C){ const v = this.semaineVisee(); const e = this.entree(C, v.debut); return { semaine: v, entree: e, fait: !!e }; },
  periode(x){ return trad("Semaine du {a} au {b}", { a: dateFr(x.semaine), b: dateFr(x.fin || x.semaine) }); },

  champ(q, v){
    const val = v == null ? "" : v;
    if (q.type === "echelle5") return `<div class="seg echelle5" data-q="${esc(q.id)}" role="group" aria-label="${esc(q.label)}">${[1,2,3,4,5].map(n => `<button type="button" data-v="${n}" aria-pressed="${String(val) === String(n)}">${n}</button>`).join("")}</div>`;
    if (q.type === "nombre") return `<input type="number" min="0" max="30" step="1" inputmode="numeric" data-q="${esc(q.id)}" value="${esc(val)}">`;
    if (q.type === "select") return `<select data-q="${esc(q.id)}"><option value="">— choisis —</option>${(q.options || []).map(o => `<option value="${esc(o)}"${val === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    return `<textarea rows="2" data-q="${esc(q.id)}">${esc(val)}</textarea>`;
  },

  formulaire(C, entree){
    const r = (entree && entree.reponses) || {};
    return `<form class="checkin-form" data-checkin>
      ${this.questions().map(q => `<div class="checkin-q${q.type === "echelle5" ? " echelle" : ""}">
        <label>${esc(q.label)}</label>
        ${q.aide ? `<p class="note" style="margin:-2px 0 8px">${esc(q.aide)}</p>` : ""}
        ${this.champ(q, r[q.id])}
      </div>`).join("")}
      <div class="actions"><button type="submit" class="btn">${esc(entree ? trad("Mettre à jour mon bilan") : trad("Envoyer mon bilan"))}</button>${entree ? `<button type="button" class="btn ghost" data-checkin-annuler>${esc(trad("Annuler"))}</button>` : ""}<span class="msg" data-checkin-msg></span></div>
    </form>`;
  },

  lire(form){
    const rep = {};
    this.questions().forEach(q => {
      if (q.type === "echelle5"){ const b = form.querySelector(`[data-q="${q.id}"] [aria-pressed="true"]`); rep[q.id] = b ? +b.dataset.v : null; return; }
      const el = form.querySelector(`[data-q="${q.id}"]`); if (!el) return;
      rep[q.id] = q.type === "nombre" ? (el.value === "" ? null : num(el.value)) : el.value.trim();
    });
    return rep;
  },

  /* branche un formulaire deja rendu ; apres(entree) est appele une fois enregistre */
  brancher(zone, C, apres){
    const form = zone.querySelector("[data-checkin]"); if (!form) return;
    $$(".echelle5 button", form).forEach(b => b.addEventListener("click", () => {
      $$("button", b.parentNode).forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
    }));
    const annuler = form.querySelector("[data-checkin-annuler]");
    if (annuler) annuler.addEventListener("click", () => { if (typeof apres === "function") apres(null); });
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      const rep = this.lire(form);
      const echelles = this.questions().filter(q => q.type === "echelle5");
      const manque = echelles.filter(q => rep[q.id] == null);
      if (manque.length){ const m = form.querySelector("[data-checkin-msg]"); if (m){ m.textContent = trad("Il manque : {l}", { l: manque.map(q => q.label).join(", ") }); setTimeout(() => { m.textContent = ""; }, 3200); } return; }
      const v = this.semaineVisee();
      if (!Array.isArray(C.liste)) C.liste = [];
      C.liste = C.liste.filter(x => x.semaine !== v.debut);
      const entree = { semaine: v.debut, fin: v.fin, envoye_le: aujourdhui(), envoye_a: new Date().toISOString(), reponses: rep };
      C.liste.push(entree);
      C.liste.sort((a, b) => a.semaine < b.semaine ? -1 : 1);
      if (C.liste.length > this.max) C.liste = C.liste.slice(-this.max);
      Store.ecrire(this.cle, C);
      UI.toast(trad("Bilan envoyé. Ton coach le lira avant votre prochain échange."), "ok");
      if (typeof apres === "function") apres(entree);
    });
  },

  /* les reponses d'une entree, en lecture */
  reponsesHTML(x){
    const r = x.reponses || {};
    const echelles = this.questions().filter(q => q.type === "echelle5" && r[q.id] != null);
    const textes = this.questions().filter(q => q.type !== "echelle5" && r[q.id] != null && r[q.id] !== "");
    return `${echelles.length ? `<div class="checkin-echelles">${echelles.map(q => `<span class="pastille"><span data-notr>${esc(q.label)}</span> <b>${esc(r[q.id])}</b>/5</span>`).join("")}</div>` : ""}
      ${textes.map(q => `<p class="checkin-rep"><span class="lbl">${esc(q.label)}</span>${esc(String(r[q.id]))}</p>`).join("")}`;
  },

  /* le bloc « statut » : disponible / envoye, pour Mon suivi et l'accueil */
  statutHTML(C, opts){
    opts = opts || {};
    const e = this.etat(C);
    if (e.fait){
      return `<div class="acces fait${opts.lien ? "" : " statique"}"${opts.lien ? ` href="${opts.lien}"` : ""}><span class="ico">${ICONES.bilan}</span><span class="txt"><b>${esc(trad("Bilan de la semaine envoyé"))}</b><small>${esc(trad("le {d} — merci, ton coach le lit avant votre prochain échange", { d: dateFr(e.entree.envoye_le) }))}</small></span>${opts.lien ? `<span class="fleche">›</span>` : ""}</div>`;
    }
    return `<a class="acces attention" href="${opts.lien || "#/suivi"}"><span class="ico">${ICONES.bilan}</span><span class="txt"><b>${esc(trad("Ton bilan de la semaine est disponible"))}</b><small>${esc(trad("5 minutes, avant dimanche soir : c'est ce qui permet à ton coach d'ajuster"))}</small></span><span class="fleche">›</span></a>`;
  },

  /* l'historique, du plus recent au plus ancien */
  historiqueHTML(C, sauf){
    const l = ((C && C.liste) || []).filter(x => x.semaine !== sauf).slice().reverse();
    if (!l.length) return "";
    return `<h3 style="margin-top:20px">${esc(trad("Mes bilans précédents"))}</h3>` + l.map(x => `<details class="hist-entree"><summary><b>${esc(this.periode(x))}</b> <span class="hist-dates">${esc(trad("envoyé le {d}", { d: dateFr(x.envoye_le) }))}</span></summary>${this.reponsesHTML(x)}</details>`).join("");
  },

  /* Mon suivi : le panneau complet (client : formulaire ; coach : lecture) */
  monter(idZone, C){
    const z = $(idZone); if (!z) return;
    const consult = !!Store.idConsulte;
    const dessiner = (ouvert) => {
      const e = this.etat(C);
      let corps = "";
      if (consult){
        corps = e.fait ? `<p class="note" style="margin:0 0 10px">${esc(this.periode(e.entree))} · ${esc(trad("envoyé le {d}", { d: dateFr(e.entree.envoye_le) }))}</p>${this.reponsesHTML(e.entree)}`
                       : `<div class="empty">${esc(trad("Pas encore de bilan pour cette semaine."))}</div>`;
      } else if (ouvert || !e.fait){
        corps = `<p class="note" style="margin:0 0 14px">${esc(trad("Semaine du {a} au {b}", { a: dateFr(e.semaine.debut), b: dateFr(e.semaine.fin) }))} · ${esc(trad("Réponds simplement, avec tes mots. Rien n'est noté : ça sert à ajuster ton suivi."))}</p>` + this.formulaire(C, e.entree);
      } else {
        corps = this.statutHTML(C, {}) + `<div style="margin-top:12px">${this.reponsesHTML(e.entree)}</div><div class="actions"><button type="button" class="btn ghost petit" data-checkin-modifier>${esc(trad("Modifier mon bilan"))}</button></div>`;
      }
      z.innerHTML = `<section class="panel"><div class="seance-c-tete"><h2>${esc(trad("Bilan hebdomadaire"))}</h2>${e.fait ? `<span class="pastille ok">✓ ${esc(trad("envoyé"))}</span>` : `<span class="pastille attention">${esc(trad("disponible"))}</span>`}</div>
        ${corps}${this.historiqueHTML(C, e.entree ? e.entree.semaine : null)}</section>`;
      const mod = z.querySelector("[data-checkin-modifier]"); if (mod) mod.addEventListener("click", () => dessiner(true));
      this.brancher(z, C, () => dessiner(false));
    };
    dessiner(false);
  }
};

/* ------------------------------------------------------------------
   v38 — FEEDBACK DU COACH (phase 10) et NOTES PRIVEES (phase 18)
   Deux cles rangees chez le client mais ecrites par le coach seul :
   - feedbacks   = { liste: [{ semaine (lundi ISO), fin, date (ISO), texte, bilan? }] }
                   une entree par semaine de bilan ; « bilan » = date d'envoi du
                   bilan auquel ce feedback repond ; le client LIT cette cle ;
   - notes_coach = { texte, maj, avant? } : le client ne peut ni la lire ni
                   l'ecrire ; « avant » = la version trouvee a l'ouverture.
   C'est la base qui le garantit (policies RLS du 25/09/2026), pas l'ecran.
   Elles ne passent pas par Store.ecrire : on relit la ligne juste avant
   d'ecrire (rien d'autre n'est ecrase, et rien n'est ecrit si elle a change
   depuis l'affichage) et on n'annonce « enregistre » que si la base renvoie
   la ligne. Un refus est dit clairement, et le texte tape reste dans le champ.
   ------------------------------------------------------------------ */
const CleCoach = {
  /* une session qu'on ne peut plus renouveler n'est pas « aucune donnee » :
     on s'arrete net plutot que de lire sans jeton */
  async session(){ if (!(await Auth.assurer())) throw Object.assign(new Error("session"), { statut: 401 }); },
  /* la ligne telle qu'en base : { contenu, maj_le }, ou null */
  async ligne(uid, cle){
    await this.session();
    const r = await Auth.appel("/rest/v1/donnees?user_id=eq." + uid + "&outil=eq." + encodeURIComponent(cle) + "&select=contenu,maj_le");
    return (r && r[0]) || null;
  },
  async lire(uid, cle){ const l = await this.ligne(uid, cle); return (l && l.contenu) || null; },
  /* ecriture CONDITIONNELLE : seulement si la ligne n'a pas bouge depuis la
     lecture (meme maj_le), ou si elle n'existe toujours pas. Sinon rien n'est
     ecrit et l'erreur porte « conflit ». Renvoie la ligne enregistree. */
  async ecrireSi(uid, cle, contenu, lue){
    await this.session();
    const maj = new Date().toISOString();
    const conflit = () => Object.assign(new Error("conflit"), { conflit: true });
    const refus = () => Object.assign(new Error("refus"), { statut: 403 });
    let r;
    if (lue){
      const filtre = lue.maj_le ? "&maj_le=eq." + encodeURIComponent(lue.maj_le) : "&maj_le=is.null";
      r = await Auth.appel("/rest/v1/donnees?user_id=eq." + uid + "&outil=eq." + encodeURIComponent(cle) + filtre, {
        method: "PATCH", headers: { "Prefer": "return=representation" }, body: { contenu: contenu, maj_le: maj }
      });
      if (!Array.isArray(r) || !r[0]){
        /* aucune ligne touchee : elle a bouge (conflit)… ou la base nous l'interdit */
        const l = await this.ligne(uid, cle);
        if (l && l.maj_le === lue.maj_le) throw refus();
        throw conflit();
      }
    } else {
      try {
        r = await Auth.appel("/rest/v1/donnees", {
          method: "POST", headers: { "Prefer": "return=representation" },
          body: [{ user_id: uid, outil: cle, contenu: contenu, maj_le: maj }]
        });
      } catch(e){
        /* 409 : la ligne existe deja (conflit)… ou le compte n'existe plus */
        if (e && e.statut === 409){ const l = await this.ligne(uid, cle); throw l ? conflit() : refus(); }
        throw e;
      }
      if (!Array.isArray(r) || !r[0]) throw refus();
    }
    return r[0];
  },
  message(e){
    if (e && (e.statut === 403 || e.statut === 409)) return "Non enregistré : la base refuse cette écriture. Ton texte est gardé.";
    if (e && e.statut === 401) return "Non enregistré : ta session a expiré. Reconnecte-toi, ton texte est gardé ici.";
    return "Non enregistré : la connexion a échoué. Ton texte est gardé, réessaie.";
  }
};

const Feedback = {
  cle: "feedbacks",
  max: 60,
  file: Promise.resolve(),   // les envois partent l'un apres l'autre
  liste(F){ return ((F && F.liste) || []).filter(x => x && x.semaine && x.texte); },
  pour(F, semaine){ return this.liste(F).find(x => x.semaine === semaine) || null; },
  /* le feedback qui REPOND a ce bilan : ecrit sous ce bilan-la, pour cette
     date d'envoi. Un mot ecrit avant que le bilan arrive (ou avant qu'il soit
     renvoye) ne compte pas : le bilan reste « a lire ». */
  repond(F, x){
    const f = x ? this.pour(F, x.semaine) : null, envoi = x ? this.envoi(x) : "";
    return (f && f.bilan && envoi && f.bilan === envoi) ? f : null;
  },
  /* l'instant d'envoi du bilan (envoye_a, depuis la v38) ; sinon son jour */
  envoi(x){ return (x && (x.envoye_a || x.envoye_le)) || ""; },
  /* du plus recent au plus ancien : la semaine, puis la date d'ecriture */
  tries(F){ return this.liste(F).slice().sort((a, b) => a.semaine !== b.semaine ? (a.semaine < b.semaine ? 1 : -1) : (String(a.date) < String(b.date) ? 1 : -1)); },
  /* le dernier ecrit ou mis a jour, s'il date de moins de 7 jours */
  recent(F){
    const d = new Date(); d.setDate(d.getDate() - 7);
    const il7 = Regularite.iso(d);
    const l = this.liste(F).filter(x => x.date && x.date >= il7).sort((a, b) => String(a.date) < String(b.date) ? 1 : -1);
    return l[0] || null;
  },
  finDe(semaine){ const d = new Date(semaine + "T12:00:00"); d.setDate(d.getDate() + 6); return Regularite.iso(d); },
  empreinte(x){ return x ? JSON.stringify([x.date || "", x.texte || "", x.bilan || ""]) : ""; },

  /* texte vide = retirer le feedback de cette semaine. La base est relue juste
     avant : les autres semaines sont reprises telles quelles, et si celle-ci a
     change depuis l'affichage (autre onglet, autre appareil), rien n'est ecrit.
     Renvoie l'entree enregistree (null si retiree). */
  async enregistrer(uid, semaine, fin, texte, bilan, base, dejas){
    const t = String(texte || "").trim();
    const meme = (x, y) => !!(x && y && x.texte === y.texte && (x.bilan || "") === (y.bilan || ""));
    for (let essai = 1; ; essai++){
      const lue = await CleCoach.ligne(uid, this.cle);
      const actuel = lue && lue.contenu;
      const brute = (actuel && Array.isArray(actuel.liste)) ? actuel.liste : [];
      const cour = brute.find(x => x && x.semaine === semaine && x.texte) || null;
      /* deja comme on le veut (une tentative precedente est passee, sa reponse s'est perdue) */
      if (t ? meme(cour, { texte: t, bilan: bilan }) : !cour) return cour;
      /* l'entree a change depuis l'affichage, et ce n'est pas notre propre tentative : conflit */
      if (this.empreinte(cour) !== this.empreinte(base) && !(dejas || []).some(x => meme(cour, x))) throw Object.assign(new Error("conflit"), { conflit: true });
      const l = brute.filter(x => !(x && x.semaine === semaine));
      let entree = null;
      if (t){
        entree = { semaine: semaine, fin: fin || this.finDe(semaine), date: aujourdhui(), texte: t };
        if (bilan) entree.bilan = bilan;
        l.push(entree);
      }
      l.sort((a, b) => String(a && a.semaine) < String(b && b.semaine) ? -1 : 1);
      try {
        await CleCoach.ecrireSi(uid, this.cle, { liste: l.slice(-this.max) }, lue);
        return entree;
      } catch(e){
        /* une autre semaine a ete ecrite entre la lecture et l'ecriture (autre
           onglet, autre appareil) : on relit et on recommence, deux fois au plus */
        if (!(e && e.conflit) || essai >= 3) throw e;
      }
    }
  },

  /* ----- cote client (et coach dans « Son suivi ») : lecture ----- */
  periode(x){ return Checkin.periode({ semaine: x.semaine, fin: x.fin || this.finDe(x.semaine) }); },
  panneauHTML(F){
    const l = this.tries(F);
    if (!l.length) return "";
    const d = l[0], reste = l.slice(1);
    return `<section class="panel fb-panneau"><div class="seance-c-tete"><h2>${esc(trad("Feedback de ton coach"))}</h2>${this.recent(F) ? `<span class="pastille accent">${esc(trad("nouveau"))}</span>` : ""}</div>
      <div class="fb-entree"><div class="fb-tete"><b>${esc(this.periode(d))}</b> <span class="hist-dates">${esc(trad("écrit le {d}", { d: dateFr(d.date) }))}</span></div><p class="fb-texte" data-notr>${esc(d.texte)}</p></div>
      ${reste.length ? `<h3 style="margin-top:20px">${esc(trad("Feedbacks précédents"))}</h3>` + reste.map(x => `<details class="hist-entree"><summary><b>${esc(this.periode(x))}</b> <span class="hist-dates">${esc(trad("écrit le {d}", { d: dateFr(x.date) }))}</span></summary><p class="fb-texte" data-notr>${esc(x.texte)}</p></details>`).join("") : ""}
    </section>`;
  },
  /* la carte de l'accueil, pour un feedback de moins de 7 jours */
  accesHTML(x){
    return `<a class="acces" href="#/suivi"><span class="ico">${ICONES.suivi || ICONES.bilan}</span><span class="txt"><b>${esc(trad("Ton feedback est disponible"))}</b><small>${esc(trad("Ton coach a répondu : {p}", { p: this.periode(x) }))}</small></span><span class="fleche">›</span></a>`;
  },

  /* ----- cote coach (« Préparer le call ») : ecriture -----
     bilan = l'entree de bilan hebdo sous laquelle s'affiche l'editeur (null pour
     une semaine sans bilan) ; ferme = feedbacks illisibles : on ne propose pas
     d'ecrire par-dessus ce qu'on n'a pas pu lire. */
  editeurHTML(semaine, fin, F, bilan, ferme){
    const f = this.pour(F, semaine);
    const avantBilan = !!(f && bilan && !(f.bilan && f.bilan === this.envoi(bilan)));
    const etat = !f ? "— pas encore envoyé" : avantBilan ? "— écrit le " + dateFr(f.date) + ", avant ce bilan : relis-le et renvoie-le" : "— envoyé le " + dateFr(f.date);
    return `<div class="fb-editeur" data-fb-semaine="${esc(semaine)}" data-fb-fin="${esc(fin || "")}" data-fb-bilan="${esc(bilan ? this.envoi(bilan) : "")}">
      <label>Ton feedback pour cette semaine <span class="fb-etat">${esc(etat)}</span></label>
      <textarea rows="3"${ferme ? " disabled" : ""} placeholder="Ce qui va bien, ce qu'on ajuste, l'objectif de la semaine qui vient…">${esc(f ? f.texte : "")}</textarea>
      <div class="actions"><button type="button" class="btn petit" data-fb-enregistrer${ferme ? " disabled" : ""}>${f ? "Mettre à jour le feedback" : "Envoyer le feedback"}</button><span class="msg" data-fb-msg></span></div>
    </div>`;
  },
  brancher(zone, uid, F){
    $$("[data-fb-semaine]", zone).forEach(bloc => {
      const btn = bloc.querySelector("[data-fb-enregistrer]"), ta = bloc.querySelector("textarea");
      const msg = bloc.querySelector("[data-fb-msg]"), etat = bloc.querySelector(".fb-etat");
      let base = this.pour(F, bloc.dataset.fbSemaine);   // ce que l'editeur a affiche
      let dejas = [];   // les tentatives sans reponse depuis le dernier succes (elles ont pu passer)
      btn.addEventListener("click", async () => {
        const texte = ta.value;
        msg.classList.remove("ko"); msg.textContent = "";
        if (!texte.trim()){
          if (!base){ msg.textContent = "Écris d'abord ton feedback."; return; }
          if (!(await UI.confirmer("Retirer le feedback de cette semaine ? Ton client ne le verra plus.", { titre: "Retirer le feedback", ok: "Oui, retirer", danger: true }))) return;
        }
        btn.disabled = true; msg.textContent = "Enregistrement…";
        const tentative = { texte: texte.trim(), bilan: bloc.dataset.fbBilan || "" };
        const tache = this.file.then(() => this.enregistrer(uid, bloc.dataset.fbSemaine, bloc.dataset.fbFin, texte, bloc.dataset.fbBilan, base, dejas));
        this.file = tache.catch(() => {});
        try {
          const entree = await tache;
          base = entree; dejas = [];
          etat.textContent = entree ? "— envoyé le " + dateFr(entree.date) : "— pas encore envoyé";
          btn.textContent = entree ? "Mettre à jour le feedback" : "Envoyer le feedback";
          msg.textContent = entree ? "Feedback enregistré : ton client le voit dans « Mon suivi »." : "Feedback retiré.";
        } catch(e){
          if (!(e && e.conflit) && tentative.texte) dejas.push(tentative);
          msg.classList.add("ko");
          msg.textContent = (e && e.conflit) ? "Ce feedback a changé entre-temps (autre onglet ou appareil) : recharge la page avant d'écrire. Ton texte est gardé ici." : CleCoach.message(e);
        }
        btn.disabled = false;
      });
    });
  }
};

/* Notes privees du coach, dans la fiche : enregistrees toutes seules une
   seconde apres la derniere frappe (et tout de suite en quittant la fiche).
   Si la lecture echoue, le champ reste ferme. Chaque ecriture est
   conditionnelle : si les notes ont change ailleurs, rien n'est ecrase et les
   deux versions sont gardees. */
const NotesCoach = {
  cle: "notes_coach",
  html(){
    return `<section class="panel notes-coach"><div class="seance-c-tete"><h2>Notes privées</h2><span class="pastille">jamais visibles par le client</span></div>
      <textarea id="nc-texte" rows="5" disabled placeholder="Contexte, points à suivre, ce qui s'est dit en call… Ton client ne voit jamais ces notes."></textarea>
      <p class="note" style="margin:8px 0 0" id="nc-etat">Chargement…</p></section>`;
  },
  /* renvoie la fonction a appeler en quittant la fiche */
  monter(uid){
    const ta = $("nc-texte"), etat = $("nc-etat");
    if (!ta || !etat || !uid) return () => {};
    let minuterie = null, enCours = false, encore = false, lu = false, bloque = false;
    let dernier = "", ligneLue = null, avant = null;
    let envois = [];   // « maj » des ecritures dont la reponse n'est pas revenue (elles ont pu passer)
    const quand = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
    const dire = (t, ko) => { etat.classList.toggle("ko", !!ko); etat.textContent = t; };
    /* ecrit le texte du champ, par ecriture conditionnelle. Sur un conflit : si
       c'etait notre propre ecriture (reponse perdue), on la reprend ; si les
       notes ont vraiment change ailleurs, on garde LES DEUX versions (la notre
       a la suite, datee) : aucune frappe n'est jamais jetee. */
    const envoyer = async () => {
      let fusion = false;
      for (let essai = 1; essai <= 3; essai++){
        const texte = ta.value;
        const contenu = { texte: texte, maj: new Date().toISOString() };
        if (avant) contenu.avant = avant;
        envois.push(contenu.maj);
        try {
          const r = await CleCoach.ecrireSi(uid, this.cle, contenu, ligneLue);
          ligneLue = { maj_le: r.maj_le }; dernier = texte; envois = [];
          dire((fusion ? "Ces notes avaient changé ailleurs : les deux versions sont gardées, la tienne à la suite. " : "") + "Enregistré · " + quand(contenu.maj));
          return;
        } catch(e){ if (!(e && e.conflit)) throw e; }
        const l = await CleCoach.ligne(uid, this.cle);
        const c = (l && l.contenu) || {};
        const distant = typeof c.texte === "string" ? c.texte : "";
        ligneLue = l ? { maj_le: l.maj_le } : null;
        if (c.maj && envois.indexOf(c.maj) > -1){
          /* notre propre ecriture etait passee : on repart d'elle */
          dernier = distant; envois = [];
          if (ta.value === dernier){ dire("Enregistré · " + quand(c.maj)); return; }
          continue;
        }
        const local = ta.value;
        const ajout = (local.indexOf(dernier) === 0 ? local.slice(dernier.length) : local).trim();
        dernier = distant; fusion = true;
        ta.value = ajout ? distant + (distant ? "\n\n" : "") + "— ajouté depuis un autre onglet ou appareil, le " + quand(new Date().toISOString()) + " —\n" + ajout : distant;
        if (ta.value === dernier){ dire("Ces notes avaient changé ailleurs : la dernière version est affichée."); return; }
      }
      bloque = true; ta.readOnly = true;
      dire("Tes notes changent ailleurs en même temps : copie ton texte ci-dessus, puis rouvre la fiche.", true);
    };
    const sauver = async () => {
      minuterie = null;
      if (!lu || bloque) return;
      if (enCours){ encore = true; return; }
      if (ta.value === dernier) return;
      enCours = true; dire("Enregistrement…");
      try { await envoyer(); } catch(e){ dire(CleCoach.message(e), true); }
      enCours = false;
      if (encore && !bloque){ encore = false; sauver(); }
    };
    /* en quittant la fiche (ou le champ) : ce qui attend part tout de suite,
       y compris un texte dont le dernier enregistrement a echoue */
    const maintenant = () => { if (minuterie || (lu && !bloque && ta.value !== dernier)){ clearTimeout(minuterie); sauver(); } };
    CleCoach.ligne(uid, this.cle).then(l => {
      const c = l && l.contenu;
      lu = true; ligneLue = l ? { maj_le: l.maj_le } : null;
      dernier = (c && typeof c.texte === "string") ? c.texte : "";
      /* la version trouvee a l'ouverture est gardee a cote : un effacement
         par erreur pendant cette seance se rattrape */
      avant = dernier ? { texte: dernier, maj: (c && c.maj) || null } : ((c && c.avant) || null);
      ta.value = dernier; ta.disabled = false;
      dire((c && c.maj) ? "Dernière modification : " + quand(c.maj) : "Enregistrement automatique.");
    }).catch(() => dire("Tes notes n'ont pas pu être lues : rouvre la fiche pour réessayer. Rien n'a été modifié.", true));
    ta.addEventListener("input", () => { if (bloque) return; clearTimeout(minuterie); dire("Modifié…"); minuterie = setTimeout(sauver, 1000); });
    ta.addEventListener("blur", maintenant);
    return maintenant;
  }
};

/* ------------------------------------------------------------------
   OUTIL — Mon suivi (v35). « Comment se passe mon accompagnement ? » :
   la regularite et son evolution, les objectifs du mois (a cocher), et le
   bilan des quatre dernieres semaines. Il reutilise Regularite.monterClient
   et outilBilan tels quels ; les phases 9 et 10 y ajouteront le bilan
   hebdomadaire et le feedback du coach. Le coach le voit en fiche client.
   ------------------------------------------------------------------ */
const outilSuivi = {
  id: "suivi",
  cle: null,
  nom: "Mon suivi",
  icone: "📊",
  titre: "Ton suivi",
  accroche: "Comment se passe ton accompagnement : ta régularité, tes objectifs du mois et ton bilan des quatre dernières semaines.",

  html(){ return `<div id="suivi-fb-haut"></div><div id="suivi-checkin"></div><div id="suivi-fb-bas"></div><div id="suivi-reg"><section class="panel"><div class="empty">Chargement…</div></section></div><div id="suivi-bilan"></div>`; },

  async init(){
    const d = await Store.lireTout(["programme", "journal", "repas", "repas_suivi", "mens", "objectifs_faits", "intake", "checkins", "feedbacks"]);
    const P = d.programme || {}, J = d.journal || { seances: [] };
    if (!Array.isArray(J.seances)) J.seances = [];
    /* le bilan hebdo : la cle est lue ici, mais on la re-lit par Store.lire
       pour que l'ecriture soit autorisee (drapeau de lecture) */
    const C = await Store.lire(Checkin.cle, Checkin.vide());
    if (!Array.isArray(C.liste)) C.liste = [];
    Checkin.monter("suivi-checkin", C);
    /* v38 — le feedback du coach : en tete s'il date de la semaine, sinon sous le bilan */
    const fb = Feedback.panneauHTML(d.feedbacks);
    const zf = $(Feedback.recent(d.feedbacks) ? "suivi-fb-haut" : "suivi-fb-bas");
    if (zf && fb) zf.innerHTML = fb;
    await Regularite.monterClient("suivi-reg", P, J, d);
    const zb = $("suivi-bilan"); if (!zb) return;
    const b = outilBilan.calculer({ programme: P, journal: J, repas: d.repas || {}, repas_suivi: d.repas_suivi || {}, mens: d.mens || {}, objectifs_faits: d.objectifs_faits || {} });
    zb.innerHTML = `<div class="suivi-sep"><h2 style="margin:0">${esc(trad("Ton bilan du mois"))}</h2><p class="note" style="margin:4px 0 0">${esc(outilBilan.accroche)}</p></div>` + outilBilan.vue(b, false, (d.intake && d.intake.objectif) || "");
