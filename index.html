  html(){
    return `<div id="prog-vue"><section class="panel"><div class="empty">Chargement…</div></section></div>`;
  },

  async init(){
    const self = this;
    const edition = Auth.estCoach() && Store.idConsulte;
    const P = await Store.lire(this.cle, { nom:"", note:"", seances:[], maj:"" });
    Store.cache[this.cle] = P;
    const zone = $("prog-vue");
    if (!zone) return;

    const sauver = () => Store.ecrire(self.cle, P);

    if (!edition){ zone.innerHTML = self.vueLecture(P); return; }

    const redessiner = () => { zone.innerHTML = self.vueEdition(P); brancher(); };

    const brancher = () => {
      $$("[data-f]", zone).forEach(el => {
        el.addEventListener("input", () => {
          const si = +el.dataset.s, f = el.dataset.f;
          if (el.dataset.e === undefined) P.seances[si][f] = el.value;
          else P.seances[si].exercices[+el.dataset.e][f] = el.value;
          sauver();
        });
      });
      const n = $("pg-nom"), no = $("pg-note");
      if (n)  n.addEventListener("input", () => { P.nom = n.value; sauver(); });
      if (no) no.addEventListener("input", () => { P.note = no.value; sauver(); });

      $$("[data-ajout-e]", zone).forEach(b => b.addEventListener("click", () => {
        P.seances[+b.dataset.ajoutE].exercices.push(self.exoVide()); sauver(); redessiner();
      }));
      $$("[data-suppr-e]", zone).forEach(b => b.addEventListener("click", () => {
        const [si, ei] = b.dataset.supprE.split(":").map(Number);
        P.seances[si].exercices.splice(ei, 1); sauver(); redessiner();
      }));
      $$("[data-suppr-s]", zone).forEach(b => b.addEventListener("click", () => {
        P.seances.splice(+b.dataset.supprS, 1); sauver(); redessiner();
      }));
      const as = $("pg-ajout-s");
      if (as) as.addEventListener("click", () => { P.seances.push(self.seanceVide(P.seances.length + 1)); sauver(); redessiner(); });

      const save = $("pg-save");
      if (save) save.addEventListener("click", () => {
        /* Un programme vide envoye, c'est un client qui ouvre son onglet
           et n'y trouve rien — sans savoir si c'est un bug ou un oubli. */
        const exos = (P.seances || []).reduce((n, sc) => n + (sc.exercices || []).filter(e => e.nom).length, 0);
        if (!exos){ flash("pg-msg", "Ce programme est vide : ajoute au moins une séance avec un exercice avant de l'envoyer."); return; }
        P.maj = new Date().toLocaleDateString("fr-FR");
        Store.ecrire(self.cle, P);
        flash("pg-msg", "Programme envoyé. Ton client le voit dès sa prochaine ouverture.");
      });

      const bs = $("pg-biblio-save");
      if (bs) bs.addEventListener("click", async () => {
        const nom = prompt("Sous quel nom l'enregistrer dans ta bibliothèque ?", P.nom || "Entraînement");
        if (!nom) return;
        try {
          await Auth.appel("/rest/v1/bibliotheque", {
            method: "POST",
            headers: { "Prefer": "return=minimal" },
            body: [{ coach_id: Auth.utilisateur().id, nom, note: P.note || "", contenu: { type:"entrainement", seances: P.seances } }]
          });
          flash("pg-msg", "Enregistré dans ta bibliothèque.");
          chargerBiblio();
        } catch(e){ flash("pg-msg", "Enregistrement impossible."); }
      });

      chargerBiblio();
      chargerPrets();
    };

    /* Catalogue partage : les programmes tout faits (table programmes_types) */
    const chargerPrets = async () => {
      const sel = $("pg-prets"); if (!sel) return;
      const l = await Catalogue.programmes();
      if (!l.length){ sel.innerHTML = `<option value="">— aucun programme dans le catalogue —</option>`; return; }
      sel.innerHTML = `<option value="">— choisis un programme du catalogue —</option>` +
        l.map(x => `<option value="${esc(x.id)}">${esc(x.nom)}${x.seances_semaine ? " · " + x.seances_semaine + " séances" : ""}${x.niveau ? " · " + esc(x.niveau) : ""}</option>`).join("");
      sel.onchange = () => {
        if (!sel.value) return;
        const x = l.find(y => String(y.id) === sel.value);
        if (!x) return;
        if (!confirm("Charger « " + x.nom + " » ? Il remplacera les séances actuelles de ce client.")){ sel.value = ""; return; }
        P.seances = JSON.parse(JSON.stringify(x.seances || []));
        if (!P.nom) P.nom = x.nom;
        if (!P.note && x.note) P.note = x.note;
        sauver(); redessiner();
      };
    };

    const chargerBiblio = async () => {
      const sel = $("pg-biblio"); if (!sel) return;
      try {
        const tout = await Auth.appel("/rest/v1/bibliotheque?select=id,nom,contenu&order=cree_le.desc");
        const l = (tout || []).filter(x => !x.contenu || x.contenu.type !== "repas");
        sel.innerHTML = `<option value="">— choisis un entraînement —</option>` +
          l.map(x => `<option value="${x.id}">${esc(x.nom)}</option>`).join("");
        sel.onchange = async () => {
          if (!sel.value) return;
          if (!confirm("Charger cet entraînement ? Il remplacera les séances actuelles de ce client.")) { sel.value = ""; return; }
          const r = await Auth.appel("/rest/v1/bibliotheque?id=eq." + sel.value + "&select=contenu,nom,note");
          if (r && r[0]){
            P.seances = JSON.parse(JSON.stringify(r[0].contenu.seances || []));
            if (!P.nom) P.nom = r[0].nom;
            sauver(); redessiner();
          }
        };
      } catch(e){}
    };

    redessiner();
  }
};

/* ------------------------------------------------------------------
   OUTIL — Nutrition : la journee type
   Le coach la genere depuis la fiche du client, la relit, l'envoie.
   Le client la consulte. Les aliments et recettes viennent du
   catalogue Supabase (Catalogue.aliments / Catalogue.recettes).
   ------------------------------------------------------------------ */
const outilNutrition = {
  id: "nutrition",
  cle: "repas",
  nom: "Mes repas",
  icone: "🥗",
  titre: "La journée type",
  accroche: "Des repas construits sur tes calories et tes macros, avec des aliments qu'on trouve en France — et qui respectent ton régime et tes allergies.",

  vide(){ return { nom:"", note:"", cible:null, regime:"", allergenes:[], repas:[], manquants:[], jours_courses:7, maj:"" }; },

  /* ================= filtrage : le point sensible ================= */
  compatible(r, regime, allergenes){
    if (allergenes && allergenes.length){
      const a = r.allergenes || [];
      for (let i = 0; i < allergenes.length; i++) if (a.indexOf(allergenes[i]) > -1) return false;
    }
    if (regime && regime !== "Omnivore"){
      const cle = this.cleRegime(regime);
      if (cle && (r.regimes || []).indexOf(cle) === -1) return false;
    }
    return true;
  },
  cleRegime(nom){
    return {
      "Omnivore":"omnivore", "Végétarien":"vegetarien", "Végétalien (vegan)":"vegan",
      "Pescétarien":"pescetarien", "Paléo":"paleo", "Sans gluten":"sans_gluten",
      "Sans lactose":"sans_lactose", "Sans porc ni alcool":"sans_porc"
    }[nom] || "";
  },

  /* ================= composition automatique ================= */
  async composer(cible, regime, allergenes, eviterIds){
    const recettes = await Catalogue.recettes();
    const dispo = recettes.filter(r => this.compatible(r, regime, allergenes));
    const servis = CONFIG.nutrition.repas.filter(sl => dispo.some(r => r.moment === sl.id));
    const manquants = CONFIG.nutrition.repas.filter(sl => servis.indexOf(sl) === -1);
    const somme = servis.reduce((t, sl) => t + sl.part, 0);

    const sortie = [];
    for (const slot of servis){
      const kcalSlot = cible.kcal * (somme > 0 ? slot.part / somme : slot.part);
      let choix = dispo.filter(r => r.moment === slot.id);
      const evites = choix.filter(r => (eviterIds || []).indexOf(r.id) === -1);
      if (evites.length) choix = evites;
      const r = choix[Math.floor(Math.random() * choix.length)];
      const base = await Catalogue.macros(r, 1);
      let f = base.kcal > 0 ? kcalSlot / base.kcal : 1;
      f = Math.min(CONFIG.nutrition.facteur_max, Math.max(CONFIG.nutrition.facteur_min, f));
      sortie.push(await this.figer(r, f, slot));
    }
    /* Les recettes sont choisies et mises a l'echelle des calories ;
       on affine ensuite les portions pour tomber sur les macros. */
    if (sortie.length && cible && cible.prot){
      await this.ajusterAuxMacros(sortie, cible);
      const ajouts = [];
      /* Jusqu'a trois complements : un seul ne suffit pas toujours
         quand le regime limite fortement les sources de proteines. */
      for (let n = 0; n < 3; n++){
        const ajoutP = await this.completerProteines(sortie, cible, regime, allergenes,
                                                     ajouts.map(x => x.id));
        if (!ajoutP) break;
        await this.ajusterAuxMacros(sortie, cible);
        ajouts.push(ajoutP);
      }
      const ajoutG = await this.completerEnergie(sortie, cible, regime, allergenes);
      if (ajoutG){ await this.ajusterAuxMacros(sortie, cible); ajouts.push(ajoutG); }
      if (ajouts.length) sortie.complement = ajouts;
      sortie.diagnostic = this.diagnostic(sortie, cible);
    }
    sortie.manquants = manquants.map(sl => sl.nom);
    return sortie;
  },

  /* On fige la recette dans le plan : le client garde ses grammages
     meme si la recette change plus tard dans le catalogue. */
  async figer(r, f, slot){
    const idx = await Catalogue.indexAliments();
    const carte = {
      moment: slot.id, moment_nom: slot.nom, recette_id: r.id, nom: r.nom,
      temps_min: r.temps_min || null, etapes: r.etapes || [],
      ingredients: (r.ingredients || []).map(i => {
        const a = idx[i.aliment_id] || {};
        return { aliment_id: i.aliment_id, nom: a.nom || i.aliment_id,
                 categorie: a.categorie || null, grammes: Math.round(i.grammes * f) };
      })
    };
    await this.recalculer(carte);
    return carte;
  },

  /* Macros d'une carte, recalculees depuis ses ingredients et leurs grammes.
     Un ingredient inconnu du catalogue est signale, jamais ignore en silence :
     sinon le plat serait annonce plus leger qu'il n'est. */
  async recalculer(carte){
    const idx = await Catalogue.indexAliments();
    const t = { kcal:0, proteines:0, glucides:0, lipides:0 };
    let inconnus = 0; const al = {};
    (carte.ingredients || []).forEach(i => {
      const a = idx[i.aliment_id];
      if (!a){ inconnus++; return; }
      const k = i.grammes / 100;
      t.kcal += (+a.kcal||0)*k; t.proteines += (+a.proteines||0)*k;
      t.glucides += (+a.glucides||0)*k; t.lipides += (+a.lipides||0)*k;
      (a.allergenes || []).forEach(x => { al[x] = true; });
      if (!i.nom) i.nom = a.nom;
      if (!i.categorie) i.categorie = a.categorie;
    });
    carte.macros = { kcal: Math.round(t.kcal), proteines: Math.round(t.proteines),
                     glucides: Math.round(t.glucides), lipides: Math.round(t.lipides) };
    carte.allergenes = Object.keys(al);
    carte.inconnus = inconnus;
    return carte;
  },

  /* ================= ajustement fin aux macros =================
     Mettre la journee au bon nombre de calories ne suffit pas : un plan
     a 2 400 kcal peut tres bien tomber 30 g de proteines sous la cible,
     et c'est justement le chiffre qui compte pour garder du muscle.
     On retouche donc les portions ingredient par ingredient.

     Le principe, en une phrase : chaque ingredient est range dans la
     famille du macro qu'il apporte surtout (proteines, glucides, lipides,
     ou legumes), et on ajuste une poignee de curseurs — un par famille —
     jusqu'a ce que la journee tombe juste. Les legumes ne bougent pas :
     ils ne servent pas de variable d'ajustement.
     ================================================================ */
  famille(a){
    const kcal = (+a.kcal) || 0;
    if (kcal < 25) return "legume";                       // legumes, fruits peu caloriques
    const p = (+a.proteines||0)*4, g = (+a.glucides||0)*4, l = (+a.lipides||0)*9;
    const t = p + g + l;
    if (t <= 0) return "legume";
    if (p / t >= 0.40) return "proteines";
    if (l / t >= 0.55) return "lipides";
    if (g / t >= 0.45) return "glucides";
    return "legume";
  },

  async ajusterAuxMacros(cartes, cible){
    const idx = await Catalogue.indexAliments();
    const A = CONFIG.nutrition.ajustement;
    const lignes = [];
    cartes.forEach((c, ci) => (c.ingredients || []).forEach((i, ii) => {
      const a = idx[i.aliment_id]; if (!a) return;
      const gras = ((+a.lipides||0) * 9) / Math.max(1, (+a.kcal||1)) > 0.85;
      lignes.push({ ci, ii, a, base: i.grammes, fam: this.famille(a),
                    max: Math.min(gras ? A.plafond_gras : A.plafond_solide, i.grammes * A.mult_max),
                    min: Math.max(A.plancher, i.grammes * A.mult_min) });
    }));
    if (!lignes.length) return { ok:false };

    const familles = ["proteines","glucides","lipides"];
    const mult = { proteines:1, glucides:1, lipides:1, legume:1 };

    /* grammes courants d'une ligne, bornes comprises */
    const grammes = (L) => Math.min(L.max, Math.max(L.min, L.base * mult[L.fam]));
    const total = () => {
      const t = { proteines:0, glucides:0, lipides:0, kcal:0 };
      lignes.forEach(L => {
        const k = grammes(L) / 100;
        t.proteines += (+L.a.proteines||0)*k; t.glucides += (+L.a.glucides||0)*k;
        t.lipides   += (+L.a.lipides||0)*k;   t.kcal     += (+L.a.kcal||0)*k;
      });
      return t;
    };
    /* ce qu'apporte une famille sur un macro donne, aux grammages courants */
    const apport = (fam, macro) => {
      let v = 0;
      lignes.forEach(L => { if (L.fam === fam) v += (+L.a[macro]||0) * grammes(L) / 100; });
      return v;
    };

    const cibles = { proteines: cible.prot, lipides: cible.lip };

    /* L'ordre suit la logique du calculateur : les proteines et les lipides
       sont fixes par le poids de corps, les glucides completent les calories.
       On cale donc les deux premieres familles sur leur macro, et la famille
       des glucides sur ce qui manque en calories — pas sur un objectif propre. */
    for (let tour = 0; tour < A.tours; tour++){
      ["proteines","lipides"].forEach(fam => {
        const t = total();
        const propre = apport(fam, fam);
        if (propre < 0.5) return;
        const autres = t[fam] - propre;
        const voulu  = Math.max(0, cibles[fam] - autres);
        mult[fam] = Math.min(A.mult_max, Math.max(A.mult_min, mult[fam] * (voulu / propre)));
      });
      const t = total();
      const kcalGluc = apport("glucides", "kcal");
      if (kcalGluc > 1){
        const voulu = Math.max(0, cible.kcal - (t.kcal - kcalGluc));
        mult.glucides = Math.min(A.mult_max, Math.max(A.mult_min, mult.glucides * (voulu / kcalGluc)));
      }
    }

    /* On applique, en arrondissant a 5 g : c'est ce qu'une balance de
       cuisine sait faire, et un gramme pres n'a aucun sens biologique. */
    lignes.forEach(L => {
      const g = Math.round(grammes(L) / A.pas_arrondi) * A.pas_arrondi;
      cartes[L.ci].ingredients[L.ii].grammes = Math.max(A.pas_arrondi, g);
    });
    for (const c of cartes) await this.recalculer(c);

    const fin = this.totaux({ repas: cartes });
    return {
      ok: true,
      ecarts: {
        kcal: Math.round(fin.kcal - cible.kcal),
        proteines: Math.round(fin.proteines - cible.prot),
        glucides: Math.round(fin.glucides - cible.gluc),
        lipides: Math.round(fin.lipides - cible.lip)
      }
    };
  },

  /* Quand les recettes choisies ne portent pas assez de proteines — cela
     arrive sur les regimes vegetariens et vegetaliens — on ajoute une
     source proteinee plutot que de livrer une journee sous la cible.
     C'est exactement ce que ferait un coach : compléter, pas laisser filer. */
  async completerProteines(cartes, cible, regime, allergenes, dejaUtilises){
    const manque = cible.prot - this.totaux({ repas: cartes }).proteines;
    if (manque < 15) return null;
    const alims = await Catalogue.aliments();
    const trouve = this.trouverComplement(alims, CONFIG.nutrition.ajustement.complements_proteines,
                                     regime, allergenes, x => (+x.proteines || 0) >= 10,
                                     dejaUtilises || []);
    if (!trouve) return null;
    const a = trouve.aliment;
    /* 250 g est deja une belle portion : au-dela, mieux vaut un deuxieme
       aliment qu'une assiette que personne ne finira. */
    const gr = Math.min(250, Math.max(20, Math.round(manque / (a.proteines / 100) / 5) * 5));
    const slot = CONFIG.nutrition.repas.find(s => s.id === "collation") || CONFIG.nutrition.repas[CONFIG.nutrition.repas.length - 1];
    const carte = {
      moment: slot.id, moment_nom: slot.nom, recette_id: null,
      nom: a.nom, temps_min: null, etapes: [],
      complement: true,
      ingredients: [{ aliment_id: a.id, nom: a.nom, categorie: a.categorie, grammes: gr }]
    };
    await this.recalculer(carte);
    cartes.push(carte);
    return { id: trouve.mot, nom: a.nom, grammes: gr };
  },

  /* Meme logique cote energie : si la journee reste nettement sous la cible
     apres ajustement, c'est que les recettes tirees ne portent pas assez de
     glucides — frequent en paleo ou en sans gluten. On ajoute une source
     glucidique compatible plutot que de livrer un plan qui affame le client. */
  async completerEnergie(cartes, cible, regime, allergenes){
    const t = this.totaux({ repas: cartes });
    const manque = cible.kcal - t.kcal;
    if (manque < cible.kcal * 0.06) return null;
    const alims = await Catalogue.aliments();
    const trouve = this.trouverComplement(alims, CONFIG.nutrition.ajustement.complements_glucides,
                                     regime, allergenes, x => (+x.glucides || 0) >= 12 && (+x.kcal || 0) > 60);
    if (!trouve) return null;
    const a = trouve.aliment;
    const gr = Math.min(400, Math.max(20, Math.round(manque / ((+a.kcal) / 100) / 5) * 5));
    const slot = CONFIG.nutrition.repas.find(s => s.id === "dejeuner") || CONFIG.nutrition.repas[0];
    const carte = {
      moment: slot.id, moment_nom: slot.nom, recette_id: null,
      nom: a.nom + " (accompagnement)", temps_min: null, etapes: [],
      complement: true,
      ingredients: [{ aliment_id: a.id, nom: a.nom, categorie: a.categorie, grammes: gr }]
    };
    await this.recalculer(carte);
    cartes.push(carte);
    return { id: trouve.mot, nom: a.nom, grammes: gr };
  },

  /* Cherche dans le catalogue le premier aliment de la liste ecrite dans
     CONFIG qui soit compatible avec le regime et les allergies. On prend le
     nom le plus court parmi les correspondances : dans une table officielle,
     "Riz blanc cru" passe avant "Riz blanc precuit assaisonne, en sachet". */
  trouverComplement(alims, souhaits, regime, allergenes, filtre, exclus){
    /* On exclut par mot-cle et non par identifiant : sans cela, "Oeuf cru"
       puis "Oeuf dur" seraient deux aliments differents pour le programme,
       et le client se retrouverait avec dix oeufs dans la journee. */
    for (const mot of souhaits){
      if ((exclus || []).indexOf(mot) > -1) continue;
      const cible = Normaliser.aplatir(mot);
      const trouves = alims
        .filter(a => Normaliser.aplatir(a.nom).indexOf(cible) > -1)
        .filter(a => filtre(a))
        .filter(a => !/(poudre|deshydrat|lyophilis|isolat|aromatis|gelee|gelatine|sauce|bouillon|conserve au sirop|sucre|confit)/.test(Normaliser.aplatir(a.nom)) || /proteine|whey/.test(Normaliser.aplatir(a.nom)))
        .filter(a => this.compatible(a, regime, allergenes))
        .sort((a, b) => a.nom.length - b.nom.length);
      if (trouves.length) return { aliment: trouves[0], mot: mot };
    }
    return null;
  },

  /* Ce que le catalogue ne permet pas d'atteindre, on le dit — plutot que
     de livrer une journee fausse sans explication. */
  diagnostic(cartes, cible){
    const t = this.totaux({ repas: cartes });
    const msgs = [];
    const dK = t.kcal - cible.kcal, dP = t.proteines - cible.prot, dG = t.glucides - cible.gluc, dL = t.lipides - cible.lip;
    if (Math.abs(dP) > 12) msgs.push(`protéines ${dP > 0 ? "au-dessus" : "en dessous"} de ${fmt(Math.abs(dP))} g`);
    if (Math.abs(dL) > 15) msgs.push(`lipides ${dL > 0 ? "au-dessus" : "en dessous"} de ${fmt(Math.abs(dL))} g — sur ce régime, les sources de protéines apportent beaucoup de gras`);
    if (Math.abs(dK) > cible.kcal * 0.07) msgs.push(`calories ${dK > 0 ? "au-dessus" : "en dessous"} de ${fmt(Math.abs(dK))} kcal`);
    if (dG < -60) msgs.push(`glucides en dessous de ${fmt(Math.abs(dG))} g — ce régime offre peu de sources de glucides dans le catalogue`);
    return msgs;
  },

  totaux(R){
    const t = { kcal:0, proteines:0, glucides:0, lipides:0 };
    (R.repas || []).forEach(x => {
      if (!x.macros) return;
      t.kcal += x.macros.kcal; t.proteines += x.macros.proteines;
      t.glucides += x.macros.glucides; t.lipides += x.macros.lipides;
    });
    return t;
  },

  /* ================= liste de courses ================= */
  courses(R, jours){
    const somme = {};
    (R.repas || []).forEach(c => (c.ingredients || []).forEach(i => {
      const cle = i.aliment_id;
      if (!somme[cle]) somme[cle] = { nom: i.nom || cle, categorie: i.categorie, grammes: 0 };
      somme[cle].grammes += i.grammes * jours;
    }));
    const rayons = CONFIG.nutrition.rayons.map(r => ({ id:r.id, nom:r.nom, lignes:[] }));
    const autre = { id:"autre", nom:"Divers", lignes:[] };
    Object.keys(somme).forEach(cle => {
      const l = somme[cle];
      const r = rayons.find(x => (CONFIG.nutrition.rayons.find(y => y.id === x.id).categories || []).indexOf(l.categorie) > -1);
      (r || autre).lignes.push({ id: cle, nom: l.nom, grammes: Math.round(l.grammes) });
    });
    if (autre.lignes.length) rayons.push(autre);
    rayons.forEach(r => r.lignes.sort((a,b) => a.nom.localeCompare(b.nom, "fr")));
    return rayons.filter(r => r.lignes.length);
  },

  blocCourses(R, coches){
    const jours = R.jours_courses || 7;
    const rayons = this.courses(R, jours);
    if (!rayons.length) return "";
    let h = `<section class="panel">
      <div class="repas-tete">
        <div><h2 style="margin:0">Liste de courses</h2>
          <p class="note" style="margin:4px 0 0">Les quantités de la journée type, multipliées par le nombre de jours.</p></div>
        <div style="min-width:150px"><label for="nu-jours">Nombre de jours</label>
          <input id="nu-jours" type="number" min="1" max="31" step="1" value="${jours}"></div>
      </div>`;
    rayons.forEach(r => {
      h += `<h3 style="margin-top:18px">${esc(r.nom)}</h3><ul class="ingr courses-l">` +
        r.lignes.map(l => `<li><label class="coche"><input type="checkbox" data-course="${esc(l.id)}"${coches[l.id] ? " checked" : ""}> ${esc(l.nom)}</label><b>${fmt(l.grammes)} g</b></li>`).join("") +
        `</ul>`;
    });
    h += `<p class="note" style="margin-top:16px">Les poids sont donnés tels qu'ils entrent dans les recettes — crus pour la viande, le poisson et les féculents. Prévois un peu plus pour les pertes à la cuisson.</p></section>`;
    return h;
  },

  html(){ return `<div id="nu-vue"><section class="panel"><div class="empty">Chargement…</div></section></div>`; },

  async init(){
    const self = this;
    const edition = Auth.estCoach() && Store.idConsulte;
    const R = await Store.lire(this.cle, this.vide());
    Store.cache[this.cle] = R;
    const zone = $("nu-vue");
    if (!zone) return;
    const sauver = () => Store.ecrire(self.cle, R);

    /* ---------- cote client : lecture + suivi personnel ---------- */
    if (!edition){
      const suivi = await Store.lire("repas_suivi", { date:"", mange:{}, courses:{} });
      if (suivi.date !== aujourdhui()){ suivi.date = aujourdhui(); suivi.mange = {}; }
      Store.cache["repas_suivi"] = suivi;
      const dessiner = () => {
        zone.innerHTML = self.vueLecture(R, suivi);
        $$("[data-mange]", zone).forEach(c => c.addEventListener("change", () => {
          suivi.mange[c.dataset.mange] = c.checked;
          Store.ecrire("repas_suivi", suivi); dessiner();
        }));
        $$("[data-course]", zone).forEach(c => c.addEventListener("change", () => {
          suivi.courses = suivi.courses || {};
          suivi.courses[c.dataset.course] = c.checked;
          Store.ecrire("repas_suivi", suivi);
        }));
        const j = $("nu-jours");
        if (j) j.addEventListener("change", () => {
          const n = Math.max(1, Math.min(31, Math.round(num(j.value)) || 7));
          suivi.jours = n; R.jours_courses = n; dessiner();
        });
      };
      if (suivi.jours) R.jours_courses = suivi.jours;
      dessiner();
      return;
    }

    /* ---------- cote coach : edition ---------- */
    const ctx = { prerempli:false, autres:"" };
    let intake = {}, calc = null;
    try { intake = await Store.lire("intake", {}) || {}; } catch(e){}
    try { calc   = await Store.lire("calc", null); } catch(e){}
    ctx.autres = (intake.allergies || "").trim();

    if (!R.regime && intake.regime_type){ R.regime = intake.regime_type; ctx.prerempli = true; }
    if ((!R.allergenes || !R.allergenes.length) && intake.allergenes){
      const noms = String(intake.allergenes).split("|").filter(Boolean);
      R.allergenes = CONFIG.nutrition.allergenes.filter(a => noms.indexOf(a.nom) > -1).map(a => a.id);
      if (R.allergenes.length) ctx.prerempli = true;
    }
    if (!R.cible && calc && calc.poids){
      const bmr  = outilCalculateur.metabolismeDeBase(calc);
      const tdee = bmr * outilCalculateur.facteurActivite(calc).total;
      const c = CONFIG.calcul;
      const kcal = calc.objectif === "perte" ? tdee * (1 - c.deficit_perte)
                 : calc.objectif === "prise" ? tdee * (1 + c.surplus_prise) : tdee;
      const m = outilCalculateur.macros(kcal, calc.poids);
      R.cible = { kcal: Math.round(kcal), prot: Math.round(m.prot), lip: Math.round(m.lip), gluc: Math.round(m.gluc) };
      ctx.prerempli = true;
    }

    const redessiner = () => { zone.innerHTML = self.vueEdition(R, ctx); brancher(); };

    const lireReglages = () => {
      const k = $("nu-kcal"), rg = $("nu-regime"), no = $("nu-note");
      if (k && k.value){
        const kcal = num(k.value);
        const poids = (calc && calc.poids) || num(intake.poids) || 0;
        const m = poids ? outilCalculateur.macros(kcal, poids) : { prot:0, lip:0, gluc:0 };
        R.cible = { kcal: Math.round(kcal), prot: Math.round(m.prot), lip: Math.round(m.lip), gluc: Math.round(m.gluc) };
      }
      if (rg) R.regime = rg.value;
      if (no) R.note = no.value;
      R.allergenes = $$("#nu-allerg input:checked").map(c => c.value);
    };

    /* --- recherche pour la composition manuelle --- */
    let minuteur = null;
    const chercher = async (q) => {
      const box = $("nu-res"); if (!box) return;
      if (q.length < 2){ box.innerHTML = ""; return; }
      const t = Normaliser.aplatir(q);
      const [alims, recs] = await Promise.all([Catalogue.aliments(), Catalogue.recettes()]);
      const score = (nom) => Normaliser.aplatir(nom).indexOf(t);
      const ra = alims.filter(a => score(a.nom) > -1).sort((a,b) => score(a.nom) - score(b.nom) || a.nom.length - b.nom.length).slice(0, 12);
      const rr = recs.filter(r => score(r.nom) > -1).sort((a,b) => score(a.nom) - score(b.nom)).slice(0, 6);
      if (!ra.length && !rr.length){ box.innerHTML = `<div class="empty">Rien ne correspond à « ${esc(q)} ».</div>`; return; }
      const ligne = (o, type) => {
        const ok = self.compatible(o, R.regime, R.allergenes);
        const pourquoi = ok ? "" : ((o.allergenes || []).filter(x => (R.allergenes || []).indexOf(x) > -1)
              .map(x => (CONFIG.nutrition.allergenes.find(z => z.id === x) || {}).nom).join(", ") || "hors régime");
        return `<div class="res-l${ok ? "" : " exclu"}">
          <span class="nom">${esc(o.nom)}</span>
          <span class="meta">${type === "aliment" ? `${fmt(o.kcal)} kcal / 100 g` : `recette · ${esc((CONFIG.nutrition.repas.find(s => s.id === o.moment) || {}).nom || "")}`}${ok ? "" : ` · <b>${esc(pourquoi)}</b>`}</span>
          <span class="actions-b"><button data-add="${type}:${esc(o.id)}">Ajouter</button></span>
        </div>`;
      };
      box.innerHTML = (rr.length ? `<h3>Recettes</h3>` + rr.map(r => ligne(r, "recette")).join("") : "") +
                      (ra.length ? `<h3>Aliments</h3>` + ra.map(a => ligne(a, "aliment")).join("") : "");
      $$("[data-add]", box).forEach(b => b.addEventListener("click", async () => {
        const [type, ...reste] = b.dataset.add.split(":");
        const id = reste.join(":");
        const slotId = $("nu-slot").value;
        const slot = CONFIG.nutrition.repas.find(s => s.id === slotId);
        if (type === "recette"){
          const r = (await Catalogue.recettes()).find(x => x.id === id);
          if (r) R.repas.push(await self.figer(r, 1, slot));
        } else {
          const idx = await Catalogue.indexAliments(); const a = idx[id];
          if (a){
            const gr = Math.max(1, Math.round(num($("nu-gr").value) || a.portion_g || 100));
            const carte = { moment: slot.id, moment_nom: slot.nom, recette_id: null, nom: a.nom,
                            temps_min: null, etapes: [],
                            ingredients: [{ aliment_id: a.id, nom: a.nom, categorie: a.categorie, grammes: gr }] };
            await self.recalculer(carte);
            R.repas.push(carte);
          }
        }
        R.repas.sort((x, y) => CONFIG.nutrition.repas.findIndex(s => s.id === x.moment) - CONFIG.nutrition.repas.findIndex(s => s.id === y.moment));
        sauver(); redessiner();
      }));
    };

    const brancher = () => {
      ["nu-kcal","nu-regime","nu-note"].forEach(id => {
        const el = $(id); if (el) el.addEventListener("change", () => { lireReglages(); sauver(); });
      });
      $$("#nu-allerg input").forEach(c => c.addEventListener("change", () => { lireReglages(); sauver(); }));

      const q = $("nu-q");
      if (q) q.addEventListener("input", () => { clearTimeout(minuteur); minuteur = setTimeout(() => chercher(q.value.trim()), 200); });

      const g = $("nu-gen");
      if (g) g.addEventListener("click", async () => {
        lireReglages();
        if (!R.cible || !R.cible.kcal){ flash("nu-msg","Indique d'abord les calories visées."); return; }
        g.disabled = true; g.textContent = "Composition…";
        const liste = await self.composer(R.cible, R.regime, R.allergenes, []);
        g.disabled = false; g.textContent = "Générer une journée";
        if (!liste.length){ flash("nu-msg","Aucune recette ne correspond à ces critères. Importe le catalogue ou assouplis les filtres."); return; }
        R.repas = liste; R.manquants = liste.manquants || [];
        R.diagnostic = liste.diagnostic || [];
        R.complement = liste.complement || null;
        sauver(); redessiner();
        if (R.manquants.length) flash("nu-msg", "Aucune recette compatible pour : " + R.manquants.join(", ") + ". Les calories ont été réparties sur les autres repas.");
      });

      $$("[data-autre]", zone).forEach(b => b.addEventListener("click", async () => {
        const i = +b.dataset.autre, x = R.repas[i];
        const remplacants = await self.composer(R.cible || { kcal: (x.macros.kcal * 4) }, R.regime, R.allergenes, [x.recette_id]);
        const nouveau = remplacants.find(n => n.moment === x.moment);
        if (nouveau){ R.repas[i] = nouveau; sauver(); redessiner(); }
        else flash("nu-msg", "Pas d'autre recette disponible pour ce repas.");
      }));
      $$("[data-retirer]", zone).forEach(b => b.addEventListener("click", () => {
        R.repas.splice(+b.dataset.retirer, 1); sauver(); redessiner();
      }));
      $$("[data-suppr-i]", zone).forEach(b => b.addEventListener("click", async () => {
        const [i, j] = b.dataset.supprI.split(":").map(Number);
        R.repas[i].ingredients.splice(j, 1);
        if (!R.repas[i].ingredients.length) R.repas.splice(i, 1);
        else await self.recalculer(R.repas[i]);
        sauver(); redessiner();
      }));
      $$("[data-gr]", zone).forEach(el => el.addEventListener("change", async () => {
        const [i, j] = el.dataset.gr.split(":").map(Number);
        R.repas[i].ingredients[j].grammes = Math.max(0, Math.round(num(el.value)));
        await self.recalculer(R.repas[i]);
        sauver(); redessiner();
      }));
      $$("[data-ajout-i]", zone).forEach(b => b.addEventListener("click", () => {
        const i = +b.dataset.ajoutI;
        $("nu-slot").value = R.repas[i].moment;
        $("nu-q").focus();
        $("nu-q").scrollIntoView({ behavior:"smooth", block:"center" });
      }));

      const j = $("nu-jours");
      if (j) j.addEventListener("change", () => {
        R.jours_courses = Math.max(1, Math.min(31, Math.round(num(j.value)) || 7));
        sauver(); redessiner();
      });

      const sv = $("nu-save");
      if (sv) sv.addEventListener("click", () => {
        if (!R.repas || !R.repas.length){ flash("nu-msg2","Il n'y a encore aucun repas à envoyer."); return; }
        R.maj = new Date().toLocaleDateString("fr-FR");
        Store.ecrire(self.cle, R);
        flash("nu-msg2","Journée envoyée. Ton client la voit dès sa prochaine ouverture.");
      });

      const bs = $("nu-biblio-save");
      if (bs) bs.addEventListener("click", async () => {
        if (!R.repas || !R.repas.length){ flash("nu-msg","Compose d'abord une journée."); return; }
        const nom = prompt("Sous quel nom l'enregistrer dans ta bibliothèque ?", R.nom || "Journée type");
        if (!nom) return;
        try {
          await Auth.appel("/rest/v1/bibliotheque", {
            method:"POST", headers:{ "Prefer":"return=minimal" },
            body:[{ coach_id: Auth.utilisateur().id, nom, note: R.note || "",
                    contenu: { type:"repas", repas: R.repas, cible: R.cible, regime: R.regime, allergenes: R.allergenes } }]
          });
          flash("nu-msg","Enregistré dans ta bibliothèque.");
          chargerBiblio();
        } catch(e){ flash("nu-msg","Enregistrement impossible."); }
      });

      chargerBiblio();
    };

    const chargerBiblio = async () => {
      const sel = $("nu-biblio"); if (!sel) return;
      try {
        const l = await Auth.appel("/rest/v1/bibliotheque?select=id,nom,contenu&order=cree_le.desc");
        const repas = (l || []).filter(x => x.contenu && x.contenu.type === "repas");
        sel.innerHTML = `<option value="">— charger depuis ma bibliothèque —</option>` +
          repas.map(x => `<option value="${x.id}">${esc(x.nom)}</option>`).join("");
        sel.onchange = () => {
          if (!sel.value) return;
          const x = repas.find(y => String(y.id) === sel.value);
          if (!x) return;
          if (!confirm("Charger « " + x.nom + " » ? Cela remplacera les repas actuels de ce client.")){ sel.value = ""; return; }
          R.repas = JSON.parse(JSON.stringify(x.contenu.repas || []));
          if (x.contenu.cible) R.cible = x.contenu.cible;
          sauver(); redessiner();
        };
      } catch(e){}
    };

    redessiner();
  }
};

        dire(`<b>${fmt(recettes.length)} recettes</b> retenues${orphelines ? `, ${fmt(orphelines)} écartée${orphelines>1?"s":""}` : ""}. Étiquettes déduites des ingrédients : <b>${fmt(ecarts)}</b> différaient du fichier.`, ecarts ? "attention" : "");
        await Import.envoyer("recettes", recettes, (t, i, n) => dire(`Recettes enregistrées : ${fmt(i)} / ${fmt(n)}`));

        /* --- 3. programmes --- */

        const programmes = brutP.filter(x => x && x.id && x.seances && x.seances.length).map(x => ({
          id: x.id, nom: x.nom, niveau: x.niveau || null, seances_semaine: x.seances_semaine || null,
          lieu: x.lieu || null, objectif: x.objectif || null, duree_semaines: x.duree_semaines || null,
          note: x.note || null,

              repos: String(e.repos || ""), tempo: String(e.tempo || ""), note: e.note || "", lien: e.lien || ""
            }))

        await Import.envoyer("programmes_types", programmes, null);
        dire(`<b>${fmt(programmes.length)} programmes</b> enregistrés.`);

        Catalogue._c = {}; Catalogue._idx = null;
        await self.compteurs();
        dire("Import terminé.", "ok-l");
        flash("cat-msg", "Catalogue à jour.");
      } catch(e){
        dire("Import interrompu : " + esc(e.message || String(e)), "erreur-l");
        flash("cat-msg", "L'import n'a pas abouti — rien n'a été perdu, tu peux réessayer.");

      b.disabled = false; b.textContent = "Importer le catalogue";
    });
  }
};

/* ------------------------------------------------------------------
   OUTIL COACH — Mes clients (invisible pour les clients)
   ------------------------------------------------------------------ */
const outilClients = {
  id: "clients",
  cle: null,
  nom: "Mes clients",
  icone: "👥",
  role: "coach",          // n'apparait que pour le coach
  titre: "Mes clients",
  accroche: "Tous tes clients et leurs données, en direct. Le tableau te dit d'un coup d'œil qui avance, qui décroche, et à qui il manque quelque chose.",

  jours(iso){
    if (!iso) return null;
    return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  },

  /* Evolution du poids d'un client a partir de ses mensurations */
  evolution(mens){
    if (!mens || !mens.mesures || !mens.mesures.length) return null;
    const m = mens.mesures.filter(x => x.poids).slice().sort((a,b) => (a.date||"") < (b.date||"") ? -1 : 1);
    if (!m.length) return null;
    const dernier = m[m.length - 1];
    const depart = mens.pstart || m[0].poids;
    /* on cherche la mesure la plus proche de 28 jours avant la derniere */
    const cible = new Date(dernier.date || aujourdhui()).getTime() - 28 * 86400000;
    let ref = m[0], ecartMin = Infinity;
    m.forEach(x => {
      const e = Math.abs(new Date(x.date || aujourdhui()).getTime() - cible);
      if (e < ecartMin){ ecartMin = e; ref = x; }
    });
    /* On ne parle de "quatre semaines" que si la mesure de reference tombe
       vraiment dans cette fenetre : sinon on affiche rien plutot qu'un
       chiffre calcule sur une periode differente de celle annoncee. */
    const ecartJours = Math.round(Math.abs(new Date(dernier.date || aujourdhui()).getTime() - new Date(ref.date || aujourdhui()).getTime()) / 86400000);
    const fenetreValide = ref !== dernier && ecartJours >= 14 && ecartJours <= 45;
    return {
      depart: depart, actuel: dernier.poids, date: dernier.date,
      total: dernier.poids - depart,
      mois: fenetreValide ? dernier.poids - ref.poids : null,
      jours_fenetre: fenetreValide ? ecartJours : null,
      n: m.length
    };
  },

  tableau(profils, parClient, contenus){
    const tb = $("tb-clients"), zoneA = $("alertes-clients");
    if (!tb) return;
    const clients = (profils || []).filter(p => p.role !== "coach");
    if (!clients.length){
      tb.innerHTML = '<tr><td colspan="9">Aucun client pour le moment.</td></tr>';
      if (zoneA) zoneA.innerHTML = "";
      return;
    }

    const lignes = clients.map(p => {
      const c = contenus[p.id] || {};
      const ev = this.evolution(c.mens);
      const j = this.jours(parClient[p.id]);
      const objectif = (c.intake && c.intake.objectif) || "";
      /* Le sens du progres depend de l'objectif : perdre, c'est descendre. */
      const sens = /perte|s[èe]che/i.test(objectif) ? -1 : /prise|masse/i.test(objectif) ? 1 : 0;
      return {
        p: p, ev: ev, jours: j,
        nom: ((p.prenom||"") + " " + (p.nom||"")).trim() || (p.id.slice(0,8)),
        intake: !!(c.intake && c.intake.complet),
        programme: !!(c.programme && (c.programme.seances||[]).length),
        diete: !!(c.repas && (c.repas.repas||[]).length),
        sens: sens
      };
    });

    /* Ceux qui demandent une action passent devant. */
    const urgence = (l) => (l.jours === null ? 100 : l.jours >= 10 ? 90 : 0) +
                           (!l.intake ? 50 : 0) + (!l.programme ? 20 : 0) + (!l.diete ? 10 : 0);
    lignes.sort((a,b) => urgence(b) - urgence(a) || (b.jours||0) - (a.jours||0));

    const pastille = (ok, txtOk, txtNon) =>
      `<span class="pastille${ok ? "" : " manque"}">${ok ? txtOk : txtNon}</span>`;
    const variation = (v, sens) => {
      if (v === null || v === undefined) return '<span class="meta">—</span>';
      const t = (v > 0 ? "+" : "") + n1(v) + " kg";
      const bon = sens === 0 ? null : (sens < 0 ? v < -0.2 : v > 0.2);
      return `<b style="color:${bon === null ? "var(--ink)" : bon ? "var(--good)" : (Math.abs(v) < 0.3 ? "var(--ink-3)" : "var(--warn)")}">${t}</b>`;
    };

    tb.innerHTML = lignes.map(l => `<tr>
      <td><b>${esc(l.nom)}</b></td>
      <td>${l.jours === null ? '<span class="pastille manque">jamais</span>'
            : l.jours >= 10 ? `<span class="pastille manque">${l.jours} j</span>`
            : `<span class="meta">${l.jours === 0 ? "aujourd'hui" : "il y a " + l.jours + " j"}</span>`}</td>
      <td>${l.ev ? `${n1(l.ev.actuel)} kg <span class="meta">(départ ${n1(l.ev.depart)})</span>` : '<span class="meta">aucune mesure</span>'}</td>
      <td>${l.ev ? variation(l.ev.total, l.sens) : '<span class="meta">—</span>'}</td>
      <td>${l.ev && l.ev.mois !== null ? variation(l.ev.mois, l.sens) + (l.ev.jours_fenetre !== 28 ? ` <span class="meta">sur ${l.ev.jours_fenetre} j</span>` : "") : '<span class="meta">pas assez de recul</span>'}</td>
      <td>${pastille(l.intake, "rempli", "à remplir")}</td>
      <td>${pastille(l.programme, "envoyé", "à faire")}</td>
      <td>${pastille(l.diete, "envoyée", "à faire")}</td>
      <td><button class="voir" type="button" data-ouvrir="${esc(l.p.id)}" data-nom="${esc(l.nom)}">Ouvrir</button></td>
    </tr>`).join("");

    $$("[data-ouvrir]", tb).forEach(b => b.addEventListener("click", () => {
      Store.idConsulte = b.dataset.ouvrir;
      Store.nomConsulte = b.dataset.nom;
      location.hash = "#/profil";
    }));

    if (zoneA){
      const muets = lignes.filter(l => l.jours === null || l.jours >= 10);
      const aFaire = lignes.filter(l => !l.programme || !l.diete || !l.intake);
      let h = "";
      if (muets.length) h += `<div class="flag"><b>Sans nouvelles depuis 10 jours ou plus :</b> ${muets.map(l => esc(l.nom)).join(", ")}. C'est le moment de reprendre contact.</div>`;
      if (aFaire.length) h += `<div class="flag" style="margin-top:8px"><b>Il manque quelque chose pour :</b> ${aFaire.map(l => esc(l.nom) + " (" + [!l.intake ? "questionnaire" : null, !l.programme ? "programme" : null, !l.diete ? "diète" : null].filter(Boolean).join(", ") + ")").join(" · ")}.</div>`;
      if (!h) h = `<p class="note" style="margin:0">Tous tes clients ont leur questionnaire, leur programme et leur diète, et se sont manifestés dans les dix derniers jours.</p>`;
      zoneA.innerHTML = h;
    }
  },

  html(){
    return `
    <section class="panel">
      <h2>Suivi de mes clients</h2>
      <div id="alertes-clients"></div>
      <div class="scroll" style="margin-top:14px"><table><thead><tr>
        <th>Client</th><th>Activité</th><th>Poids</th><th>Depuis le début</th><th>4 dernières sem.</th>
        <th>Questionnaire</th><th>Programme</th><th>Diète</th><th></th>
      </tr></thead><tbody id="tb-clients"><tr><td colspan="9">Chargement…</td></tr></tbody></table></div>
      <p class="note" style="margin-top:12px">« Activité » compte les jours depuis la dernière saisie du client, quelle qu'elle soit. Une variation de poids se lit sur quatre semaines : en dessous, c'est du bruit.</p>
    </section>

    <section class="panel">
      <h2>Comptes</h2>
      <div id="liste-clients"><div class="empty">Chargement…</div></div>
    </section>

    <section class="panel">
      <h2>Créer un accès client</h2>
      <p class="note" style="margin-bottom:16px">Le client recevra ces identifiants. Il pourra changer son mot de passe lui-même depuis l'écran de connexion.</p>
      <div class="grid g2">
        <div><label for="n-prenom">Prénom</label><input id="n-prenom" type="text"></div>
        <div><label for="n-nom">Nom</label><input id="n-nom" type="text"></div>
        <div><label for="n-email">Email</label><input id="n-email" type="email"></div>
        <div><label for="n-mdp">Mot de passe provisoire</label><input id="n-mdp" type="text"></div>
      </div>
      <div class="actions">
        <button class="btn" id="n-creer">Créer le compte</button>
        <button class="btn ghost" id="n-gen">Générer un mot de passe</button>
        <span class="msg" id="n-msg"></span>
      </div>
    </section>`;
  },

  async init(){
    const self = this;

    const charger = async () => {
      const box = $("liste-clients");
      try {
        const profils = await Auth.appel("/rest/v1/profils?select=*&order=cree_le.desc");
        const donnees = await Auth.appel("/rest/v1/donnees?select=user_id,outil,contenu,maj_le");
        const parClient = {}, contenus = {};
        (donnees || []).forEach(d => {
          if (!parClient[d.user_id] || d.maj_le > parClient[d.user_id]) parClient[d.user_id] = d.maj_le;
          (contenus[d.user_id] = contenus[d.user_id] || {})[d.outil] = d.contenu;
        });
        self.tableau(profils, parClient, contenus);
        const clients = (profils || []).filter(p => p.role !== "coach");
        if (!clients.length){ box.innerHTML = '<div class="empty">Aucun client pour le moment. Crée le premier accès ci-dessous.</div>'; return; }
        box.innerHTML = "";
        clients.forEach(p => {
          const d = parClient[p.id];
          const quand = d ? new Date(d).toLocaleDateString("fr-FR") : "jamais";
          const el = document.createElement("div");
          el.className = "client-l";
          el.innerHTML = `<span class="nom">${esc(((p.prenom||"") + " " + (p.nom||"")).trim() || "Sans nom")}</span>
                          <span class="pastille">${d ? "actif" : "pas encore utilisé"}</span>
                          <span class="meta">dernière saisie : ${quand}</span>
                          <button class="voir" type="button">Ouvrir sa fiche</button>`;
          el.querySelector(".voir").addEventListener("click", () => {
            Store.idConsulte = p.id;
            Store.nomConsulte = ((p.prenom||"") + " " + (p.nom||"")).trim() || "ce client";
            location.hash = "#/profil";
          });
          box.appendChild(el);
        });
      } catch(e){
        box.innerHTML = '<div class="empty">Impossible de charger la liste.</div>';
        const tb = $("tb-clients"); if (tb) tb.innerHTML = '<tr><td colspan="9">Impossible de charger le suivi.</td></tr>';
      }
    };

    $("n-gen").addEventListener("click", () => {
      const a = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let m = ""; for (let i=0;i<10;i++) m += a[Math.floor(Math.random()*a.length)];
      $("n-mdp").value = m;
    });

    $("n-creer").addEventListener("click", async () => {
      const prenom = $("n-prenom").value.trim(), nom = $("n-nom").value.trim();
      const email = $("n-email").value.trim(), mdp = $("n-mdp").value;
      if (!email || !mdp){ flash("n-msg","Il faut au moins un email et un mot de passe."); return; }
      if (mdp.length < 6){ flash("n-msg","Le mot de passe doit faire au moins 6 caractères."); return; }
      const sessionCoach = Auth.session;          // on met la session du coach de côté
      try {
        await Auth.inscrire(email, mdp, prenom, nom);
        Auth.session = sessionCoach;              // on la restaure : on reste connecté en coach
        try { localStorage.setItem(Auth.cleSession, JSON.stringify(sessionCoach)); } catch(e){}
        $("n-prenom").value = $("n-nom").value = $("n-email").value = $("n-mdp").value = "";
        flash("n-msg", "Compte créé. Transmets-lui ses identifiants.");
        charger();
      } catch(e){
        Auth.session = sessionCoach;
        flash("n-msg", e.message || "Création impossible.");
      }
    });

    charger();
  }
};

/* ------------------------------------------------------------------
   LISTE DES OUTILS — ajouter un objet ici suffit à créer un onglet
   ------------------------------------------------------------------ */
const OUTILS = [outilProfil, outilProgramme, outilNutrition, outilCalculateur, outilMensurations, outilEntrainement, outilBibliotheque, outilCatalogue, outilClients];

/* ==================================================================
   [G] NAVIGATION, CONNEXION ET DEMARRAGE
   Chaque outil a sa propre adresse : #/calculateur, #/mensurations,
   #/entrainement. Le coach voit en plus #/clients.
   ================================================================== */
let courant = OUTILS[0].id;
let nettoyage = null;

function outilsVisibles(){
  return OUTILS.filter(o => !o.role || (o.role === "coach" && Auth.estCoach()));
}

/* « Mon programme » devient « Son programme » quand le coach consulte
   une fiche : le meme mot pour deux personnes differentes, c'est ce qui
   fait qu'on ne sait plus chez qui on ecrit. */
function nomOnglet(o){
  /* Les outils du coach gardent leur nom : « Mes clients » ne devient
     jamais « Ses clients ». Seuls les outils qui affichent les donnees
     d'un client changent de possessif. */
  if (!Store.idConsulte || o.role === "coach") return o.nom;
  return o.nom.replace(/^Mon /, "Son ").replace(/^Mes /, "Ses ").replace(/^Ma /, "Sa ");
}

function construireNav(){
  const nav = $("nav");
  nav.innerHTML = outilsVisibles().map(o =>
    `<a href="#/${o.id}" data-id="${o.id}"><span class="ico" aria-hidden="true">${o.icone}</span>${esc(nomOnglet(o))}</a>`
  ).join("");
  $("brand-name").textContent = CONFIG.marque.nom;
  $("brand-sub").textContent  = CONFIG.marque.programme;
  $("foot-left").textContent  = `${CONFIG.marque.programme} — ${CONFIG.marque.nom}`;
  $("foot-right").innerHTML   = `Une question ? <a href="${CONFIG.marque.instagram}" target="_blank" rel="noopener">${esc(CONFIG.marque.pseudo)}</a> · ${esc(CONFIG.marque.email)}`;

  const p = Auth.profil, u = Auth.utilisateur();
  const nom = p && (p.prenom || p.nom) ? ((p.prenom || "") + " " + (p.nom || "")).trim() : (u ? u.email : "");
  $("qui").textContent = nom + (Auth.estCoach() ? " · coach" : "");
  $("compte").hidden = false;
  $("deco").onclick = () => Auth.deconnecter();
}

function marquerNav(id){
  $$("#nav a").forEach(a => {
    if (a.dataset.id === id) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
}

function bandeauConsultation(){
  if (!Store.idConsulte) return "";
  /* Sans ces boutons, le coach atterrit sur une page et ne devine pas que
     tout le reste de la fiche est accessible par les onglets du haut.
     Un mode implicite est un mode qu'on ne trouve pas. */
  const actions = [
    { id:"profil",       nom:"Son questionnaire" },
    { id:"programme",    nom:"Son programme",  fort:true },
    { id:"nutrition",    nom:"Ses repas",      fort:true },
    { id:"mensurations", nom:"Ses courbes" },
    { id:"entrainement", nom:"Ses séances" }
  ];
  return `<div class="bandeau">
    <div class="bandeau-tete">
      <strong>Fiche de ${esc(Store.nomConsulte || "ce client")}</strong>
      <span class="note">Tu vois ses données. Les deux boutons dorés sont les seuls endroits où tu écris pour lui.</span>
    </div>
    <div class="bandeau-actions">
      ${actions.map(a => `<a href="#/${a.id}" class="b-act${a.fort ? " fort" : ""}${courant === a.id ? " ici" : ""}">${esc(a.nom)}</a>`).join("")}
      <button class="sortir" type="button" id="sortir-fiche">Revenir à mes clients</button>
    </div>
  </div>`;
}

async function afficher(id, silencieux){
  const dispo = outilsVisibles();
  const outil = dispo.find(o => o.id === id) || dispo[0];
  courant = outil.id;
  if (nettoyage){ nettoyage(); nettoyage = null; }

  if (outil.role === "coach"){ Store.idConsulte = null; Store.nomConsulte = null; }

  $("vue").innerHTML = `
    ${bandeauConsultation()}
    <header class="masthead">
      <span class="eyebrow">${Store.idConsulte ? esc(Store.nomConsulte || "client") : esc(CONFIG.marque.programme)} — ${esc(nomOnglet(outil))}</span>
      <h1>${Store.idConsulte ? esc(nomOnglet(outil)) : esc(outil.titre)}</h1>
      ${Store.idConsulte ? "" : `<p class="lede">${esc(outil.accroche)}</p>`}
    </header>
    ${outil.html()}
    ${outil.cle ? blocSauvegarde() : ""}`;

  construireNav();   // les libelles dependent du mode : on les rafraichit
  const modifiable = !Store.idConsulte || (Auth.estCoach() && (outil.id === "programme" || outil.id === "nutrition"));
  $("vue").className = modifiable ? "wrap" : "wrap lecture-seule";

  nettoyage = (await outil.init()) || null;
  if (outil.cle){ initSauvegarde(); }
  const sortir = $("sortir-fiche");
  if (sortir) sortir.addEventListener("click", () => {
    Store.idConsulte = null; Store.nomConsulte = null; location.hash = "#/clients";
  });

  marquerNav(outil.id);
  if (!silencieux) window.scrollTo(0, 0);
}

function routeDepuisAdresse(){
  let id = (location.hash || "").replace(/^#\/?/, "");
  if (id.indexOf("=") > -1 || id.indexOf("&") > -1) id = "";
  afficher(outilsVisibles().some(o => o.id === id) ? id : outilsVisibles()[0].id);
}

/* ---------------------- ÉCRAN DE CONNEXION ---------------------- */
function portail(mode){
  mode = mode || "connexion";
  document.body.innerHTML = `
  <div class="portail">
    <div class="carte-co">
      <div class="logo">${esc(CONFIG.marque.nom)}</div>
      <div class="sous">${esc(CONFIG.marque.programme)}</div>
      <h2>${mode === "connexion" ? "Connexion à ton espace" : mode === "oubli" ? "Mot de passe oublié" : "Créer mon accès"}</h2>
      <div id="co-err"></div>
      ${mode === "inscription" ? `
        <div class="champ"><label for="c-prenom">Prénom</label><input id="c-prenom" type="text" autocomplete="given-name"></div>
        <div class="champ"><label for="c-nom">Nom</label><input id="c-nom" type="text" autocomplete="family-name"></div>` : ""}
      <div class="champ"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="email"></div>
      ${mode !== "oubli" ? `<div class="champ"><label for="c-mdp">Mot de passe</label><input id="c-mdp" type="password" autocomplete="${mode === "inscription" ? "new-password" : "current-password"}"></div>` : ""}
      ${mode === "inscription" ? `<div class="champ"><label for="c-mdp2">Confirme ton mot de passe</label><input id="c-mdp2" type="password" autocomplete="new-password"></div>` : ""}
      <button class="btn" id="c-go">${mode === "connexion" ? "Se connecter" : mode === "oubli" ? "Recevoir le lien" : "Créer mon accès"}</button>
      <div class="bascule">
        ${mode === "connexion"
          ? `<button type="button" data-mode="oubli">Mot de passe oublié ?</button>`
          : `<button type="button" data-mode="connexion">Retour à la connexion</button>`}
      </div>
    </div>
  </div>`;

  const err = (msg, ok) => { const e = $("co-err"); e.className = "erreur" + (ok ? " ok" : ""); e.textContent = msg; };

  $$("[data-mode]").forEach(b => b.addEventListener("click", () => portail(b.dataset.mode)));

  const valider = async () => {
    const email = ($("c-email").value || "").trim();
    const mdp = $("c-mdp") ? $("c-mdp").value : "";
    if (!email){ err("Indique ton email."); return; }
    const bouton = $("c-go"); bouton.disabled = true; bouton.textContent = "Un instant…";
    try {
      if (mode === "oubli"){
        await Auth.motDePasseOublie(email);
        err("Si un compte existe pour cet email, tu vas recevoir un lien.", true);
      } else if (mode === "inscription"){
        if (mdp.length < 6) throw new Error("Le mot de passe doit faire au moins 6 caractères.");
        if (mdp !== $("c-mdp2").value) throw new Error("Les deux mots de passe ne sont pas identiques.");
        await Auth.inscrire(email, mdp, ($("c-prenom").value||"").trim(), ($("c-nom").value||"").trim());
        location.reload();
      } else {
        await Auth.connecter(email, mdp);
        location.reload();
      }
    } catch(e){
      const m = (e.message || "").toLowerCase();
      err(m.indexOf("invalid") > -1 ? "Email ou mot de passe incorrect."
        : m.indexOf("password") > -1 ? "Le mot de passe doit faire au moins 6 caractères."
        : e.message || "Une erreur est survenue.");
    }
    bouton.disabled = false;
    bouton.textContent = mode === "connexion" ? "Se connecter" : mode === "oubli" ? "Recevoir le lien" : "Créer mon accès";
  };

  $("c-go").addEventListener("click", valider);
  document.addEventListener("keydown", e => { if (e.key === "Enter") valider(); });
}

/* ---------------------- NOUVEAU MOT DE PASSE ----------------------
   Quand le client clique sur le lien recu par email, Supabase le renvoie
   ici avec un jeton dans l'adresse. On lui fait choisir son mot de passe. */
function lireAdresse(){
  const h = (location.hash || "").replace(/^#\/?/, "");
  const p = {};
  h.split("&").forEach(kv => {
    const [k, v] = kv.split("=");
    if (k) p[decodeURIComponent(k)] = decodeURIComponent((v || "").replace(/\+/g, " "));
  });
  return p;
}

function ecranNouveauMotDePasse(jeton){
  document.body.innerHTML = `
  <div class="portail">
    <div class="carte-co">
      <div class="logo">${esc(CONFIG.marque.nom)}</div>
      <div class="sous">${esc(CONFIG.marque.programme)}</div>
      <h2>Choisis ton nouveau mot de passe</h2>
      <div id="co-err"></div>
      <div class="champ"><label for="r-mdp">Nouveau mot de passe</label><input id="r-mdp" type="password" autocomplete="new-password"></div>
      <div class="champ"><label for="r-mdp2">Confirme-le</label><input id="r-mdp2" type="password" autocomplete="new-password"></div>
      <button class="btn" id="r-go">Enregistrer</button>
    </div>
  </div>`;
  const err = (m, ok) => { const e = $("co-err"); e.className = "erreur" + (ok ? " ok" : ""); e.textContent = m; };
  $("r-go").addEventListener("click", async () => {
    const a = $("r-mdp").value, b = $("r-mdp2").value;
    if (a.length < 6){ err("Le mot de passe doit faire au moins 6 caractères."); return; }
    if (a !== b){ err("Les deux mots de passe ne sont pas identiques."); return; }
    const bouton = $("r-go"); bouton.disabled = true; bouton.textContent = "Un instant…";
    try {
      await fetch(CONFIG.supabase.url + "/auth/v1/user", {
        method: "PUT",
        headers: { "apikey": CONFIG.supabase.cle, "Content-Type": "application/json", "Authorization": "Bearer " + jeton },
        body: JSON.stringify({ password: a })
      }).then(async r => { if (!r.ok) throw new Error((await r.json()).msg || "Lien expiré."); });
      err("Mot de passe enregistré. Tu peux te connecter.", true);
      setTimeout(() => { location.hash = ""; location.reload(); }, 1400);
    } catch(e){
      err(e.message || "Ce lien n'est plus valable. Redemande-en un depuis « Mot de passe oublié ».");
      bouton.disabled = false; bouton.textContent = "Enregistrer";
    }
  });
}

/* ---------------------- DÉMARRAGE ---------------------- */
let premiereFois = false;

(async function demarrer(){
  const p = lireAdresse();

  /* lien de reinitialisation recu par email */
  if (p.type === "recovery" && p.access_token){ ecranNouveauMotDePasse(p.access_token); return; }
  if (p.error_description){
    Auth.oublier();
    portail("connexion");
    setTimeout(() => { const e = $("co-err"); if (e){ e.className = "erreur"; e.textContent = p.error_description; } }, 60);
    return;
  }

  Auth.charger();
  const veutSinscrire = (location.hash || "").indexOf("inscription") > -1;
  if (!Auth.connecte()){ portail(veutSinscrire ? "inscription" : "connexion"); return; }
  const ok = await Auth.assurer();
  if (!ok){ portail("connexion"); return; }
  try { await Auth.chargerProfil(); } catch(e){}

  construireNav();
  window.addEventListener("hashchange", routeDepuisAdresse);

  /* Premiere connexion d'un client : on l'envoie remplir son profil */
  if (!Auth.estCoach()){
    const intake = await Store.lire("intake", {});
    if (!intake || !intake.complet){
      premiereFois = true;
      location.hash = "#/profil";
      await afficher("profil");
      const v = $("vue");
      const mot = document.createElement("div");
      mot.className = "bandeau";
      mot.innerHTML = `<strong>Bienvenue !</strong><span class="note">Commence par remplir ton profil : c'est ce qui permet à ton coach de construire ton suivi.</span>`;
      v.insertBefore(mot, v.firstChild);
      return;
    }
  }

  routeDepuisAdresse();
})();
</script>
