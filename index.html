<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateforme MHX Coaching</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<!--
=====================================================================
  PLATEFORME MHX COACHING — fichier unique, autonome
  ---------------------------------------------------------------
  COMMENT S'Y RETROUVER (dans l'ordre du fichier) :

  [A] JETONS DE DESIGN .... couleurs, ombres, thème clair/sombre
  [B] STYLES COMMUNS ...... mise en page, boutons, champs, tableaux
  [C] STYLES DES OUTILS ... styles propres à chaque outil
  [D] CONFIG .............. textes de marque + TOUTES les constantes
                            de calcul (macros, facteurs d'activité,
                            zones de mensuration, modèle de séance)
  [E] BOÎTE À OUTILS ...... helpers, stockage, composant graphique
  [F] OUTILS .............. un objet par outil : id, nom, html, init
  [G] NAVIGATION ......... barre du haut + routage par #ancre
  ---------------------------------------------------------------
  POUR AJOUTER UN 4e OUTIL : copier un objet de la section [F],
  changer id / nom / icone / html() / init(), et l'ajouter au
  tableau OUTILS tout en bas de cette même section. Rien d'autre
  à toucher : la navigation se construit toute seule.
=====================================================================
-->
<style>
/* ==================================================================
   [A] JETONS DE DESIGN
   Change une couleur ici et tout le site suit.
   ================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --ground:#eceef1; --surface:#ffffff; --sunken:#e5e8ec;
  --ink:#0a0d13; --ink-2:#454b57; --ink-3:#767d8b;
  --line:#d8dce2; --line-strong:#b9bfc9;
  --accent:#8a6a1a; --accent-ink:#ffffff; --accent-soft:rgba(138,106,26,.10);
  --good:#006300; --warn:#8a5a12; --bad:#b3312f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --grid:#dfe3e8; --axis:#c3c2b7;
  --nav-bg:rgba(236,238,241,.88);
  --shadow:0 1px 2px rgba(10,13,19,.06),0 8px 24px -12px rgba(10,13,19,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#06090f; --surface:#0f141c; --sunken:#0a0e15;
    --ink:#f2f4f7; --ink-2:#9fa6b3; --ink-3:#6f7683;
    --line:#1e2530; --line-strong:#2c3542;
    --accent:#d3a53c; --accent-ink:#0a0d13; --accent-soft:rgba(211,165,60,.12);
    --good:#0ca30c; --warn:#fab219; --bad:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --grid:#232a34; --axis:#383835;
    --nav-bg:rgba(6,9,15,.88);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#06090f; --surface:#0f141c; --sunken:#0a0e15;
  --ink:#f2f4f7; --ink-2:#9fa6b3; --ink-3:#6f7683;
  --line:#1e2530; --line-strong:#2c3542;
  --accent:#d3a53c; --accent-ink:#0a0d13; --accent-soft:rgba(211,165,60,.12);
  --good:#0ca30c; --warn:#fab219; --bad:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --grid:#232a34; --axis:#383835;
  --nav-bg:rgba(6,9,15,.88);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -16px rgba(0,0,0,.8);
}

/* ==================================================================
   [B] STYLES COMMUNS
   ================================================================== */
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* --- barre de navigation --- */
.topbar{position:sticky;top:0;z-index:20;background:var(--nav-bg);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand .b-name{font-family:"Oswald",Impact,sans-serif;font-weight:600;font-size:19px;letter-spacing:.09em;text-transform:uppercase}
.brand .b-sub{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;
  padding:9px 15px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);
  font-size:14px;font-weight:500;transition:color .15s,border-color .15s,background .15s}
.nav a:hover{color:var(--ink);border-color:var(--line-strong)}
.nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.nav .ico{font-size:15px;line-height:1}

/* --- en-tête d'outil --- */
.masthead{padding:34px 0 24px;margin-bottom:26px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:"Oswald",Impact,sans-serif;font-weight:600;font-size:clamp(29px,5.4vw,44px);line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase}
.lede{color:var(--ink-2);max-width:62ch;margin:0;font-size:15px}

/* --- blocs --- */
main{padding-bottom:70px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:22px}
h2{font-family:"Oswald",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:500;font-size:19px;margin:0 0 16px}
h3{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;font-weight:500}
input,select,textarea{width:100%;background:var(--sunken);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;font-family:"IBM Plex Mono",monospace;font-size:15px;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sunken)}
.seg button{flex:1;background:transparent;border:0;color:var(--ink-2);padding:9px 10px;
  font-family:"IBM Plex Sans",sans-serif;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;
  padding:10px 18px;font-family:"IBM Plex Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
button.ghost:hover{color:var(--ink);border-color:var(--accent)}
.readout{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.hero-num{font-size:clamp(44px,9vw,66px);line-height:1}
.unit{font-size:14px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  text-align:right;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;font-weight:600}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:"IBM Plex Mono",monospace}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.note{font-size:13px;color:var(--ink-3);line-height:1.6}
details{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}
summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500}
summary:hover{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.msg{font-size:13px;color:var(--good);min-height:18px}
.del{background:none;border:1px solid transparent;border-radius:4px;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:6px 9px}
.del:hover{color:var(--bad);border-color:var(--bad)}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:38px 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.tile{background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:14px}
.tile .t-lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .t-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;line-height:1.15;margin-top:4px}
.tile .t-sub{font-size:12px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.pos{color:var(--good)} .neg{color:var(--bad)}
footer{border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;padding-top:20px;padding-bottom:34px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- connexion --- */
.portail{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.carte-co{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:30px;box-shadow:var(--shadow)}
.carte-co .logo{font-family:"Oswald",Impact,sans-serif;font-weight:600;font-size:24px;letter-spacing:.09em;text-transform:uppercase;text-align:center}
.carte-co .sous{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;text-align:center;margin-bottom:22px}
.carte-co h2{text-align:center;font-size:17px;margin-bottom:18px}
.carte-co .champ{margin-bottom:14px}
.carte-co button.btn{width:100%;padding:12px}
.bascule{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-3)}
.bascule button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;font-family:inherit;text-decoration:underline;padding:0}
.erreur{background:var(--accent-soft);border-left:3px solid var(--bad);color:var(--ink-2);font-size:13px;padding:10px 12px;border-radius:0 4px 4px 0;margin-bottom:14px}
.ok{border-left-color:var(--good)}

/* --- barre du haut : compte --- */
.compte{display:flex;align-items:center;gap:10px;margin-left:auto}
.compte .qui{font-size:13px;color:var(--ink-2);white-space:nowrap}
.compte button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink-3);font-size:12px;padding:6px 12px;cursor:pointer;font-family:inherit}
.compte button:hover{color:var(--ink);border-color:var(--accent)}
.etat{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.etat.erreur{color:var(--warn);background:none;border:0;padding:0}

/* --- consultation d'une fiche client --- */
.bandeau{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:12px 16px;margin-bottom:22px}
.bandeau strong{font-size:15px}
.bandeau .sortir{margin-left:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.lecture-seule .panel input,.lecture-seule .panel select,.lecture-seule .panel textarea,
.lecture-seule .panel button,.lecture-seule .panel a.btn{pointer-events:none;opacity:.7}

/* --- programmes --- */
.seance{background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.seance-tete{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.seance-tete > div:first-child{flex:1;min-width:200px}
.ex-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.ex-table th{font-size:10px;padding:0 8px 4px}
.ex-ligne{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:10px;
  display:grid;grid-template-columns:2fr 70px 90px 90px 36px;gap:10px;align-items:end}
.ex-ligne .plein{grid-column:1/-1}
.ex-ligne input{padding:8px 10px;font-size:14px}
.ex-lecture{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 14px;margin-bottom:8px}
.ex-lecture .haut{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}
.ex-lecture .nom{font-weight:600;font-size:15px;flex:1;min-width:160px}
.ex-lecture .chiffre{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);white-space:nowrap}
.ex-lecture .chiffre b{color:var(--ink)}
.ex-lecture .obs{font-size:13px;color:var(--ink-3);margin-top:6px}
.biblio-l{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;background:var(--sunken);
  border:1px solid var(--line);border-radius:5px;margin-bottom:10px}
.biblio-l .nom{font-weight:600}
.biblio-l .actions-b{margin-left:auto;display:flex;gap:8px}
.biblio-l button{background:transparent;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink-2);
  padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.biblio-l button:hover{color:var(--ink);border-color:var(--accent)}
@media (max-width:640px){ .ex-ligne{grid-template-columns:1fr 1fr; } .ex-ligne .nom-c{grid-column:1/-1} }

/* --- liste des clients --- */
.client-l{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;background:var(--sunken);border:1px solid var(--line);border-radius:5px;margin-bottom:10px}
.client-l .nom{font-weight:600;font-size:15px}
.client-l .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.client-l .voir{margin-left:auto;background:transparent;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink-2);padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.client-l .voir:hover{color:var(--ink);border-color:var(--accent)}
.pastille{font-size:11px;font-family:"IBM Plex Mono",monospace;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-3)}

/* ==================================================================
   [C] STYLES DES OUTILS
   ================================================================== */
/* --- outil : calculateur --- */
.obj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.obj{background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:14px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.obj[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.obj .lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-weight:600}
.obj .val{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;margin-top:4px}
.macro{display:flex;flex-direction:column;gap:6px;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:14px}
.macro .m-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.macro .m-name{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.macro .m-g{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.m-sub{font-size:12px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.flag{margin-top:14px;padding:10px 12px;border-left:3px solid var(--warn);background:var(--accent-soft);font-size:13px;color:var(--ink-2);border-radius:0 4px 4px 0}

/* --- outil : mensurations --- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.chartbox{position:relative;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:12px 8px 6px}
svg.chart{display:block;width:100%;height:260px;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;
  padding:8px 10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.tip b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tip .row{display:flex;align-items:center;gap:7px;margin-top:3px}
.tip .sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* --- outil : entraînement --- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 15px;
  font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--ink-2);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.exo{background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:16px;margin-bottom:14px}
.exo-head{display:grid;grid-template-columns:1fr 152px 42px;gap:10px;align-items:end}
.exo-head select{font-size:14px;padding:9px 6px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px}
.set .s-lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.set .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.set input{padding:7px 8px;font-size:14px;text-align:center}
.set .cap{font-size:10px;color:var(--ink-3);text-align:center;margin-top:3px;font-family:"IBM Plex Mono",monospace;letter-spacing:.06em}
.exo-foot{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-size:16px}
.prev{font-size:12px;font-family:"IBM Plex Mono",monospace;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.up{color:var(--good);border-color:var(--good)} .down{color:var(--bad)} .same{color:var(--ink-3)}
.extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.link-a{color:var(--accent);font-size:12px;text-decoration:none}

@media (max-width:560px){
  .panel{padding:16px}
  .topbar .wrap{min-height:56px}
  .exo-head{grid-template-columns:1fr 42px;grid-template-areas:"nom del" "plage plage"}
  .exo-head > div:nth-child(1){grid-area:nom}
  .exo-head > div:nth-child(2){grid-area:plage}
  .exo-head > div:nth-child(3){grid-area:del}
}

/* --- Nutrition : cases a cocher, tuiles de bilan, cartes de repas --- */

/* --- AUTHENTIFICATION -------------------------------------------------
   Petit client maison : aucune librairie externe, tout passe par les
   points d'entree officiels de Supabase. La session est gardee dans le
   navigateur et rafraichie automatiquement. --------------------------- */
const Auth = {
  cleSession: "mhx_session",
  session: null,

  charger(){
    try { this.session = JSON.parse(localStorage.getItem(this.cleSession)); } catch(e){ this.session = null; }
    return this.session;
  },
  memoriser(s){
    if (s && s.access_token){
      s.expire_le = Date.now() + (s.expires_in || 3600) * 1000;
      this.session = s;
      try { localStorage.setItem(this.cleSession, JSON.stringify(s)); } catch(e){}
    }
    return s;
  },
  oublier(){
    this.session = null;
    try { localStorage.removeItem(this.cleSession); } catch(e){}
  },
  connecte(){ return !!(this.session && this.session.access_token); },
  utilisateur(){ return this.session ? this.session.user : null; },

  async appel(chemin, options){
    options = options || {};
    const entetes = Object.assign({
      "apikey": CONFIG.supabase.cle,
      "Content-Type": "application/json"
    }, options.headers || {});
    if (options.avecJeton !== false && this.session && this.session.access_token){
      entetes["Authorization"] = "Bearer " + this.session.access_token;
    }
    const r = await fetch(CONFIG.supabase.url + chemin, {
      method: options.method || "GET",
      headers: entetes,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    const texte = await r.text();
    let data = null;
    try { data = texte ? JSON.parse(texte) : null; } catch(e){ data = texte; }
    if (!r.ok){
      const err = new Error((data && (data.msg || data.message || data.error_description || data.error)) || ("Erreur " + r.status));
      err.statut = r.status;
      throw err;
    }
    return data;
  },

  async rafraichir(){
    if (!this.session || !this.session.refresh_token) return false;
    try {
      const s = await this.appel("/auth/v1/token?grant_type=refresh_token", {
        method: "POST", avecJeton: false, body: { refresh_token: this.session.refresh_token }
      });
      this.memoriser(s); return true;
    } catch(e){ this.oublier(); return false; }
  },
  async assurer(){
    if (!this.connecte()) return false;
    if (this.session.expire_le && Date.now() > this.session.expire_le - 60000) return await this.rafraichir();
    return true;
  },

  async inscrire(email, motdepasse, prenom, nom){
    const s = await this.appel("/auth/v1/signup", {
      method: "POST", avecJeton: false,
      body: { email, password: motdepasse, data: { prenom, nom } }
    });
    if (s && s.access_token) this.memoriser(s);
    return s;
  },
  async connecter(email, motdepasse){
    const s = await this.appel("/auth/v1/token?grant_type=password", {
      method: "POST", avecJeton: false, body: { email, password: motdepasse }
    });
    return this.memoriser(s);
  },
  async motDePasseOublie(email){
    return this.appel("/auth/v1/recover", { method: "POST", avecJeton: false, body: { email } });
  },
  async deconnecter(){
    try { await this.appel("/auth/v1/logout", { method: "POST" }); } catch(e){}
    this.oublier();
    Object.keys(localStorage).forEach(k => { if (k.indexOf("mhx_") === 0) localStorage.removeItem(k); });

    location.reload();
  },

  /* Profil (prenom, nom, role) de la personne connectee */
  profil: null,
  async chargerProfil(){
    const u = this.utilisateur(); if (!u) return null;
    const r = await Auth.appel("/rest/v1/profils?id=eq." + u.id + "&select=*");
    this.profil = (r && r[0]) || null;
    return this.profil;
  },
  estCoach(){ return !!(this.profil && this.profil.role === "coach"); }
};

/* --- STOCKAGE ---------------------------------------------------------
   Meme interface qu'avant (lire / ecrire) : les outils n'ont pas
   conscience du changement. Les donnees vivent maintenant dans la base,
   donc elles suivent le client d'un appareil a l'autre. ---------------- */
const Store = {
  cache: {},
  attente: {},
  idConsulte: null,   // quand le coach consulte la fiche d'un client

  cible(){ return this.idConsulte || (Auth.utilisateur() && Auth.utilisateur().id); },
  lectureSeule(){ return !!this.idConsulte; },

  async lire(cle, defaut){
    const uid = this.cible(); if (!uid) return defaut;
    try {
      const r = await Auth.appel("/rest/v1/donnees?user_id=eq." + uid + "&outil=eq." + encodeURIComponent(cle) + "&select=contenu");
      const contenu = (r && r[0] && r[0].contenu) || null;
      const val = contenu ? Object.assign({}, defaut, contenu) : defaut;
      this.cache[cle] = val;
      return val;
    } catch(e){ return defaut; }
  },

  ecrire(cle, valeur){
    this.cache[cle] = valeur;
    /* seule exception a la lecture seule : le coach ecrit le programme du client */
    if (this.lectureSeule() && !(Auth.estCoach() && (cle === "programme" || cle === "repas"))) return;
    clearTimeout(this.attente[cle]);
    this.attente[cle] = setTimeout(() => this.envoyer(cle, valeur), 700);   // on groupe les frappes
  },
  async envoyer(cle, valeur){
    const uid = this.cible(); if (!uid) return;
    majEtat("enregistrement");
    try {
      await Auth.assurer();
      await Auth.appel("/rest/v1/donnees?on_conflict=user_id,outil", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: [{ user_id: uid, outil: cle, contenu: valeur, maj_le: new Date().toISOString() }]
      });
      majEtat("enregistre");
    } catch(e){ majEtat("erreur"); }
  },

  /* Sauvegarde manuelle : toujours disponible, en plus de la base */
  exporter(){
    const out = {};
    OUTILS.forEach(o => { if (o.cle && this.cache[o.cle]) out[o.cle] = this.cache[o.cle]; });
    return JSON.stringify({ plateforme:"mhx", version:2, donnees: out });
  },
  async importer(texte){
    const p = JSON.parse(texte);
    const d = (p && p.donnees) ? p.donnees : p;
    if (!d || typeof d !== "object") throw new Error("format");
    for (const cle in d){ this.cache[cle] = d[cle]; await this.envoyer(cle, d[cle]); }
    return true;
  }
};

/* ------------------------------------------------------------------
   CATALOGUE PARTAGE — aliments, recettes et programmes prets a l'emploi.
   Ces trois tables vivent dans Supabase : tu peux y ajouter une recette
   ou un programme sans jamais retoucher a ce fichier.
   Tout le monde les lit ; seul le coach peut les modifier.
   ------------------------------------------------------------------ */
const Catalogue = {
  _c: {},
  async lire(table){
    if (this._c[table]) return this._c[table];
    try {
      const r = await Auth.appel("/rest/v1/" + table + "?select=*&order=nom.asc");
      this._c[table] = r || [];
    } catch(e){ this._c[table] = []; }
    /* Secours : si la table est vide — base en pause, import jamais lancé —
       on lit directement le dépôt. Les aliments passent par la MEME
       normalisation que l'import : sans elle, on servirait des plans batis
       sur des etiquettes de regime non verifiees, ce qui est precisement
       le risque que l'import existe pour ecarter. */
    if (!this._c[table].length){
      const fichier = { aliments:"aliments.json", recettes:"recettes.json", programmes_types:"programmes.json" }[table];
      if (fichier){
        try {
          const f = await fetch(CONFIG.nutrition.source_donnees + fichier, { cache: "no-store" });
          if (f.ok){
            const brut = await f.json();
            this._c[table] = (table === "aliments") ? brut.map(a => Normaliser.aliment(a)) : brut;
            this.secours = true;
          }
        } catch(e){}
      }
    }
    return this._c[table];
  },
  aliments(){ return this.lire("aliments"); },
  async recettes(){
    const l = await this.lire("recettes");
    const idx = await this.indexAliments();
    return l.map(r => {
      if ((r.regimes && r.regimes.length) || (r.allergenes && r.allergenes.length)) return r;
      const n = Normaliser.recette(r, idx).fiche;
      return Object.assign({}, r, { allergenes: n.allergenes, regimes: n.regimes });
    });
  },
  programmes(){ return this.lire("programmes_types"); },

  /* index id -> aliment, pour calculer les macros d'une recette */
  async indexAliments(){
    if (this._idx) return this._idx;
    const l = await this.aliments();
    this._idx = {}; l.forEach(a => { this._idx[a.id] = a; });
    return this._idx;
  },

  /* Macros d'une recette, calculees a partir de ses ingredients.
     facteur = 1 -> portion telle qu'ecrite. */
  async macros(recette, facteur){
    const idx = await this.indexAliments();
    const f = facteur || 1;
    const t = { kcal:0, proteines:0, glucides:0, lipides:0, manquants:0 };
    (recette.ingredients || []).forEach(i => {
      const a = idx[i.aliment_id];
      if (!a){ t.manquants++; return; }
      const k = (i.grammes * f) / 100;
      t.kcal      += (+a.kcal      || 0) * k;
      t.proteines += (+a.proteines || 0) * k;
      t.glucides  += (+a.glucides  || 0) * k;
      t.lipides   += (+a.lipides   || 0) * k;
    });
    return t;
  }
};

/* ------------------------------------------------------------------
   NORMALISATION DES DONNEES IMPORTEES
   Les tables nutritionnelles sont fiables sur les chiffres, beaucoup
   moins sur les etiquettes "vegan", "sans gluten" ou les allergenes.
   On ne fait donc jamais confiance aux etiquettes fournies :
   - pour les ALLERGENES, on garde ceux du fichier ET on ajoute ceux
     que le nom trahit (on n'en retire jamais : le doute protege) ;
   - pour les REGIMES, on recalcule tout depuis zero, et en cas de
     doute on refuse le regime plutot que de l'accorder.
   Une erreur ici se traduit par une assiette qu'un client ne peut pas
   manger : c'est le point le plus sensible de toute l'application.
   ------------------------------------------------------------------ */
const Normaliser = {
  /* Les tables officielles melangent les encodages : "pates" peut s'ecrire
     avec un accent circonflexe combinant, "oeufs" avec la ligature œ.
     Un filtre naif passe alors a cote et laisse des pates aux oeufs
     etiquetees vegetaliennes. On aplatit donc tout avant de chercher :
     minuscules, accents retires, ligatures separees. */
  aplatir(t){
    return String(t || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/œ/g, "oe").replace(/æ/g, "ae");
  },

  mots: {
    viande:  /(poulet|poule|boeuf|porc|agneau|mouton|veau|dinde|canard|\boie\b|lapin|cheval|jambon|saucis|lardon|bacon|chorizo|andouill|boudin|rillette|\bpate\b|pate de (foie|campagne)|\bfoie\b|gesier|merguez|viande|volaille|charcuterie|steak|escalope|brochette|kebab|nugget|cordon.?bleu|saindoux|gelatine|graisse (de|d')\s?(dinde|poulet|canard|oie|porc|mouton|boeuf)|bouillon de (boeuf|poule|volaille|viande))/,
    poisson: /(poisson|thon|saumon|cabillaud|colin|merlu|\blieu\b|sardine|maquereau|anchois|truite|hareng|\bsole\b|dorade|\bbar\b|\braie\b|lotte|espadon|surimi|tarama|caviar|crevette|crabe|homard|langoustine|ecrevisse|langouste|tourteau|moule|huitre|coquille|calamar|calmar|poulpe|seiche|bulot|palourde|saint.?jacques|escargot|anguille|carpe|perche|brochet|bigorneau)/,
    laitier: /(\blait\b|laitier|laitiere|fromage|yaourt|yoghourt|beurre|\bcreme\b|petit.suisse|skyr|mascarpone|ricotta|mozzarella|parmesan|emmental|comte\b|gruyere|camembert|roquefort|\bchevre\b|brebis|kefir|faisselle|babeurre|lactose|caseine|petit.lait|\bfeta\b|cheddar|raclette|reblochon|munster|brie\b|bleu d)/,
    oeuf:    /(\boeuf|omelette|mayonnaise|meringue|quiche|\bflan\b|aux oeufs)/,
    miel:    /(\bmiel\b|gelee royale|propolis)/,
    cereale: /(\bble\b|\bpain\b|\bpates\b|\bpate\b|\briz\b|avoine|\borge\b|seigle|epeautre|\bmais\b|semoule|couscous|boulgour|quinoa|sarrasin|millet|farine|biscuit|gateau|cereale|corn.?flakes|muesli|brioche|croissant|pizza|\btarte\b|crepe|gaufre|chapelure|panure|galette|biscotte|viennoiserie|sandwich|burger|wrap\b)/,
    legumineuse: /(lentille|\bpois\b|pois chiche|haricot|\bfeve\b|\bsoja\b|\btofu\b|tempeh|edamame|lupin|arachide|cacahuete)/,
    sucre:   /(\bsucre|sirop|bonbon|confiserie|confiture|chocolat|pate a tartiner|\bsoda\b|\bcola\b|limonade)/,
    porc:    /(\bporc\b|porcin|jambon|lardon|bacon|chorizo|andouill|boudin|rillette|saucisson|saindoux|charcuterie|coppa|pancetta|gelatine)/,
    alcool:  /(\bvin\b|\bbiere\b|alcool|\brhum\b|whisky|vodka|liqueur|\bcidre\b|champagne|kirsch|cognac|armagnac|\bporto\b)/
  },

  allergenesMots: {
    gluten:        /(\bble\b|\bpain\b|\bpates\b|semoule|couscous|boulgour|\borge\b|seigle|epeautre|avoine|farine|biscuit|brioche|croissant|gateau|chapelure|panure|panne|pizza|\btarte\b|crepe|gaufre|biscotte|\bbiere\b|\bmalt\b|viennoiserie|sandwich|burger|nouille|raviol|lasagne|tortilla|pita\b)/,
    crustaces:     /(crevette|crabe|homard|langoustine|ecrevisse|langouste|tourteau)/,
    mollusques:    /(moule|huitre|coquille|calamar|calmar|poulpe|seiche|bulot|palourde|saint.?jacques|escargot|bigorneau|\bcoque\b)/,
    soja:          /(\bsoja\b|\btofu\b|tempeh|edamame|\bmiso\b|tamari)/,
    fruits_a_coque:/(amande|\bnoix\b|noisette|pistache|\bcajou\b|pecan|macadamia|chataigne|\bmarron\b)/,
    arachides:     /(arachide|cacahuete)/,
    sesame:        /(sesame|tahin)/,
    celeri:        /(celeri)/,
    moutarde:      /(moutarde)/,
    lupin:         /(lupin)/
  },

  /* Une mention "sans gluten" sur l'etiquette prime sur le mot "pates" */
  sansGluten: /(sans gluten|sans.?ble)/,

  aliment(a){
    const t = this.aplatir((a.nom || "") + " " + (a.categorie || ""));
    const m = this.mots, cat = a.categorie || "";
    const viande  = m.viande.test(t)  || cat === "Viandes";
    const poisson = m.poisson.test(t) || cat === "Poissons";
    const laitier = m.laitier.test(t) || cat === "Laitages";
    const oeuf    = m.oeuf.test(t)    || cat === "Oeufs";
    const miel    = m.miel.test(t);
    const cereale = m.cereale.test(t) || cat === "Féculents";
    const legum   = m.legumineuse.test(t) || cat === "Légumineuses";
    const sucre   = m.sucre.test(t);
    const porc    = m.porc.test(t);
    const alcool  = m.alcool.test(t);

    /* --- allergenes : on garde ceux du fichier ET on ajoute ceux que le
       nom trahit. On n'en retire jamais : le doute protege. --- */
    const al = {};
    (a.allergenes || []).forEach(x => { al[x] = true; });
    if (laitier) al.lait = true;
    if (oeuf)    al.oeufs = true;
    if (poisson && !this.allergenesMots.crustaces.test(t) && !this.allergenesMots.mollusques.test(t)) al.poissons = true;
    for (const cle in this.allergenesMots){
      if (this.allergenesMots[cle].test(t)) al[cle] = true;
    }
    if (this.sansGluten.test(t)) delete al.gluten;   // seule exception : l'etiquette le dit
    const allergenes = Object.keys(al).filter(x => CONFIG.nutrition.allergenes.some(z => z.id === x));

    /* --- regimes : entierement recalcules, restrictifs en cas de doute --- */
    const a_lait = allergenes.indexOf("lait") > -1, a_oeuf = allergenes.indexOf("oeufs") > -1;
    const a_mer  = ["poissons","crustaces","mollusques"].some(x => allergenes.indexOf(x) > -1);
    const animal = viande || poisson || laitier || oeuf || miel || a_lait || a_oeuf || a_mer;
    const r = ["omnivore"];
    if (!viande && !poisson && !a_mer) r.push("vegetarien");
    if (!animal) r.push("vegan");
    if (!viande) r.push("pescetarien");
    const tubercule = /(patate douce|igname|manioc|topinambour|panais|potimarron|courge|butternut|betterave)/.test(t);
    if ((!cereale || tubercule) && !laitier && !a_lait && !legum && !sucre) r.push("paleo");
    if (allergenes.indexOf("gluten") === -1) r.push("sans_gluten");
    if (!laitier && !a_lait) r.push("sans_lactose");
    if (!porc && !alcool) r.push("sans_porc");

    return {
      id: a.id, nom: a.nom, categorie: a.categorie || null,
      kcal: +a.kcal || 0, proteines: +a.proteines || 0, glucides: +a.glucides || 0,
      lipides: +a.lipides || 0, fibres: +a.fibres || 0,
      portion_g: a.portion_g || null, portion_nom: a.portion_nom || null,
      allergenes: allergenes, regimes: r, source: a.source || null
    };
  },

  /* Les etiquettes d'une recette ne sont jamais reprises du fichier :
     elles se deduisent de ses ingredients. Union des allergenes,
     intersection des regimes. */
  recette(r, idx){
    const al = {}; let reg = null; const manquants = [];
    (r.ingredients || []).forEach(i => {
      const a = idx[i.aliment_id];
      if (!a){ manquants.push(i.aliment_id); return; }
      (a.allergenes || []).forEach(x => { al[x] = true; });
      const s = a.regimes || [];
      reg = reg === null ? s.slice() : reg.filter(x => s.indexOf(x) > -1);
    });
    return {
      fiche: {
        id: r.id, nom: r.nom, moment: r.moment || null, temps_min: r.temps_min || null,
        portions: r.portions || 1, ingredients: r.ingredients || [], etapes: r.etapes || [],
        allergenes: Object.keys(al), regimes: reg || [], source: r.source || null
      },
      manquants: manquants
    };
  }
};

/* ------------------------------------------------------------------
   IMPORT DU CATALOGUE depuis le depot public.
   Le coach declenche, l'application telecharge, normalise et enregistre.
   ------------------------------------------------------------------ */
const Import = {
  async fichier(nom){
    const r = await fetch(CONFIG.nutrition.source_donnees + nom, { cache: "no-store" });
    if (!r.ok) throw new Error("Fichier introuvable : " + nom + " (" + r.status + ")");
    return r.json();
  },
  async envoyer(table, lignes, journal){
    const paquet = 300;
    for (let i = 0; i < lignes.length; i += paquet){
      await Auth.assurer();
      await Auth.appel("/rest/v1/" + table + "?on_conflict=id", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: lignes.slice(i, i + paquet)
      });
      if (journal) journal(table, Math.min(i + paquet, lignes.length), lignes.length);
    }
  }
};

/* --- Composant graphique : courbes + survol. Sert au suivi des mensurations,
       et reste disponible pour tout futur outil. --- */
const Graphique = {
  echelle(min, max){
    if (min === max){ min -= 1; max += 1; }
    const marge = (max-min)*0.12; min -= marge; max += marge;
    let pas = Math.pow(10, Math.floor(Math.log10((max-min)/4)));
    const m = (max-min)/4/pas;
    pas *= m>5 ? 10 : m>2 ? 5 : m>1 ? 2 : 1;
    return { bas: Math.floor(min/pas)*pas, haut: Math.ceil(max/pas)*pas, pas };
  },
  dessiner(idSvg, idTip, series, unite){
    const svg = $(idSvg), tip = $(idTip);
    if (!svg) return;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const boite = svg.parentNode.getBoundingClientRect();
    const W = Math.max(320, boite.width - 16), H = 260;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const NS = "http://www.w3.org/2000/svg";
    const el = (n,a) => { const e = document.createElementNS(NS,n); for (const k in a) e.setAttribute(k,a[k]); return e; };

    const vivantes = series.filter(s => s.points.length > 0);
    if (!vivantes.length){
      const t = el("text",{x:W/2,y:H/2,"text-anchor":"middle",fill:"var(--ink-3)","font-size":14,"font-family":'"IBM Plex Sans",sans-serif'});
      t.textContent = "Enregistre au moins deux semaines pour voir la courbe.";
      svg.appendChild(t); if (tip) tip.style.opacity = 0; return;
    }
    const L=46, R=16, T=14, B=30, pw=W-L-R, ph=H-T-B;
    const xs=[], ys=[];
    vivantes.forEach(s => s.points.forEach(p => { xs.push(p.x); ys.push(p.y); }));
    const x0 = Math.min(...xs); let x1 = Math.max(...xs); if (x0===x1) x1 = x0+1;
    const yr = this.echelle(Math.min(...ys), Math.max(...ys));
    const X = v => L + (v-x0)/(x1-x0)*pw;
    const Y = v => T + ph - (v-yr.bas)/(yr.haut-yr.bas)*ph;

    for (let v=yr.bas; v<=yr.haut+1e-9; v+=yr.pas){
      svg.appendChild(el("line",{x1:L,x2:L+pw,y1:Y(v),y2:Y(v),stroke:"var(--grid)","stroke-width":1}));
      const lb = el("text",{x:L-9,y:Y(v)+4,"text-anchor":"end",fill:"var(--ink-3)","font-size":11,"font-family":'"IBM Plex Mono",monospace'});
      lb.textContent = Math.round(v*10)/10; svg.appendChild(lb);
    }
    svg.appendChild(el("line",{x1:L,x2:L+pw,y1:T+ph,y2:T+ph,stroke:"var(--axis)","stroke-width":1}));
    const pasX = Math.max(1, Math.ceil((x1-x0)/6));
    for (let xv=x0; xv<=x1; xv+=pasX){
      const t = el("text",{x:X(xv),y:T+ph+19,"text-anchor":"middle",fill:"var(--ink-3)","font-size":11,"font-family":'"IBM Plex Mono",monospace'});
      t.textContent = "S"+xv; svg.appendChild(t);
    }
    const croix = el("line",{x1:0,x2:0,y1:T,y2:T+ph,stroke:"var(--line-strong)","stroke-width":1,opacity:0});
    svg.appendChild(croix);

    vivantes.forEach(s => {
      const d = s.points.map((p,i) => (i?"L":"M")+X(p.x)+" "+Y(p.y)).join(" ");
      if (vivantes.length === 1){
        const aire = d + ` L${X(s.points[s.points.length-1].x)} ${T+ph} L${X(s.points[0].x)} ${T+ph} Z`;
        svg.appendChild(el("path",{d:aire,fill:s.couleur,opacity:.10}));
      }
      svg.appendChild(el("path",{d,fill:"none",stroke:s.couleur,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
      const dernier = s.points[s.points.length-1];
      svg.appendChild(el("circle",{cx:X(dernier.x),cy:Y(dernier.y),r:4.5,fill:s.couleur,stroke:"var(--sunken)","stroke-width":2}));
    });

    const reperes = vivantes.map(s => el("circle",{cx:-99,cy:-99,r:4,fill:s.couleur,stroke:"var(--sunken)","stroke-width":2,opacity:0}));
    reperes.forEach(m => svg.appendChild(m));
    const zone = el("rect",{x:L,y:T,width:pw,height:ph,fill:"transparent"});
    svg.appendChild(zone);

    const bouger = ev => {
      const rc = svg.getBoundingClientRect();
      const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rc.left;
      let semaine = Math.round(x0 + (cx/rc.width*W - L)/pw*(x1-x0));
      semaine = Math.max(x0, Math.min(x1, semaine));
      croix.setAttribute("x1", X(semaine)); croix.setAttribute("x2", X(semaine)); croix.setAttribute("opacity", 1);
      let lignes = "", trouve = false;
      vivantes.forEach((s,i) => {
        const pt = s.points.find(p => p.x === semaine);
        if (pt){
          trouve = true;
          reperes[i].setAttribute("cx",X(pt.x)); reperes[i].setAttribute("cy",Y(pt.y)); reperes[i].setAttribute("opacity",1);
          lignes += `<div class="row"><span class="sw" style="background:${s.couleur}"></span>${esc(s.nom)} <b>${n1(pt.y)}</b> ${unite}</div>`;
        } else reperes[i].setAttribute("opacity",0);
      });
      if (!trouve){ tip.style.opacity = 0; return; }
      tip.innerHTML = `<b>Semaine ${semaine}</b>${lignes}`;
      tip.style.opacity = 1;
      let px = X(semaine)/W*rc.width + 8;
      if (px + tip.offsetWidth > rc.width - 4) px = X(semaine)/W*rc.width - tip.offsetWidth - 8;
      tip.style.left = Math.max(4, px) + "px";
      tip.style.top = "14px";
    };
    const quitter = () => { tip.style.opacity = 0; croix.setAttribute("opacity",0); reperes.forEach(m => m.setAttribute("opacity",0)); };
    zone.addEventListener("mousemove", bouger);
    zone.addEventListener("mouseleave", quitter);
    zone.addEventListener("touchstart", bouger, {passive:true});
    zone.addEventListener("touchmove",  bouger, {passive:true});
    zone.addEventListener("touchend",   quitter);
  }
};

        <div class="macro"><div class="m-top"><span class="m-name">Lipides</span><span class="m-g readout" id="g-lip">—</span></div><div class="bar"><i id="b-lip" style="background:var(--s2)"></i></div><span class="m-sub" id="s-lip"></span></div>
        <div class="macro"><div class="m-top"><span class="m-name">Glucides</span><span class="m-g readout" id="g-gluc">—</span></div><div class="bar"><i id="b-gluc" style="background:var(--s3)"></i></div><span class="m-sub" id="s-gluc"></span></div>
      </div>
      <p class="note" style="margin-top:14px">Grammes par jour. Protéines fixées à ${CONFIG.calcul.proteines_g_par_kg} g par kg de poids de corps, lipides à ${CONFIG.calcul.lipides_g_par_kg} g par kg, les glucides complètent le total de calories de ton objectif.</p>
      <div id="flag" class="flag" hidden></div>
      <details>
        <summary>Comment ces chiffres sont calculés</summary>
        <p class="note" style="margin-top:12px"><strong>1. Métabolisme de base</strong> — formule de Mifflin-St Jeor, la référence actuelle :<br><span class="readout" id="f-bmr"></span></p>
        <p class="note"><strong>2. Facteur d'activité</strong> — on part d'une base sédentaire de ${String(CONFIG.calcul.facteur_base).replace(".",",")}, puis on ajoute ton activité réelle :<br><span class="readout" id="f-fact"></span></p>
        <p class="note"><strong>3. Maintenance</strong> = métabolisme de base × facteur d'activité = <span class="readout" id="f-tdee"></span></p>
        <p class="note">Ces formules donnent une estimation solide, pas une vérité absolue. La vraie mesure, c'est la balance : garde le même apport pendant 2 semaines, et si ton poids ne bouge pas dans le sens voulu, ajuste de 150 à 200 kcal.</p>
      </details>
    </section>`;
  },

  /* --- le calcul, isolé pour pouvoir être modifié sans toucher au reste --- */
  metabolismeDeBase(d){
    const b = 10*d.poids + 6.25*d.taille - 5*d.age;
    return d.sexe === "H" ? b + 5 : b - 161;
  },
  facteurActivite(d){
    const c = CONFIG.calcul;
    const parPas    = Math.min(d.pas, c.plafond_pas)/10000 * c.bonus_10000_pas;
    const parHeures = Math.min(d.heures, c.plafond_heures) * c.bonus_par_heure;
    return { total: c.facteur_base + parPas + parHeures, parPas, parHeures };
  },
  macros(kcal, poids){
    const c = CONFIG.calcul;
    const prot = c.proteines_g_par_kg * poids;
    const lip  = c.lipides_g_par_kg  * poids;
    const gluc = (kcal - prot*4 - lip*9) / 4;
    return { prot, lip, gluc: Math.max(gluc, 0), glucBrut: gluc };
  },

  async init(){
    const c = CONFIG.calcul;
    const D = await Store.lire(this.cle, Object.assign({ objectif:"maintien" }, c.valeurs_depart));
    const self = this;
    const sauver = () => Store.ecrire(self.cle, D);

    const rendre = () => {
      const B = self.metabolismeDeBase(D);
      const F = self.facteurActivite(D);
      const T = B * F.total;
      const cibles = { perte: T*(1-c.deficit_perte), maintien: T, prise: T*(1+c.surplus_prise) };

      $("tdee").textContent = fmt(T);
      $("v-perte").textContent = fmt(cibles.perte);
      $("v-maintien").textContent = fmt(cibles.maintien);
      $("v-prise").textContent = fmt(cibles.prise);

      const kc = cibles[D.objectif];
      const m = self.macros(kc, D.poids);
      const flag = $("flag");
      if (m.glucBrut < c.seuil_alerte_glucides){
        flag.hidden = false;
        flag.textContent = "À ce niveau de calories, il ne reste presque plus de place pour les glucides. Baisse les protéines à 2 g/kg ou revois ton objectif à la hausse — s'entraîner dur sans glucides ne tient pas dans la durée.";
      } else flag.hidden = true;

      const kp = m.prot*4, kl = m.lip*9, kg = m.gluc*4, tot = kp+kl+kg || 1;
      $("g-prot").textContent = fmt(m.prot);  $("g-lip").textContent = fmt(m.lip);  $("g-gluc").textContent = fmt(m.gluc);
      $("s-prot").textContent = `${fmt(kp)} kcal · ${Math.round(kp/tot*100)}%`;
      $("s-lip").textContent  = `${fmt(kl)} kcal · ${Math.round(kl/tot*100)}%`;
      $("s-gluc").textContent = `${fmt(kg)} kcal · ${Math.round(kg/tot*100)}%`;
      $("b-prot").style.width = (kp/tot*100)+"%";
      $("b-lip").style.width  = (kl/tot*100)+"%";
      $("b-gluc").style.width = (kg/tot*100)+"%";
      $("obj-name").textContent = { perte:"perte de poids", maintien:"maintien", prise:"prise de masse" }[D.objectif];

      const signe = D.sexe === "H" ? "+ 5" : "− 161";
      $("f-bmr").textContent  = `(10 × ${D.poids}) + (6,25 × ${D.taille}) − (5 × ${D.age}) ${signe} = ${fmt(B)} kcal`;
      $("f-fact").textContent = `${String(c.facteur_base).replace(".",",")} + ${F.parPas.toFixed(2).replace(".",",")} (pas) + ${F.parHeures.toFixed(2).replace(".",",")} (entraînement) = ${F.total.toFixed(2).replace(".",",")}`;
      $("f-tdee").textContent = `${fmt(B)} × ${F.total.toFixed(2).replace(".",",")} = ${fmt(T)} kcal / jour`;
      sauver();
    };

    ["age","taille","poids","pas","heures"].forEach(k => {
      const e = $(k); e.value = D[k];
      e.addEventListener("input", () => { const v = parseFloat(e.value); if (isFinite(v)) D[k] = v; rendre(); });
    });
    $$("#sexe button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.v === D.sexe));
      b.addEventListener("click", () => {
        D.sexe = b.dataset.v;
        $$("#sexe button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === D.sexe)));
        rendre();
      });
    });
    $$("#objs button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.k === D.objectif));
      b.addEventListener("click", () => {
        D.objectif = b.dataset.k;
        $$("#objs button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.k === D.objectif)));
        rendre();
      });
    });
    rendre();
  }
};

  html(){

  async init(){
    const cfg = CONFIG.mensurations, self = this;
    const D = await Store.lire(this.cle, {
      dstart:"", pstart:null,
      zones: cfg.zones.slice(),
      affichees: cfg.zones_affichees_au_depart.slice(),
      mesures: []
    });
    const sauver = () => Store.ecrire(self.cle, D);

    const serieDuPoids = () => {
      const pts = [];
      if (D.pstart != null && isFinite(D.pstart)) pts.push({x:0, y:D.pstart});
      D.mesures.forEach(m => { if (m.poids != null && isFinite(m.poids)) pts.push({x:m.sem, y:m.poids}); });
      return pts.sort((a,b) => a.x-b.x);
    };
    const serieDeZone = i => D.mesures
      .filter(m => m.vals[i] != null && isFinite(m.vals[i]))
      .map(m => ({x:m.sem, y:m.vals[i]}))
      .sort((a,b) => a.x-b.x);

    const construireZones = () => {
      const b = $("zone-edit"); b.innerHTML = "";
      D.zones.forEach((z,i) => {
        const d = document.createElement("div");
        d.innerHTML = `<label for="z${i}">Zone ${i+1}</label><input id="z${i}" type="text">`;
        b.appendChild(d);
        const inp = d.querySelector("input"); inp.value = z;
        inp.addEventListener("input", () => {
          D.zones[i] = inp.value || ("Zone "+(i+1));
          sauver(); construireChips(); construireSaisie(); dessinerTable(); tout();
        });
      });
    };
    const construireSaisie = () => {
      const b = $("entry-zones"); b.innerHTML = "";
      D.zones.forEach((z,i) => {
        const d = document.createElement("div");
        d.innerHTML = `<label for="ez${i}">${esc(z)}</label><input id="ez${i}" type="number" step="0.1" min="0" max="300" placeholder="cm">`;
        b.appendChild(d);
      });
    };
    const semaineSuivante = () => D.mesures.length ? Math.max(...D.mesures.map(m => m.sem)) + 1 : 1;
    const viderFormulaire = () => {
      $("e-sem").value = semaineSuivante();
      $("e-date").value = aujourdhui();
      $("e-poids").value = "";
      D.zones.forEach((z,i) => { const e = $("ez"+i); if (e) e.value = ""; });
    };

    const construireChips = () => {
      const c = $("chips"); c.innerHTML = "";
      D.zones.forEach((z,i) => {
        const rang = D.affichees.indexOf(i), actif = rang > -1;
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", String(actif));
        b.innerHTML = `<span class="dot"${actif ? ` style="background:${self.couleurs[rang]}"` : ""}></span>${esc(z)}`;
        b.addEventListener("click", () => {
          const k = D.affichees.indexOf(i);
          if (k > -1) D.affichees.splice(k,1);
          else {
            if (D.affichees.length >= cfg.max_courbes){ flash("msg", `${cfg.max_courbes} zones maximum à l'écran.`); return; }
            D.affichees.push(i);
          }
          sauver(); construireChips(); tout();
        });
        c.appendChild(b);
      });
    };

    const dessinerKPI = () => {
      const w = serieDuPoids(), dernier = w[w.length-1];
      $("k-poids").textContent = dernier ? n1(dernier.y) : "—";
      $("k-poids-d").textContent = dernier ? ("semaine "+dernier.x) : "Pas encore de mesure";
      const d = $("k-delta");
      if (w.length > 1){
        const dd = w[w.length-1].y - w[0].y;
        d.textContent = (dd > 0 ? "+" : "−") + n1(Math.abs(dd));
        d.className = "t-val readout " + (dd < 0 ? "pos" : dd > 0 ? "neg" : "");
      } else { d.textContent = "—"; d.className = "t-val readout"; }
      let total = 0, trouve = false;
      D.zones.forEach((z,i) => { const s = serieDeZone(i); if (s.length > 1){ total += s[0].y - s[s.length-1].y; trouve = true; } });
      const c = $("k-cm");
      c.textContent = trouve ? ((total >= 0 ? "−" : "+") + n1(Math.abs(total))) : "—";
      c.className = "t-val readout " + (trouve ? (total > 0 ? "pos" : total < 0 ? "neg" : "") : "");
      $("k-sem").textContent = D.mesures.length;
      $("k-sem-sub").textContent = D.mesures.length ? ("dernière : semaine " + D.mesures[D.mesures.length-1].sem) : "Commence cette semaine";
    };

    const dessinerLegende = sel => {
      const l = $("legend"); l.innerHTML = "";
      sel.forEach(s => { const sp = document.createElement("span"); sp.innerHTML = `<i style="background:${s.couleur}"></i>${esc(s.nom)}`; l.appendChild(sp); });
    };

    const dessinerTable = () => {
      const th = $("thead"), tb = $("tbody");
      th.innerHTML = `<tr><th>Semaine</th><th>Date</th><th>Poids</th>${D.zones.map(z => `<th>${esc(z)}</th>`).join("")}<th></th></tr>`;
      tb.innerHTML = "";
      if (!D.mesures.length){
        tb.innerHTML = `<tr><td colspan="${D.zones.length+4}" class="empty">Aucune mesure enregistrée pour le moment.</td></tr>`;
        return;
      }
      D.mesures.forEach((m, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>S${m.sem}</td><td>${esc(m.date || "—")}</td><td>${m.poids != null ? n1(m.poids) : "—"}</td>` +
          D.zones.map((z,i) => `<td>${(m.vals[i] != null && isFinite(m.vals[i])) ? n1(m.vals[i]) : "—"}</td>`).join("") +
          `<td><button class="del" aria-label="Supprimer la semaine ${m.sem}">×</button></td>`;
        tr.querySelector(".del").addEventListener("click", () => {
          D.mesures.splice(idx,1); sauver(); dessinerTable(); tout(); viderFormulaire();
        });
        tb.appendChild(tr);
      });
    };

    const tout = () => {
      dessinerKPI();
      Graphique.dessiner("chart-poids","tip-poids",[{nom:"Poids",couleur:"var(--s1)",points:serieDuPoids()}],"kg");
      const sel = D.affichees.map((i,k) => ({nom:D.zones[i], couleur:self.couleurs[k], points:serieDeZone(i)}));
      Graphique.dessiner("chart-mens","tip-mens", sel, "cm");
      dessinerLegende(sel.filter(s => s.points.length));
    };

    $("dstart").value = D.dstart || "";
    $("pstart").value = D.pstart == null ? "" : D.pstart;
    $("dstart").addEventListener("input", function(){ D.dstart = this.value; sauver(); });
    $("pstart").addEventListener("input", function(){ const v = parseFloat(this.value); D.pstart = isFinite(v) ? v : null; sauver(); tout(); });

    $("add").addEventListener("click", () => {
      const sem = parseInt($("e-sem").value, 10);
      const poids = parseFloat($("e-poids").value);
      if (!isFinite(sem)){ flash("msg","Indique un numéro de semaine."); return; }
      const vals = {}; let une = false;
      D.zones.forEach((z,i) => { const v = parseFloat($("ez"+i).value); if (isFinite(v)){ vals[i] = v; une = true; } });
      if (!isFinite(poids) && !une){ flash("msg","Renseigne au moins ton poids ou une mensuration."); return; }
      D.mesures = D.mesures.filter(m => m.sem !== sem);
      D.mesures.push({ sem, date: $("e-date").value || "", poids: isFinite(poids) ? poids : null, vals });
      D.mesures.sort((a,b) => a.sem - b.sem);
      sauver(); viderFormulaire(); dessinerTable(); tout();
      flash("msg", `Semaine ${sem} enregistrée.`);
    });

    construireZones(); construireSaisie(); construireChips(); dessinerTable(); viderFormulaire(); tout();

    let t; const redim = () => { clearTimeout(t); t = setTimeout(tout, 150); };
    window.addEventListener("resize", redim);
    return () => window.removeEventListener("resize", redim);
  }
};

      if (!sc.ex.length){ box.innerHTML = '<div class="empty">Aucun exercice. Ajoute le premier ci-dessous.</div>'; return; }

      sc.ex.forEach((e,i) => {
        const d = document.createElement("div"); d.className = "exo";
        const options = Object.keys(cfg.plages)
          .map(p => `<option value="${p}"${p === e.plage ? " selected" : ""}>${p} reps</option>`).join("");
        const series = e.series.map((s,j) => `
          <div class="set">
            <div class="s-lbl">Série ${j+1}</div>
            <div class="pair">
              <input type="number" min="0" max="100" step="1" placeholder="reps" value="${esc(s.r)}" data-e="${i}" data-s="${j}" data-f="r">
              <input type="number" min="0" step="0.5" placeholder="kg" value="${esc(s.c)}" data-e="${i}" data-s="${j}" data-f="c">
            </div>
            <div class="cap">reps · kg</div>
          </div>`).join("");
        const prec = dernierExercice(D.courante, e.nom);
        let badge = "";
        if (prec){
          const v = self.volumeExercice(e), delta = v - prec.vol;
          const cls = v === 0 ? "same" : delta > 0 ? "up" : delta < 0 ? "down" : "same";
          badge = `<span class="prev ${cls}">Dernière fois : ${fmt(prec.vol)} kg de volume · max ${fmt(prec.max)} kg</span>`;
        }
        d.innerHTML = `
          <div class="exo-head">
            <div><label>Exercice</label><input type="text" placeholder="Ex. Développé couché" value="${esc(e.nom)}" data-e="${i}" data-f="nom"></div>
            <div><label>Répétitions</label><select data-e="${i}" data-f="plage">${options}</select></div>
            <div><button class="del" data-del="${i}" aria-label="Supprimer cet exercice">×</button></div>
          </div>
          <div class="sets">${series}</div>
          <div class="extra">
            <div><label>Observations</label><input type="text" placeholder="Sensations, douleurs, technique…" value="${esc(e.obs)}" data-e="${i}" data-f="obs"></div>
            <div><label>Lien vidéo</label><input type="url" placeholder="https://" value="${esc(e.lien)}" data-e="${i}" data-f="lien"></div>
          </div>
          <div class="exo-foot">
            <span class="stat">Volume <b>${fmt(self.volumeExercice(e))}</b> kg</span>
            <span class="stat">Charge max <b>${fmt(self.chargeMax(e))}</b> kg</span>
            ${badge}
            ${e.lien ? `<a class="link-a" href="${esc(e.lien)}" target="_blank" rel="noopener">Voir la vidéo →</a>` : ""}
          </div>`;
        box.appendChild(d);
      });

      $$("[data-f]", box).forEach(el => {
        const evt = el.tagName === "SELECT" ? "change" : "input";
        el.addEventListener(evt, () => {
          const e = D.seances[D.courante].ex[+el.dataset.e], f = el.dataset.f;
          if (f === "r" || f === "c") e.series[+el.dataset.s][f] = el.value;
          else e[f] = el.value;
          sauver(); dessinerKPI();
          if (f === "nom" || f === "plage" || f === "lien"){
            const pos = el.selectionStart;
            construireExercices();
            const rendu = $("exos").querySelector(`[data-e="${el.dataset.e}"][data-f="${f}"]`);
            if (rendu){ rendu.focus(); try { rendu.setSelectionRange(pos, pos); } catch(x){} }
          } else rafraichirPied(+el.dataset.e);
        });
      });
      $$("[data-del]", box).forEach(b => {
        b.addEventListener("click", () => {
          D.seances[D.courante].ex.splice(+b.dataset.del, 1);
          sauver(); construireExercices(); dessinerKPI();
        });
      });
    };

    const rafraichirPied = i => {
      const e = D.seances[D.courante].ex[i];
      const carte = $("exos").children[i]; if (!carte) return;
      const st = carte.querySelectorAll(".exo-foot .stat b");
      if (st[0]) st[0].textContent = fmt(self.volumeExercice(e));
      if (st[1]) st[1].textContent = fmt(self.chargeMax(e));
      const pv = carte.querySelector(".prev"), prec = dernierExercice(D.courante, e.nom);
      if (pv && prec){
        const v = self.volumeExercice(e), delta = v - prec.vol;
        pv.className = "prev " + (v === 0 ? "same" : delta > 0 ? "up" : delta < 0 ? "down" : "same");
      }
    };

    const dessinerKPI = () => {
      const sc = D.seances[D.courante];
      const vol = self.volumeSeance(sc);
      const series = sc.ex.reduce((n,e) => n + self.seriesRemplies(e), 0);
      $("k-vol").textContent = fmt(vol);
      $("k-set").textContent = series;
      const h = derniereSeance(D.courante), c = $("k-cmp"), cs = $("k-cmp-s");
      if (h && h.vol > 0 && vol > 0){
        const delta = vol - h.vol, pct = Math.round(delta / h.vol * 100);
        c.textContent = (delta > 0 ? "+" : delta < 0 ? "−" : "") + Math.abs(pct) + "%";
        c.className = "t-val readout " + (delta > 0 ? "pos" : delta < 0 ? "neg" : "");
        cs.textContent = `dernière : ${fmt(h.vol)} kg le ${h.date || "—"}`;
      } else {
        c.textContent = "—"; c.className = "t-val readout";
        cs.textContent = h ? `dernière : ${fmt(h.vol)} kg` : "Aucun historique";
      }
    };

    const dessinerHistorique = () => {
      const tb = $("hist"); tb.innerHTML = "";
      if (!D.historique.length){
        tb.innerHTML = '<tr><td colspan="6" class="empty">Aucune séance enregistrée pour le moment.</td></tr>';
        return;
      }
      D.historique.slice().reverse().forEach(h => {
        const idx = D.historique.indexOf(h);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(h.date)}</td><td>${esc(h.nom)}</td><td>${h.exos.length}</td><td>${h.series || 0}</td><td>${fmt(h.vol)} kg</td>` +
                       `<td><button class="del" aria-label="Supprimer cette séance">×</button></td>`;
        tr.querySelector(".del").addEventListener("click", () => {
          D.historique.splice(idx,1); sauver(); dessinerHistorique(); construireExercices(); dessinerKPI();
        });
        tb.appendChild(tr);
      });
    };

    $("addexo").addEventListener("click", () => {
      D.seances[D.courante].ex.push(self.nouvelExercice("10-12"));
      sauver(); construireExercices();
    });
    $("snom").addEventListener("input", function(){ D.seances[D.courante].nom = this.value; sauver(); construireOnglets(); });
    $("sdate").addEventListener("input", function(){ D.date = this.value; sauver(); });

    $("savesess").addEventListener("click", () => {
      const sc = D.seances[D.courante];
      const vol = self.volumeSeance(sc);
      if (vol <= 0){ flash("msg","Remplis au moins une série (reps et charge) avant d'enregistrer."); return; }
      const exos = []; let series = 0;
      sc.ex.forEach(e => {
        if (self.volumeExercice(e) > 0){
          exos.push({ nom: e.nom || "Sans nom", vol: self.volumeExercice(e), max: self.chargeMax(e) });
          series += self.seriesRemplies(e);
        }
      });
      D.historique.push({ date: $("sdate").value || aujourdhui(), si: D.courante, nom: sc.nom, exos, series, vol });
      D.historique.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      sauver(); dessinerHistorique(); construireExercices(); dessinerKPI();
      flash("msg","Séance enregistrée. Tes charges restent affichées pour la prochaine fois.");
    });

    $("sdate").value = D.date || aujourdhui();
    $("snom").value = D.seances[D.courante].nom;
    construireOnglets(); construireExercices(); dessinerHistorique(); dessinerKPI();
  }
};

const outilProfil = {
  id: "profil",
  cle: "intake",
  nom: "Mon profil",
  icone: "📝",
  titre: "Ton profil",
  accroche: "Plus tes réponses sont précises, plus ton programme sera adapté. Ne cherche pas la bonne réponse : cherche la vraie. Compte 10 à 15 minutes.",

  champ(q, valeur){
    const v = valeur == null ? "" : valeur;
    if (q.type === "echelle"){
      let o = '<option value="">—</option>';
      for (let n = 1; n <= 10; n++) o += `<option value="${n}"${String(v) === String(n) ? " selected" : ""}>${n}</option>`;
      return `<select id="q-${q.id}" data-q="${q.id}">${o}</select>`;
    }
    if (q.type === "select"){
      return `<select id="q-${q.id}" data-q="${q.id}">
        <option value=""${v === "" ? " selected" : ""}>— choisis —</option>
        ${q.options.map(o => `<option value="${esc(o)}"${v === o ? " selected" : ""}>${esc(o)}</option>`).join("")}
      </select>`;
    }
    if (q.type === "multi"){
      const choisis = String(v || "").split("|").filter(Boolean);
      return `<div class="coches" id="q-${q.id}" data-q="${q.id}" data-multi="1">` +
        q.options.map(o => `<label class="coche"><input type="checkbox" value="${esc(o)}"${choisis.indexOf(o) > -1 ? " checked" : ""}> ${esc(o)}</label>`).join("") +
        `</div>`;
    }
    if (q.type === "long")   return `<textarea id="q-${q.id}" data-q="${q.id}" rows="${q.grand ? 6 : 2}">${esc(v)}</textarea>`;
    if (q.type === "nombre") return `<input id="q-${q.id}" data-q="${q.id}" type="number" step="0.1" value="${esc(v)}">`;
    if (q.type === "date")   return `<input id="q-${q.id}" data-q="${q.id}" type="date" value="${esc(v)}">`;
    return `<input id="q-${q.id}" data-q="${q.id}" type="text" value="${esc(v)}">`;
  },

  html(){
    const D = Store.cache["intake"] || {};
    let corps = "", ouverte = false;
    QUESTIONS.forEach(q => {
      if (q.section){
        if (ouverte) corps += `</div></section>`;
        corps += `<section class="panel"><h2>${esc(q.section)}</h2><div class="grid g2">`;
        ouverte = true;
        return;
      }
      if (q.soustitre){
        corps += `<div style="grid-column:1/-1"><h3 style="margin-top:8px">${esc(q.soustitre)}</h3>${q.aide ? `<p class="note" style="margin:-4px 0 0">${esc(q.aide)}</p>` : ""}</div>`;
        return;
      }
      const large = (q.type === "long" || q.grand) ? ' style="grid-column:1/-1"' : "";
      corps += `<div${large}>
        <label for="q-${q.id}">${esc(q.label)}${q.requis ? " *" : ""}</label>
        ${q.aide ? `<p class="note" style="margin:-2px 0 8px">${esc(q.aide)}</p>` : ""}
        ${this.champ(q, D[q.id])}</div>`;
    });
    if (ouverte) corps += `</div></section>`;
    return corps + `
    <section class="panel">
      <div class="actions">
        <button class="btn" id="p-save">Enregistrer mon profil</button>
        <span class="msg" id="p-msg"></span>
      </div>
      <p class="note" style="margin-top:10px">Les questions marquées d'une étoile sont indispensables. Tu peux revenir modifier tes réponses à tout moment.</p>
    </section>`;
  },

  /* lit la valeur d'un champ ; les cases a cocher sont stockees "A|B|C" */
  valeur(q){
    const el = $("q-" + q.id); if (!el) return "";
    if (q.type === "multi") return $$("input:checked", el).map(c => c.value).join("|");
    return el.value;
  },
  poser(q, v){
    const el = $("q-" + q.id); if (!el || v == null) return;
    if (q.type === "multi"){
      const choisis = String(v).split("|");
      $$("input", el).forEach(c => { c.checked = choisis.indexOf(c.value) > -1; });
      return;
    }
    if (el.value !== v) el.value = v;
  },

  async init(){
    const D = await Store.lire(this.cle, {});
    Store.cache[this.cle] = D;

    /* si le cache etait vide au moment du rendu, on re-remplit les champs */
    QUESTIONS.forEach(q => { if (q.id) this.poser(q, D[q.id]); });

    const enregistrer = () => {
      QUESTIONS.forEach(q => { if (!q.id) return; const el = $("q-" + q.id); if (el) D[q.id] = this.valeur(q); });
      const manquants = QUESTIONS.filter(q => q.requis && !D[q.id]);
      D.complet = manquants.length === 0;
      Store.ecrire(this.cle, D);
      return manquants;
    };

    $$("[data-q]").forEach(el => el.addEventListener("change", () => enregistrer()));
    $$('[data-multi="1"] input').forEach(c => c.addEventListener("change", () => enregistrer()));

    $("p-save").addEventListener("click", () => {
      const manquants = enregistrer();
      if (manquants.length){
        flash("p-msg", "Il manque : " + manquants.map(q => q.label).join(", "));
        return;
      }
      flash("p-msg", "Profil enregistré. Ton coach le voit de son côté.");
      if (premiereFois){ premiereFois = false; setTimeout(() => { location.hash = "#/calculateur"; }, 900); }
    });
  }
};

  exoVide(){ return { nom:"", series:"", reps:"", repos:"", tempo:"", note:"", lien:"" }; },

  /* ---------- vue client : lecture ---------- */
  vueLecture(P){

      return `<section class="panel"><div class="empty">Ton coach n'a pas encore déposé ton programme. Tu recevras un message quand il sera prêt.</div></section>`;

    let h = "";

    P.seances.forEach(sc => {
