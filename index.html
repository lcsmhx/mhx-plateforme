/* v34 — ordre de la navigation client : Accueil · Mon programme · Nutrition ·
   Ma progression · Mon bilan (devient « Mon suivi » en phase 8) · Speed
   Formation · Mes compléments · Profil. Les outils du coach suivent. Les ids
   (adresses #/…) ne changent pas : tous les liens existants restent valables. */
const OUTILS = [outilAccueil, outilProgramme, outilNutrition, outilMensurations, outilSuivi, outilBilan, outilFormation, outilComplements, outilProfil, outilTableau, outilClients, outilAtelier, outilBibliotheque, outilCatalogue, outilCalculateur, outilEntrainement];

/* Adresses d'hier et de demain : #/progression ouvre « Ma progression »,
   #/suivi ouvre le bilan (puis « Mon suivi » quand il existera). */
const ALIAS_ROUTES = { progression: "mensurations", repas: "nutrition", home: "accueil" };

/* ==================================================================
   [G] NAVIGATION, CONNEXION ET DEMARRAGE
   Chaque outil a sa propre adresse : #/calculateur, #/mensurations,
   #/entrainement. Le coach voit en plus #/clients.
   ================================================================== */
let courant = OUTILS[0].id;
let nettoyage = null;
let affichage = 0;   // numero du dernier affichage demande

function outilsVisibles(){
  /* role: "coach"      -> outil du coach, quitte la fiche client quand on l'ouvre
     masque_client: true -> outil du coach, mais qui reste dans la fiche du client
     client_seul: true   -> outil du client ; le coach ne le voit qu'en consultant une fiche */
  return OUTILS.filter(o => (!o.role || (o.role === "coach" && Auth.estCoach()))
                         && (!o.masque_client || Auth.estCoach())
                         && (!o.client_seul || !Auth.estCoach() || Store.idConsulte));
}

/* v40 — MODE GRATUIT. Un prospect (Auth.estProspect) n'a d'ouverts que les
   onglets de CONFIG.marque.gratuit_ouverts ; tous les autres affichent un
   cadenas, ce que l'accompagnement apporte et « Réserver mon appel ». Liste
   blanche : un onglet ajoute plus tard est verrouille par defaut. Le coach
   qui consulte une fiche voit tout. */
function estVerrouille(o){
  if (!o || o.role === "coach" || Store.idConsulte || !Auth.estProspect()) return false;
  const ouverts = (CONFIG.marque && CONFIG.marque.gratuit_ouverts) || ["accueil", "formation", "profil"];
  return ouverts.indexOf(o.id) === -1;
}
function cadenasNav(o){ return estVerrouille(o) ? `<span class="nav-cadenas" aria-hidden="true">${SVG.cadenas}</span><span class="sr-only"> (${esc(trad("verrouillé"))})</span>` : ""; }
const AVANTAGES = {
  programme: "Ton programme d'entraînement sur mesure, construit et ajusté par ton coach.",
  nutrition: "Ta diète personnalisée, tes repas du jour et ta liste de courses.",
  mensurations: "Ton poids, tes mensurations et ta composition corporelle, semaine après semaine.",
  suivi: "Ta régularité, tes objectifs du mois, ton bilan de la semaine et les retours de ton coach.",
  bilan: "Ton bilan du mois, préparé avec ton coach.",
  complements: "Tes compléments conseillés, avec les doses et les moments."
};
function pageVerrouillee(o){
  const plus = AVANTAGES[o.id];
  return `<section class="panel">${UI.verrou({ titre: trad(nomOnglet(o)), texte: trad("Cette fonctionnalité est disponible avec l'accompagnement MHX."), lien: CONFIG.marque.calendly, cta: trad("Réserver mon appel") })}
    ${plus ? `<p class="note verrou-plus">${esc(trad(plus))}</p>` : ""}</section>`;
}

/* La page d'arrivee : le coach tombe sur ses clients, le client sur son accueil. */
function outilParDefaut(){
  const v = outilsVisibles();
  if (Auth.estCoach() && !Store.idConsulte){ if (v.some(o => o.id === "tableau")) return "tableau"; if (v.some(o => o.id === "clients")) return "clients"; }
  return v[0].id;
}

/* Les onglets de la barre du bas (telephone) : quatre au plus, le reste
   derriere « Plus ». En consultation d'une fiche, ce sont ceux du client. */
function outilsPrincipaux(){
  const v = outilsVisibles();
  const coach = Auth.estCoach() && !Store.idConsulte;
  /* v40 : un prospect voit d'abord ce qui lui est ouvert (accueil, formation,
     profil), puis un onglet verrouille ; le reste derriere « Plus » */
  if (!coach && v.some(o => estVerrouille(o))){
    return v.filter(o => !o.masque_nav && !estVerrouille(o)).concat(v.filter(o => o.principal && estVerrouille(o))).slice(0, 4);
  }
  return v.filter(o => coach ? o.principal_coach : o.principal).slice(0, 4);
}
function iconeOutil(o){
  return ICONES[o.id] ? `<span class="ico" aria-hidden="true">${ICONES[o.id]}</span>` : `<span class="ico" aria-hidden="true">${o.icone || ""}</span>`;
}

/* « Mon programme » devient « Son programme » quand le coach consulte
   une fiche : le meme mot pour deux personnes differentes, c'est ce qui
   fait qu'on ne sait plus chez qui on ecrit. */
function nomOnglet(o){
  /* Les outils du coach gardent leur nom : « Mes clients » ne devient
     jamais « Ses clients ». Seuls les outils qui affichent les donnees
     d'un client changent de possessif. */
  if (!Store.idConsulte || o.role === "coach") return o.nom;
  return o.nom.replace(/^Mon /, "Son ").replace(/^Mes /, "Ses ").replace(/^Ma /, "Sa ");
}

function construireNav(){
  const nav = $("nav");
  /* le coach hors fiche : ses outils d'abord, ses propres onglets client ensuite */
  const coachSeul = Auth.estCoach() && !Store.idConsulte;
  const visibles = outilsVisibles().filter(o => !o.masque_nav);
  const ordre = coachSeul ? visibles.filter(o => o.role === "coach").concat(visibles.filter(o => o.role !== "coach")) : visibles;
  nav.innerHTML = ordre.map(o =>
    `<a href="#/${o.id}" data-id="${o.id}">${iconeOutil(o)}${esc(nomOnglet(o))}${cadenasNav(o)}</a>`
  ).join("");
  construireBarreBas();
  $("brand-name").textContent = CONFIG.marque.nom;
  const sub = $("brand-sub");
  sub.textContent = CONFIG.marque.programme || "";
  sub.hidden = !CONFIG.marque.programme;
  const lg = $("brand-logo");
  if (CONFIG.marque.logo){
    lg.src = CONFIG.marque.logo;
    lg.alt = CONFIG.marque.nom;
    lg.style.height = (CONFIG.marque.logo_hauteur || 34) + "px";
    lg.hidden = false;
  } else lg.hidden = true;
  $("foot-left").textContent  = CONFIG.marque.programme ? `${CONFIG.marque.programme} — ${CONFIG.marque.nom}` : CONFIG.marque.nom;
  $("foot-right").innerHTML   = `Une question ? <a href="${CONFIG.marque.instagram}" target="_blank" rel="noopener">${esc(CONFIG.marque.pseudo)}</a> · ${esc(CONFIG.marque.email)}` + (CONFIG.marque.version ? ` · <span class="version">v${esc(CONFIG.marque.version)}</span>` : "");

  const p = Auth.profil, u = Auth.utilisateur();
  const nom = p && (p.prenom || p.nom) ? ((p.prenom || "") + " " + (p.nom || "")).trim() : (u ? u.email : "");
  $("qui").textContent = nom + (Auth.estCoach() ? " · coach" : "");
  $("compte").hidden = false;
  $("deco").onclick = () => Auth.deconnecter();
  const bl = $("langue");
  if (bl){
    bl.textContent = libelleLangue();
    bl.title = I18N.langue === "en" ? "Passer en français" : "Switch to English";
    bl.onclick = basculerLangue;
  }

}

/* --- barre du bas (telephone) --- */
function construireBarreBas(){
  let b = $("barre-bas");
  if (!b){ b = document.createElement("nav"); b.id = "barre-bas"; b.className = "barre-bas"; b.setAttribute("aria-label", "Navigation"); document.body.appendChild(b); }
  const principaux = outilsPrincipaux();
  const autres = outilsVisibles().filter(o => principaux.indexOf(o) === -1 && !o.masque_nav);
  b.innerHTML = principaux.map(o =>
    `<a href="#/${o.id}" data-id="${o.id}"${estVerrouille(o) ? ' class="verrouille"' : ""}>${iconeOutil(o)}<span class="lbl">${esc(nomCourt(o))}</span>${cadenasNav(o)}</a>`).join("") +
    (autres.length ? `<button type="button" data-plus><span class="ico" aria-hidden="true">${ICONES.plus}</span><span class="lbl">Plus</span></button>` : "");
  const plus = b.querySelector("[data-plus]");
  if (plus) plus.addEventListener("click", () => {
    UI.volet({ titre: trad("Tout mon espace"), corps: `<ul class="menu-plus">` + autres.map(o =>
      `<li><a href="#/${o.id}" data-id="${o.id}"${courant === o.id ? ' aria-current="page"' : ""}>${iconeOutil(o)}<span>${esc(nomOnglet(o))}${cadenasNav(o)}</span></a></li>`).join("") + `</ul>` });
    /* un clic sur un lien du volet le referme */
    setTimeout(() => $$(".volet .menu-plus a").forEach(a => a.addEventListener("click", () => UI.fermer())), 0);
  });
  b.hidden = !Auth.connecte();
}
/* le libelle sous l'icone, court : « Programme » plutot que « Mon programme » */
function nomCourt(o){
  return nomOnglet(o).replace(/^(Mon|Mes|Ma|Son|Ses|Sa) /, "").replace(/^./, c => c.toUpperCase());
}

function marquerNav(id){
  $$("#barre-bas a, .menu-plus a").forEach(a => { if (a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const plus = document.querySelector("#barre-bas [data-plus]");
  if (plus) plus.classList.toggle("ici", !outilsPrincipaux().some(o => o.id === id));
  $$("#nav a").forEach(a => {
    if (a.dataset.id === id){
      a.setAttribute("aria-current","page");
      /* sur telephone, l'onglet ouvert peut etre hors de l'ecran */
      try { a.scrollIntoView({ block:"nearest", inline:"nearest" }); } catch(e){}
    }
    else a.removeAttribute("aria-current");
  });
  setTimeout(majFondus, 80);
}

/* Le degrade a droite des barres d'onglets dit « il y a une suite ». On
   l'enleve quand on est au bout, ou quand tout tient a l'ecran. */
function majFondus(){
  document.querySelectorAll(".nav, .jours-onglets").forEach(el => {
    el.classList.toggle("fin", el.scrollLeft + el.clientWidth >= el.scrollWidth - 4);
  });
}
document.addEventListener("scroll", e => {
  const t = e.target;
  if (t && t.classList && (t.classList.contains("nav") || t.classList.contains("jours-onglets"))) majFondus();
}, true);
document.addEventListener("click", () => setTimeout(majFondus, 80), true);
window.addEventListener("resize", () => setTimeout(majFondus, 80));

function bandeauConsultation(){
  if (!Store.idConsulte) return "";
  /* Sans ces boutons, le coach atterrit sur une page et ne devine pas que
     tout le reste de la fiche est accessible par les onglets du haut.
     Un mode implicite est un mode qu'on ne trouve pas. */
  const actions = [
    { id:"accueil",      nom:"Fiche" },
    { id:"bilan",        nom:"Préparer le call" },
    { id:"suivi",        nom:"Son suivi" },
    { id:"profil",       nom:"Son questionnaire" },
    { id:"programme",    nom:"Son programme",  fort:true },
    { id:"nutrition",    nom:"Ses repas",      fort:true },
    { id:"calculateur",  nom:"Ses calories", fort:true },
    { id:"mensurations", nom:"Ses courbes" },
    { id:"entrainement", nom:"Ses séances" }
  ];
  return `<div class="bandeau">
    <div class="bandeau-tete">
      <strong>Fiche de ${esc(Store.nomConsulte || "ce client")}</strong>
      <span class="note">Tu vois ses données. Tu écris pour lui dans les boutons dorés, dans « Préparer le call » (ton feedback) et dans la fiche (tes notes privées, qu'il ne voit jamais).</span>
    </div>
    <div class="bandeau-actions">
      ${actions.map(a => `<a href="#/${a.id}" class="b-act${a.fort ? " fort" : ""}${courant === a.id ? " ici" : ""}">${esc(a.nom)}</a>`).join("")}
      <button class="sortir" type="button" id="sortir-fiche">Revenir à mes clients</button>
    </div>
  </div>`;
}

async function afficher(id, silencieux){
  const jeton = ++affichage;
  const dispo = outilsVisibles();
  const outil = dispo.find(o => o.id === id) || dispo.find(o => o.id === outilParDefaut()) || dispo[0];
  courant = outil.id;
  if (nettoyage){ nettoyage(); nettoyage = null; }

  if (outil.role === "coach"){ Store.oublier(Store.idConsulte); Store.idConsulte = null; Store.nomConsulte = null; }

  /* Le bloc « Mes donnees » (export, restauration, suppression) ne vit plus
     qu'au bas du Profil : le repeter sous chaque page alourdissait tout. */
  const avecDonnees = outil.id === "profil" && !Store.idConsulte;
  const verrouille = estVerrouille(outil);   // v40 : mode gratuit
  $("vue").innerHTML = `
    ${bandeauConsultation()}
    ${outil.sans_entete ? "" : `<header class="masthead">
      <span class="eyebrow">${Store.idConsulte ? esc(Store.nomConsulte || "client") + " — " : (CONFIG.marque.programme ? esc(CONFIG.marque.programme) + " — " : "")}${esc(nomOnglet(outil))}</span>
      <h1>${Store.idConsulte ? esc(nomOnglet(outil)) : esc(outil.titre)}</h1>
      ${Store.idConsulte ? "" : `<p class="lede">${esc(outil.accroche)}</p>`}
    </header>`}
    ${verrouille ? pageVerrouillee(outil) : outil.html()}
    ${avecDonnees ? blocSauvegarde() : ""}
    ${bandeauInstallation()}`;

  construireNav();   // les libelles dependent du mode : on les rafraichit
  /* Les outils que le coach REMPLIT depuis la fiche d'un client. Oublier
     d'inscrire un outil ici le rend muet : la page passe en lecture seule et
     tous ses boutons deviennent inertes, sans message d'erreur. */
  /* « bilan » y figure pour ses liens et, depuis la v38, pour les feedbacks ;
     « accueil » (la fiche) pour les notes privees, qu'elle seule ecrit */
  const MODIFIABLES = ["programme", "nutrition", "calculateur", "complements", "bilan", "accueil"];
  const modifiable = !Store.idConsulte || (Auth.estCoach() && MODIFIABLES.indexOf(outil.id) > -1);
  $("vue").className = modifiable ? "wrap" : "wrap lecture-seule";

  const fin = verrouille ? null : ((await outil.init()) || null);
  /* une autre page a ete demandee pendant le chargement : sa fonction de sortie
     est deja en place ; celle-ci est perimee (on l'execute tout de suite) */
  if (jeton !== affichage){ if (typeof fin === "function") fin(); return; }
  nettoyage = fin;
  if (avecDonnees){ initSauvegarde(); }
  const sortir = $("sortir-fiche");
  if (sortir) sortir.addEventListener("click", () => {
    Store.oublier(Store.idConsulte); Store.idConsulte = null; Store.nomConsulte = null; location.hash = "#/clients";
  });

  brancherInstallation();

  marquerNav(outil.id);
  if (!silencieux) window.scrollTo(0, 0);
}

/* ------------------------------------------------------------------
   « Ajoute l'application à ton écran d'accueil »
   Le mode d'emploi n'est pas le meme selon le telephone, et il n'y a
   aucun moyen fiable de le detecter : on montre celui qui correspond,
   et on laisse le choix de voir l'autre. Une fois que la personne a
   clique sur « C'est fait », la banniere ne revient plus — le reglage
   reste sur son appareil, puisqu'il ne concerne QUE cet appareil.
   ------------------------------------------------------------------ */
const CLE_INSTALL = "mhx_installe";

/* Le manifeste est embarque dans le fichier, donc sans adresse de base : sans
   start_url ni scope, « ajouter a l'ecran d'accueil » ouvrirait la racine du
   domaine au lieu de l'application. On les recalcule au demarrage depuis
   l'adresse reelle — l'application tourne ainsi sur n'importe quel
   hebergement, y compris dans un sous-dossier, sans etre retouchee. */
function ancrerManifeste(){
  const lien = document.getElementById("manifeste");
  if (!lien || !lien.href || lien.href.indexOf("data:") !== 0) return;
  try {
    const brut = decodeURIComponent(lien.href.replace(/^data:application\/manifest\+json,/, ""));
    const m = JSON.parse(brut);
    const ici = location.origin + location.pathname;
    m.start_url = ici;
    m.scope = ici.replace(/[^/]*$/, "");     // le dossier qui contient la page
    const blob = new Blob([JSON.stringify(m)], { type: "application/manifest+json" });
    lien.href = URL.createObjectURL(blob);
  } catch(e){ /* le manifeste reste tel quel : l'application fonctionne quand meme */ }
}

function dejaInstalle(){
  /* lancee depuis l'ecran d'accueil : la question ne se pose plus */
  if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
  if (window.navigator && window.navigator.standalone) return true;
  try {
    if (sessionStorage.getItem(CLE_INSTALL) === "1") return true;   // « plus tard »
    return localStorage.getItem(CLE_INSTALL) === "1";               // « c'est fait »
  } catch(e){ return false; }
}

/* La banniere n'apparait qu'a partir de la 2e visite. A la toute premiere,
   le nouveau client doit voir son espace et remplir son profil : une grande
   fenetre qui masque tout, c'est la pire premiere impression (retour QA de
   GROK, 22/09). Une visite = une ouverture de l'application, comptee une
   seule fois meme si on change d'onglet. */
function visiteSuivante(){
  try {
    if (!sessionStorage.getItem("mhx_visite_comptee")){
      sessionStorage.setItem("mhx_visite_comptee", "1");
      localStorage.setItem("mhx_visites", String((parseInt(localStorage.getItem("mhx_visites"), 10) || 0) + 1));
    }
    return (parseInt(localStorage.getItem("mhx_visites"), 10) || 0) >= 2;
  } catch(e){ return true; }
}

function bandeauInstallation(){
  if (!Auth.connecte() || Store.idConsulte || dejaInstalle() || !visiteSuivante()) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent || "");
  return `<div class="installe" id="installe">
    <button type="button" class="fermer" id="inst-plus-tard" aria-label="Plus tard">×</button>
    <h3>Mets ${esc(CONFIG.marque.nom)} sur ton écran d'accueil</h3>
    <p>Tu l'ouvres d'un doigt, elle s'affiche en plein écran, et tu n'as plus à retenir l'adresse.</p>
    <ol id="inst-etapes">${ios ? etapesIOS() : etapesAndroid()}</ol>
    <p class="note" style="margin:0 0 12px">
      <button type="button" class="lien-bouton" id="inst-bascule">${ios ? "Je suis sur Android ou ordinateur" : "Je suis sur iPhone"}</button>
    </p>
    <div class="actions">
      <button class="btn" id="inst-fait">C'est fait</button>
      <button class="btn ghost" id="inst-plus-tard-2">Plus tard</button>
    </div>
  </div>`;
}

function etapesIOS(){
  return `<li>Touche le bouton <b>Partager</b> en bas de Safari — le carré avec une flèche vers le haut.</li>
          <li>Fais défiler et choisis <b>« Sur l'écran d'accueil »</b>.</li>
          <li>Touche <b>Ajouter</b> en haut à droite.</li>`;
}
function etapesAndroid(){
  return `<li>Ouvre le menu de ton navigateur — les trois points en haut à droite.</li>
          <li>Choisis <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>.</li>
          <li>Confirme.</li>`;
}

function brancherInstallation(){
  const boite = $("installe");
  if (!boite) return;
  let ios = /iphone|ipad|ipod/i.test(navigator.userAgent || "");

  const bascule = $("inst-bascule");
  if (bascule) bascule.addEventListener("click", () => {
    ios = !ios;
    $("inst-etapes").innerHTML = ios ? etapesIOS() : etapesAndroid();
    bascule.textContent = ios ? "Je suis sur Android ou ordinateur" : "Je suis sur iPhone";
  });

  const fait = $("inst-fait");
  if (fait) fait.addEventListener("click", () => {
    try { localStorage.setItem(CLE_INSTALL, "1"); } catch(e){}
    boite.remove();
  });

  /* « Plus tard » ne ferme que pour cette visite : la banniere reviendra
     a la prochaine ouverture, mais pas dans cette session. */
  const plusTard = () => { boite.remove(); sessionStorage.setItem(CLE_INSTALL, "1"); };
  const b1 = $("inst-plus-tard"), b2 = $("inst-plus-tard-2");
  if (b1) b1.addEventListener("click", plusTard);
  if (b2) b2.addEventListener("click", plusTard);
}

function routeDepuisAdresse(){
  let id = (location.hash || "").replace(/^#\/?/, "");
  if (id.indexOf("=") > -1 || id.indexOf("&") > -1) id = "";
  if (ALIAS_ROUTES[id]) id = ALIAS_ROUTES[id];
  afficher(outilsVisibles().some(o => o.id === id) ? id : outilParDefaut());
}

/* ---------------------- ÉCRAN DE CONNEXION ---------------------- */
function portail(mode){
  /* v39 : « inscription » n'existe que si l'inscription libre est ouverte */
  const libre = !!(CONFIG.marque && CONFIG.marque.inscription_libre);
  mode = (mode === "oubli") ? "oubli" : (mode === "inscription" && libre) ? "inscription" : "connexion";
  const titre = mode === "oubli" ? "Mot de passe oublié" : mode === "inscription" ? "Crée ton compte" : "Connexion à ton espace";
  const bouton = mode === "oubli" ? "Recevoir le lien" : mode === "inscription" ? "Créer mon compte" : "Se connecter";
  document.body.innerHTML = `
  <div class="portail">
    <div class="carte-co">
      <button type="button" class="co-langue" id="co-langue" data-notr>${I18N.langue === "en" ? "🇫🇷 Français" : "🇺🇸 English"}</button>
      <button type="button" class="co-langue co-theme" data-theme-bouton data-notr></button>
      ${CONFIG.marque.logo ? `<img class="logo-img" src="${esc(CONFIG.marque.logo)}" alt="${esc(CONFIG.marque.nom)}">` : ""}
      <div class="logo">${esc(CONFIG.marque.nom)}</div>
      ${CONFIG.marque.programme ? `<div class="sous">${esc(CONFIG.marque.programme)}</div>` : ""}
      <h2>${titre}</h2>
      <div id="co-err"></div>
      ${mode === "inscription" ? `<div class="champ"><label for="c-prenom">Ton prénom</label><input id="c-prenom" type="text" autocomplete="given-name"></div>
      <div class="champ"><label for="c-nom">Ton nom</label><input id="c-nom" type="text" autocomplete="family-name"></div>` : ""}
      <div class="champ"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="email"></div>
      ${mode !== "oubli" ? `<div class="champ"><label for="c-mdp">Mot de passe</label><input id="c-mdp" type="password" autocomplete="${mode === "inscription" ? "new-password" : "current-password"}"></div>` : ""}
      ${mode === "inscription" ? `<div class="champ"><label for="c-mdp2">Confirme ton mot de passe</label><input id="c-mdp2" type="password" autocomplete="new-password"></div>` : ""}
      ${mode !== "oubli" ? `<label class="co-rester"><input type="checkbox" id="c-rester" checked><span>Rester connecté</span></label>` : ""}
      <button class="btn" id="c-go">${bouton}</button>
      ${CONFIG.marque.version ? `<p class="co-aide">v${esc(CONFIG.marque.version)}</p>` : ""}
      <div class="bascule">
        ${mode === "connexion"
          ? `<button type="button" data-mode="oubli">Mot de passe oublié ?</button>${libre ? `<button type="button" data-mode="inscription">Créer mon compte</button>` : ""}`
          : mode === "inscription"
          ? `<button type="button" data-mode="connexion">J'ai déjà un compte</button>`
          : `<button type="button" data-mode="connexion">Retour à la connexion</button>`}
      </div>
    </div>
  </div>`;

  const err = (msg, ok) => { const e = $("co-err"); e.className = "erreur" + (ok ? " ok" : ""); e.textContent = msg; };

  $$("[data-mode]").forEach(b => b.addEventListener("click", () => portail(b.dataset.mode)));
  Theme.majBoutons();
  $("co-langue").addEventListener("click", () => {
    const ok = I18N.choisir(I18N.langue === "en" ? "fr" : "en");
    if (ok) location.reload(); else portail(mode);
  });

  const valider = async () => {
    const email = ($("c-email").value || "").trim();
    const mdp = $("c-mdp") ? $("c-mdp").value : "";
    if (!email){ err("Indique ton email."); return; }
    /* le choix doit etre pris AVANT la connexion : c'est lui qui decide
       ou la session sera rangee */
    const rester = $("c-rester");
    Auth.persistant = rester ? rester.checked : true;
    const b = $("c-go");
    if (mode === "inscription"){
      const prenom = ($("c-prenom").value || "").trim(), nom = ($("c-nom").value || "").trim();
      if (!prenom){ err("Indique ton prénom."); return; }
      if (mdp.length < 8){ err("Le mot de passe doit faire au moins 8 caractères."); return; }
      if (mdp !== ($("c-mdp2") ? $("c-mdp2").value : "")){ err("Les deux mots de passe ne sont pas identiques."); return; }
      b.disabled = true; b.textContent = "Un instant…";
      try {
        const connecte = await Auth.inscrire(email, mdp, prenom, nom);
        if (connecte){ location.hash = ""; location.reload(); return; }
        err("Compte créé. Ouvre le lien reçu par email pour le confirmer, puis connecte-toi.", true);
      } catch(e){
        const m = (e.message || "").toLowerCase();
        err(m.indexOf("already") > -1 || m.indexOf("registered") > -1 ? "Un compte existe déjà avec cet email : connecte-toi."
          : m.indexOf("disabled") > -1 || m.indexOf("not allowed") > -1 ? "Les inscriptions ne sont pas encore ouvertes."
          : e.message || "Une erreur est survenue.");
      }
      b.disabled = false; b.textContent = bouton;
      return;
    }
    b.disabled = true; b.textContent = "Un instant…";
    try {
      if (mode === "oubli"){
        await Auth.motDePasseOublie(email);
        err("Si un compte existe pour cet email, tu vas recevoir un lien.", true);
      } else {
        await Auth.connecter(email, mdp);
        location.reload();
      }
    } catch(e){
      const m = (e.message || "").toLowerCase();
      err(m.indexOf("invalid") > -1 ? "Email ou mot de passe incorrect."
        : m.indexOf("password") > -1 ? "Le mot de passe doit faire au moins 6 caractères."
        : e.message || "Une erreur est survenue.");
    }
    b.disabled = false;
    b.textContent = bouton;
  };

  $("c-go").addEventListener("click", valider);
  /* Un seul ecouteur a la fois. Avant, chaque aller-retour « mot de passe
     oublie » en ajoutait un : Entree envoyait alors un email de
     reinitialisation EN PLUS de la connexion. */
  if (portail._entree) document.removeEventListener("keydown", portail._entree);
  portail._entree = e => { if (e.key === "Enter") valider(); };
  document.addEventListener("keydown", portail._entree);
}

/* ---------------------- NOUVEAU MOT DE PASSE ----------------------
   Quand le client clique sur le lien recu par email, Supabase le renvoie
   ici avec un jeton dans l'adresse. On lui fait choisir son mot de passe. */
function lireAdresse(){
  const h = (location.hash || "").replace(/^#\/?/, "");
  const p = {};
  h.split("&").forEach(kv => {
    const [k, v] = kv.split("=");
    if (k) p[decodeURIComponent(k)] = decodeURIComponent((v || "").replace(/\+/g, " "));
  });
  return p;
}

function ecranNouveauMotDePasse(jeton){
  document.body.innerHTML = `
  <div class="portail">
    <div class="carte-co">
      ${CONFIG.marque.logo ? `<img class="logo-img" src="${esc(CONFIG.marque.logo)}" alt="${esc(CONFIG.marque.nom)}">` : ""}
      <div class="logo">${esc(CONFIG.marque.nom)}</div>
      ${CONFIG.marque.programme ? `<div class="sous">${esc(CONFIG.marque.programme)}</div>` : ""}
      <h2>Choisis ton nouveau mot de passe</h2>
      <div id="co-err"></div>
      <div class="champ"><label for="r-mdp">Nouveau mot de passe</label><input id="r-mdp" type="password" autocomplete="new-password"></div>
      <div class="champ"><label for="r-mdp2">Confirme-le</label><input id="r-mdp2" type="password" autocomplete="new-password"></div>
      <button class="btn" id="r-go">Enregistrer</button>
    </div>
  </div>`;
  const err = (m, ok) => { const e = $("co-err"); e.className = "erreur" + (ok ? " ok" : ""); e.textContent = m; };
  $("r-go").addEventListener("click", async () => {
    const a = $("r-mdp").value, b = $("r-mdp2").value;
    if (a.length < 6){ err("Le mot de passe doit faire au moins 6 caractères."); return; }
    if (a !== b){ err("Les deux mots de passe ne sont pas identiques."); return; }
    const bouton = $("r-go"); bouton.disabled = true; bouton.textContent = "Un instant…";
    try {
      await fetch(CONFIG.supabase.url + "/auth/v1/user", {
        method: "PUT",
        headers: { "apikey": CONFIG.supabase.cle, "Content-Type": "application/json", "Authorization": "Bearer " + jeton },
        body: JSON.stringify({ password: a })
      }).then(async r => { if (!r.ok) throw new Error((await r.json()).msg || "Lien expiré."); });
      err("Mot de passe enregistré. Tu peux te connecter.", true);
      setTimeout(() => { location.hash = ""; location.reload(); }, 1400);
    } catch(e){
      err(e.message || "Ce lien n'est plus valable. Redemande-en un depuis « Mot de passe oublié ».");
      bouton.disabled = false; bouton.textContent = "Enregistrer";
    }
  });
}

/* ---------------------- DÉMARRAGE ---------------------- */
let premiereFois = false;

(async function demarrer(){
  I18N.charger();
  Traduction.demarrer();
  ancrerManifeste();
  const p = lireAdresse();

  /* lien de reinitialisation recu par email */
  if (p.type === "recovery" && p.access_token){ ecranNouveauMotDePasse(p.access_token); return; }
  if (p.error_description){
    Auth.oublier();
    portail("connexion");
    setTimeout(() => { const e = $("co-err"); if (e){ e.className = "erreur"; e.textContent = p.error_description; } }, 60);
    return;
  }

  Auth.charger();
  /* Les comptes sont crees par le coach. L'inscription libre (v39) n'existe que
     si CONFIG.marque.inscription_libre vaut true : #/inscription ouvre alors la
     creation de compte ; sinon, l'ecran de connexion comme n'importe quelle autre adresse. */
  if (!Auth.connecte()){ portail(/inscription/.test(location.hash) ? "inscription" : "connexion"); return; }
  const ok = await Auth.assurer();
  if (!ok){ portail("connexion"); return; }
  try { await Auth.chargerProfil(); } catch(e){}

  /* la langue choisie sur un autre appareil l'emporte */
  try {
    const pr = await Store.lire("prefs", {});
    if (pr && (pr.langue === "en" || pr.langue === "fr") && pr.langue !== I18N.langue){
      const ok = I18N.choisir(pr.langue);
      if (pr.langue === "fr" && ok){ location.reload(); return; }
      if (pr.langue === "en") Traduction.noeud(document.body);
    }
  } catch(e){}

  construireNav();
  Contenus.charger();
  window.addEventListener("hashchange", routeDepuisAdresse);

  /* Premiere connexion d'un client : on l'envoie remplir son profil */
  if (!Auth.estCoach()){
    const intake = await Store.lire("intake", {});
    if (!intake || !intake.complet){
      premiereFois = true;
      location.hash = "#/profil";
      await afficher("profil");
      const v = $("vue");
      const mot = document.createElement("div");
      mot.className = "bandeau";
      const dejaVenu = intake && Object.keys(intake).length > 3;
      mot.innerHTML = dejaVenu
        ? `<strong>Une réponse manque à ton profil.</strong><span class="note">Une question a été ajoutée depuis ton inscription. Complète-la et enregistre : ça prend dix secondes.</span>`
        : `<strong>Bienvenue !</strong><span class="note">Commence par remplir ton profil : c'est ce qui permet à ton coach de construire ton suivi.</span>`;
      v.insertBefore(mot, v.firstChild);
      return;
    }
  }

  routeDepuisAdresse();
})();
</script>
